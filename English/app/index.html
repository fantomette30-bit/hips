 la reprendre à son compte.","examples":[{"wrong":null,"right":"The manager [[is alleged to have]] made discriminatory remarks.","note_fr":"'Is alleged to have' + participe passé : 'aurait tenu' (conditionnel journalistique français)."},{"wrong":null,"right":"Notice [[is deemed to]] be received two days after posting.","note_fr":"'Is deemed to' : 'est réputé'."}]}],"exercises":[{"type":"mcq","prompt":"The contract ___ by both parties last Friday.","options":["signed","was signed","has been signed","is signed"],"answer":1,"explain_fr":"Passif au prétérit : 'last Friday' exclut le present perfect."},{"type":"mcq","prompt":"I ___ a copy of the investigation report yesterday.","options":["was given","have given","was gave","am given"],"answer":0,"explain_fr":"'On m'a remis' : la personne devient sujet du passif."},{"type":"mcq","prompt":"(policy) Which drafting makes it clearest who must act?","options":["Leave requests must be approved.","It is required that leave requests are approved.","Approval of leave requests is required.","The line manager must approve leave requests."],"answer":3,"explain_fr":"Seule la phrase active désigne le responsable."},{"type":"mcq","prompt":"He ___ to have falsified his timesheets.","options":["alleges","is alleging","is alleged","has alleged"],"answer":2,"explain_fr":"'Is alleged to have' + participe passé : 'il aurait falsifié'."},{"type":"gap","prompt":"The hearing ___ (postpone) until further notice.","answer":"has been postponed","accept":["was postponed","is postponed"],"explain_fr":"Passif ; le present perfect annonce une nouvelle dont l'effet est actuel."},{"type":"gap","prompt":"All new starters ___ (give) a copy of the handbook on their first day.","answer":"are given","accept":["will be given","must be given"],"explain_fr":"Pratique habituelle : passif au présent, la personne en sujet."},{"type":"gap","prompt":"I ___ (tell) that the position had already been filled.","answer":"was told","accept":["had been told"],"explain_fr":"'On m'a dit que' = 'I was told that'."},{"type":"rewrite","prompt":"Rewrite in the active (more natural in speech): 'A decision will be made by the board next week.'","answer":"The board will make a decision next week.","accept":["The board will decide next week.","The board will take a decision next week.","The board is going to decide next week."],"explain_fr":"L'agent devient sujet ; 'decide' seul est encore plus léger."},{"type":"rewrite","prompt":"Rewrite in the passive (the actor is irrelevant): 'Someone has sent the letter to the wrong address.'","answer":"The letter has been sent to the wrong address.","accept":["The letter was sent to the wrong address."],"explain_fr":"'Someone' disparaît : le passif sert justement à cela."},{"type":"rewrite","prompt":"Rewrite starting with 'She': 'They offered her a settlement of three months' pay.'","answer":"She was offered a settlement of three months' pay.","accept":["She has been offered a settlement of three months' pay."],"explain_fr":"Le complément indirect ('her') devient sujet : 'She was offered'."}]},{"id":"gr-conditions","track":"legal","title":"Conditionals and 'provided that', 'subject to', 'unless', 'in the event that'","title_fr":"Le conditionnel et 'provided that', 'subject to', 'unless', 'in the event that'","points":[{"rule":"No 'will' or 'would' in the if-clause: use the present for a future condition and the past perfect for an unreal past.","rule_fr":"Jamais 'will' ni 'would' dans la subordonnée en 'if' : présent pour une condition future, past perfect pour l'irréel du passé.","examples":[{"wrong":"If the Employee will breach this clause, the Company may terminate the contract.","right":"If the Employee [[breaches]] this clause, the Company may terminate the contract.","note_fr":"Présent simple après 'if', même pour un fait futur."},{"wrong":"If I would have known, I would have told you.","right":"If I [[had known]], I would have told you.","note_fr":"Irréel du passé : 'if' + past perfect, 'would have' dans la principale seulement."}]},{"rule":"'Provided that' (formal) and 'as long as' (everyday) mean 'only if' and take a present tense.","rule_fr":"'Provided that' (soutenu) et 'as long as' (courant) signifient 'à condition que' et sont suivis du présent, pas du subjonctif ni de 'will'.","examples":[{"wrong":null,"right":"The bonus is payable [[provided that]] the Employee is still employed on the payment date.","note_fr":"Condition suspensive typique d'une clause de bonus."},{"wrong":null,"right":"You can work from home [[as long as]] your manager agrees.","note_fr":"Même idée, registre de la conversation."}]},{"rule":"'Subject to' + noun makes something conditional on, or limited by, something else.","rule_fr":"'Subject to' + nom : 'sous réserve de'. En tête de clause, il subordonne la clause à une autre.","examples":[{"wrong":"The offer is submitted to satisfactory references.","right":"The offer is [[subject to]] satisfactory references.","note_fr":"'Soumis à' = 'subject to'. 'Submitted to' signifie 'remis à'."},{"wrong":null,"right":"[[Subject to]] clause 8, either party may terminate this agreement on one month's notice.","note_fr":"La clause 8 prévaut en cas de conflit."}]},{"rule":"'Unless' means 'except if' and is followed by an affirmative verb.","rule_fr":"'Unless' = 'sauf si', 'à moins que' ; le verbe qui suit est à la forme affirmative (pas de 'ne' explétif à traduire).","examples":[{"wrong":"Unless you don't object, we will proceed on Monday.","right":"[[Unless]] you object, we will proceed on Monday.","note_fr":"'Unless' porte déjà la négation."},{"wrong":null,"right":"No deduction may be made [[unless]] the Employee has agreed in writing.","note_fr":"Tournure fréquente : interdiction + exception."}]},{"rule":"'In the event that' + clause, 'in the event of' + noun and 'Should' + inversion are formal alternatives to 'if'. 'In case' expresses a precaution, not a condition.","rule_fr":"'In the event that' + proposition, 'in the event of' + nom et 'Should' + inversion remplacent 'if' dans un texte formel. 'In case' exprime une précaution, pas une condition.","examples":[{"wrong":null,"right":"[[In the event of]] a dispute, the parties will first attempt mediation.","note_fr":"'En cas de litige' : 'in the event of' + nom."},{"wrong":null,"right":"[[Should]] you require any adjustments, please let us know.","note_fr":"Inversion formelle = 'If you require'. Très courante dans les lettres."},{"wrong":"In case you are ill, call HR before 9 a.m.","right":"[[If]] you are ill, call HR before 9 a.m.","note_fr":"'In case' = 'au cas où, par précaution' : 'Take my number in case you need it.'"}]}],"exercises":[{"type":"mcq","prompt":"If the candidate ___ the offer, we will readvertise the post.","options":["will refuse","refuses","would refuse","refused"],"answer":1,"explain_fr":"Condition future : présent simple après 'if'."},{"type":"mcq","prompt":"The offer of employment is ___ satisfactory references and proof of the right to work.","options":["submitted to","provided that","subject to","unless"],"answer":2,"explain_fr":"'Subject to' + nom : 'sous réserve de'."},{"type":"mcq","prompt":"___ you hear from us by Friday, please assume the meeting is going ahead.","options":["Unless","Provided that","In case","Subject to"],"answer":0,"explain_fr":"'Sauf avis contraire de notre part' : 'unless'."},{"type":"mcq","prompt":"If she ___ the warning seriously, she would not have been dismissed.","options":["took","would take","would have taken","had taken"],"answer":3,"explain_fr":"Irréel du passé : 'if' + past perfect."},{"type":"gap","prompt":"The bonus will be paid provided that the targets ___ (meet).","answer":"are met","accept":["have been met"],"explain_fr":"Présent (passif) après 'provided that', jamais 'will be met'."},{"type":"gap","prompt":"___ you have any questions, please do not hesitate to contact me. [formal inversion, one word]","answer":"Should","accept":[],"explain_fr":"'Should you have' = 'If you have', formule de fin de lettre."},{"type":"gap","prompt":"In the event ___ a serious breach, the Company may dismiss without notice. [one word]","answer":"of","accept":[],"explain_fr":"'In the event of' + nom ; 'in the event that' + proposition."},{"type":"rewrite","prompt":"Rewrite with 'unless': 'If you do not return the form by 30 June, your claim will lapse.'","answer":"Unless you return the form by 30 June, your claim will lapse.","accept":["Your claim will lapse unless you return the form by 30 June."],"explain_fr":"'If... not' devient 'unless' + verbe affirmatif."},{"type":"rewrite","prompt":"Rewrite with 'subject to': 'You will receive the payment only if you sign the settlement agreement.'","answer":"The payment is subject to your signing the settlement agreement.","accept":["The payment is subject to you signing the settlement agreement.","Payment is subject to your signing the settlement agreement.","Payment is subject to you signing the settlement agreement.","The payment is subject to signature of the settlement agreement.","Payment is subject to signature of the settlement agreement.","The payment is subject to your signature of the settlement agreement."],"explain_fr":"'Subject to' + nom ou + possessif + -ing."},{"type":"rewrite","prompt":"Rewrite as one sentence with 'provided that': 'You may carry over five days. The condition is that your manager agrees.'","answer":"You may carry over five days provided that your manager agrees.","accept":["You may carry over five days, provided that your manager agrees.","You may carry over five days provided your manager agrees.","You may carry over five days, provided your manager agrees.","Provided that your manager agrees, you may carry over five days.","Provided your manager agrees, you may carry over five days."],"explain_fr":"'Provided (that)' + présent."}]},{"id":"gr-perfect","track":"intermediate","title":"Present perfect or past simple?","title_fr":"Present perfect ou prétérit ?","points":[{"rule":"A finished time (yesterday, last week, in 2019, two days ago) requires the past simple.","rule_fr":"Un repère de temps révolu (yesterday, last week, in 2019, two days ago) impose le prétérit. Le passé composé français induit en erreur.","examples":[{"wrong":"I have sent the contract yesterday.","right":"I [[sent]] the contract yesterday.","note_fr":"'Yesterday' = moment révolu, donc prétérit."},{"wrong":"She has joined the company in 2019.","right":"She [[joined]] the company in 2019.","note_fr":"Date passée précise : prétérit."}]},{"rule":"A situation that started in the past and is still true takes the present perfect with 'for' or 'since'.","rule_fr":"Une situation commencée dans le passé et toujours vraie se dit au present perfect, avec 'for' (durée) ou 'since' (point de départ) - jamais au présent.","examples":[{"wrong":"I work here since 2019.","right":"I [[have worked]] here since 2019.","note_fr":"'Depuis' + présent français = present perfect anglais."},{"wrong":"She is on sick leave since three weeks.","right":"She [[has been]] on sick leave for three weeks.","note_fr":"Durée : 'for three weeks'. 'Since' exige un point de départ ('since 3 May')."}]},{"rule":"For recent news with 'just', 'already' and 'yet', British English uses the present perfect; American English often uses the past simple.","rule_fr":"Pour une nouvelle récente avec 'just', 'already', 'yet', l'anglais britannique emploie le present perfect ; l'anglais américain utilise souvent le prétérit. Les deux sont corrects : soyez cohérent avec votre interlocuteur.","examples":[{"wrong":null,"right":"I [[have just spoken]] to her manager.","note_fr":"Version américaine courante : 'I just spoke to her manager.'"},{"wrong":null,"right":"[[Have you sent]] the offer letter yet?","note_fr":"Version américaine courante : 'Did you send the offer letter yet?'"}]},{"rule":"Experience up to now ('ever', 'never', 'so far') and 'It's the first time...' take the present perfect.","rule_fr":"Le bilan jusqu'à maintenant ('ever', 'never', 'so far') et 'It's the first time...' demandent le present perfect.","examples":[{"wrong":"It's the first time I see this clause.","right":"It's the first time I [[have seen]] this clause.","note_fr":"'C'est la première fois que je vois' : present perfect obligatoire."},{"wrong":null,"right":"We [[have never had]] a tribunal claim.","note_fr":"Jusqu'à aujourd'hui : la période n'est pas terminée."}]}],"exercises":[{"type":"mcq","prompt":"She ___ her notice last Monday.","options":["has handed in","handed in","has been handing in","hands in"],"answer":1,"explain_fr":"'Last Monday' : prétérit."},{"type":"mcq","prompt":"He ___ for us since January.","options":["works","is working","has worked","worked"],"answer":2,"explain_fr":"'Since January' et toujours vrai : present perfect."},{"type":"mcq","prompt":"Which sentence is typically American rather than British?","options":["Did you already send the offer letter?","Have you already sent the offer letter?","I've just sent it.","I haven't sent it yet."],"answer":0,"explain_fr":"Prétérit avec 'already' : usage américain courant. Un Britannique dirait 'Have you already sent...?'."},{"type":"mcq","prompt":"It's the first time we ___ someone during probation.","options":["dismiss","are dismissing","dismissed","have dismissed"],"answer":3,"explain_fr":"'It's the first time' + present perfect."},{"type":"gap","prompt":"We ___ (receive) three grievances so far this year.","answer":"have received","accept":["'ve received","we've received"],"explain_fr":"'So far this year' : période en cours, present perfect."},{"type":"gap","prompt":"The union ___ (call) a strike two weeks ago.","answer":"called","accept":[],"explain_fr":"'Ago' impose le prétérit."},{"type":"gap","prompt":"How long ___ (she / be) on maternity leave?","answer":"has she been","accept":[],"explain_fr":"'Depuis combien de temps est-elle...' : present perfect, pas présent."},{"type":"rewrite","prompt":"Correct the sentence: 'I am working in HR since ten years.'","answer":"I have been working in HR for ten years.","accept":["I have worked in HR for ten years.","I've been working in HR for ten years.","I've worked in HR for ten years."],"explain_fr":"Present perfect (simple ou continu) + 'for' + durée."},{"type":"rewrite","prompt":"Rewrite in British English: 'I already spoke to the union rep.'","answer":"I have already spoken to the union rep.","accept":["I've already spoken to the union rep."],"explain_fr":"Avec 'already', l'anglais britannique préfère le present perfect."},{"type":"rewrite","prompt":"Rewrite starting with 'She joined' and using 'ago': 'She has been with the company for five years.'","answer":"She joined the company five years ago.","accept":[],"explain_fr":"Durée jusqu'à maintenant = present perfect ; événement daté = prétérit + 'ago'."}]},{"id":"gr-articles","track":"intermediate","title":"Articles: a, the or nothing - and uncountable nouns","title_fr":"Les articles : a, the ou rien - et les noms indénombrables","points":[{"rule":"Advice, information, training, feedback, evidence, equipment, research and legislation are uncountable: no 'a', no plural.","rule_fr":"Advice, information, training, feedback, evidence, equipment, research, legislation sont indénombrables : ni 'a', ni pluriel, verbe au singulier. Pour compter : 'a piece of advice', 'a training session', 'an item of evidence'.","examples":[{"wrong":"Thank you for these informations.","right":"Thank you for [[this information]].","note_fr":"'Information' ne prend jamais de s ; démonstratif au singulier."},{"wrong":"She gave me a good advice.","right":"She gave me [[some good advice]].","note_fr":"'Un conseil' = 'some advice' ou 'a piece of advice'."},{"wrong":"I have a training tomorrow.","right":"I have [[a training session]] tomorrow.","note_fr":"'Une formation' = 'a training session', 'a training course' ou 'training' tout court."}]},{"rule":"'Staff' is a collective noun: it means the whole workforce and has no plural for individuals.","rule_fr":"'Staff' est un nom collectif : il désigne l'ensemble du personnel. Pour des individus : 'members of staff', 'employees'. Verbe pluriel au Royaume-Uni ('the staff are'), singulier aux États-Unis ('the staff is').","examples":[{"wrong":"We have 200 staffs.","right":"We have 200 [[members of staff]].","note_fr":"On dit aussi 'a staff of 200' ou '200 employees'."},{"wrong":null,"right":"The staff [[are]] unhappy about the new rota.","note_fr":"Accord pluriel britannique ; un Américain écrirait 'The staff is unhappy about the new schedule'."}]},{"rule":"No article for general statements with plural or uncountable nouns.","rule_fr":"Pas d'article pour une généralité avec un pluriel ou un indénombrable, là où le français met 'le', 'la', 'les'.","examples":[{"wrong":"The discrimination is prohibited by the law.","right":"[[Discrimination]] is prohibited by law.","note_fr":"Notion générale : article zéro. 'By law' est une expression figée."},{"wrong":"The French employment law is very protective.","right":"[[French employment law]] is very protective.","note_fr":"'Law' au sens du droit en général : pas d'article. 'The law' = la loi, le texte précis."}]},{"rule":"Use 'the' when both speakers know exactly which thing is meant.","rule_fr":"'The' quand l'élément est identifié par le contexte ou par ce qui suit (complément, relative).","examples":[{"wrong":null,"right":"[[The evidence]] presented at the hearing was weak.","note_fr":"Des preuves précises : celles présentées à l'audience."},{"wrong":null,"right":"Could you send me [[the feedback]] from Tuesday's interviews?","note_fr":"Défini par 'from Tuesday's interviews'."}]},{"rule":"Jobs take 'a' or 'an'; a unique post after 'appoint', 'elect' or 'as' usually takes no article.","rule_fr":"Les noms de métier prennent 'a' / 'an' ; un poste unique après 'appoint', 'elect' ou 'as' se passe souvent d'article.","examples":[{"wrong":"She is lawyer.","right":"She is [[a lawyer]].","note_fr":"Article obligatoire devant un métier."},{"wrong":"He works as consultant.","right":"He works as [[a consultant]].","note_fr":"Même règle après 'as'."},{"wrong":null,"right":"She was appointed [[Head of HR]] in March.","note_fr":"Fonction unique dans l'organisation : pas d'article."}]}],"exercises":[{"type":"mcq","prompt":"Could you give me ___ on this clause?","options":["an advice","some advice","some advices","the advices"],"answer":1,"explain_fr":"'Advice' est indénombrable : 'some advice'."},{"type":"mcq","prompt":"___ is essential for new managers.","options":["A training","The trainings","Training","Trainings"],"answer":2,"explain_fr":"Généralité + indénombrable : article zéro."},{"type":"mcq","prompt":"She has worked as ___ for ten years.","options":["an employment lawyer","employment lawyer","the employment lawyer","one employment lawyer"],"answer":0,"explain_fr":"Métier : article indéfini obligatoire."},{"type":"mcq","prompt":"There ___ to support the allegation.","options":["are no evidences","is no an evidence","are not evidences","is no evidence"],"answer":3,"explain_fr":"'Evidence' : indénombrable, verbe au singulier."},{"type":"gap","prompt":"We received very positive ___ from the candidates. [feedback / feedbacks / a feedback]","answer":"feedback","accept":[],"explain_fr":"'Feedback' est indénombrable."},{"type":"gap","prompt":"Two members of ___ have complained about the new rota. [one word]","answer":"staff","accept":["the staff"],"explain_fr":"'Members of staff' pour compter des personnes."},{"type":"gap","prompt":"She is ___ employment lawyer at a Paris firm. [a / an / the]","answer":"an","accept":[],"explain_fr":"'An' devant un son vocalique."},{"type":"rewrite","prompt":"Correct the sentence: 'Thank you for all the informations and the advices.'","answer":"Thank you for all the information and advice.","accept":["Thank you for all the information and the advice.","Thank you for all your information and advice.","Thank you for all the information and all the advice."],"explain_fr":"Deux indénombrables : pas de s."},{"type":"rewrite","prompt":"Correct the sentence: 'The harassment at work is forbidden by the law.'","answer":"Harassment at work is forbidden by law.","accept":["Harassment at work is prohibited by law.","Workplace harassment is prohibited by law.","Workplace harassment is forbidden by law."],"explain_fr":"Généralité : article zéro ; 'by law' sans article."},{"type":"rewrite","prompt":"Correct the sentence: 'We are organising a training for all the staffs.'","answer":"We are organising a training session for all staff.","accept":["We are organising a training session for all the staff.","We are organising training for all staff.","We are organising training for all the staff.","We are organising a training course for all staff.","We are organising a training course for all the staff.","We are organizing a training session for all staff.","We are organizing training for all staff.","We are organising a training session for all members of staff."],"explain_fr":"'A training session' (ou 'training') ; 'staff' sans s."}]},{"id":"gr-gerund","track":"intermediate","title":"Gerund, infinitive and prepositions after common HR verbs","title_fr":"Gérondif, infinitif et prépositions après les verbes courants des RH","points":[{"rule":"When 'to' is a preposition, it is followed by -ing: look forward to, object to, be used to, be committed to.","rule_fr":"Quand 'to' est une préposition, il est suivi de -ing : look forward to, object to, be used to, be committed to, with a view to.","examples":[{"wrong":"I look forward to hear from you.","right":"I look forward to [[hearing]] from you.","note_fr":"Test : on peut dire 'I look forward to it', donc 'to' est une préposition."},{"wrong":"She objected to work on Sundays.","right":"She objected to [[working]] on Sundays.","note_fr":"'To object to' + -ing ou nom."},{"wrong":null,"right":"We are committed to [[promoting]] equal opportunities.","note_fr":"'Committed to' + -ing."}]},{"rule":"Suggest, recommend, consider, avoid, risk, deny, postpone and involve take -ing, never 'to' + verb.","rule_fr":"Suggest, recommend, consider, avoid, risk, deny, postpone, involve sont suivis de -ing, jamais de 'to' + verbe. 'Suggest' n'accepte pas la construction 'suggest someone to do'.","examples":[{"wrong":"I suggest you to contact the union.","right":"I suggest [[contacting]] the union.","note_fr":"Ou : 'I suggest (that) you contact the union.'"},{"wrong":"He denied to have seen the email.","right":"He denied [[having seen]] the email.","note_fr":"'Deny' + -ing ; à ne pas confondre avec 'refuse' + to."},{"wrong":null,"right":"We should avoid [[setting]] a precedent.","note_fr":"'Avoid' + -ing."}]},{"rule":"Agree, refuse, fail, undertake and intend take 'to' + verb; allow, require and ask take an object + 'to' + verb; 'be entitled to' takes a noun or a verb.","rule_fr":"Agree, refuse, fail, undertake, intend + 'to' + verbe ; allow, require, ask + complément + 'to' + verbe ; 'be entitled to' + nom ou + verbe.","examples":[{"wrong":"He refused signing the warning.","right":"He refused [[to sign]] the warning.","note_fr":"'Refuse' + to."},{"wrong":null,"right":"She is entitled [[to take]] 25 days' leave a year.","note_fr":"Aussi : 'entitled to 25 days' leave' (+ nom)."},{"wrong":null,"right":"The policy requires managers [[to record]] all absences.","note_fr":"'Require' + personne + to."}]},{"rule":"Learn the fixed prepositions: comply with, consist of, depend on, be responsible for, apply for, succeed in, participate in - and 'discuss' takes none.","rule_fr":"Prépositions figées : comply with, consist of, depend on, be responsible for, apply for, succeed in, participate in. 'Discuss' est transitif direct.","examples":[{"wrong":"All staff must comply to the policy.","right":"All staff must [[comply with]] the policy.","note_fr":"'Se conformer à' = 'comply with'."},{"wrong":"The panel consists in three managers.","right":"The panel [[consists of]] three managers.","note_fr":"'Consist of' = 'se compose de'. 'Is composed by' est également fautif ('is composed of')."},{"wrong":"We discussed about the bonus.","right":"We [[discussed]] the bonus.","note_fr":"Pas de préposition après 'discuss' ; mais 'a discussion about'."}]}],"exercises":[{"type":"mcq","prompt":"I look forward to ___ you at the hearing.","options":["see","seeing","be seeing","have seen"],"answer":1,"explain_fr":"'Look forward to' + -ing."},{"type":"mcq","prompt":"The works council objected to ___ consulted so late.","options":["be","have been","being","been"],"answer":2,"explain_fr":"'Object to' + -ing, ici au passif : 'being consulted'."},{"type":"mcq","prompt":"She is entitled ___ a company car.","options":["to","for","at","of"],"answer":0,"explain_fr":"'Entitled to' + nom."},{"type":"mcq","prompt":"The package consists ___ a basic salary and a bonus.","options":["in","on","with","of"],"answer":3,"explain_fr":"'Consist of'."},{"type":"gap","prompt":"I suggest ___ (postpone) the hearing until she returns.","answer":"postponing","accept":["that we postpone","we postpone"],"explain_fr":"'Suggest' + -ing (ou 'suggest that we postpone')."},{"type":"gap","prompt":"The employee failed ___ (comply) with a reasonable instruction.","answer":"to comply","accept":[],"explain_fr":"'Fail' + to."},{"type":"gap","prompt":"It depends ___ the wording of the contract. [one word]","answer":"on","accept":["upon"],"explain_fr":"'Depend on', jamais 'depend of'."},{"type":"rewrite","prompt":"Correct the sentence: 'I suggest you to send a written warning.'","answer":"I suggest sending a written warning.","accept":["I suggest you send a written warning.","I suggest that you send a written warning.","I would suggest sending a written warning.","I'd suggest sending a written warning."],"explain_fr":"'Suggest' + -ing ou 'suggest (that) you' + base verbale."},{"type":"rewrite","prompt":"Correct the sentence: 'We are used to work with American clients.'","answer":"We are used to working with American clients.","accept":["We're used to working with American clients."],"explain_fr":"'Be used to' + -ing (habitude acquise). 'Used to work' = 'travaillions autrefois'."},{"type":"rewrite","prompt":"Correct the sentence: 'He succeeded to negotiate a better package.'","answer":"He succeeded in negotiating a better package.","accept":["He managed to negotiate a better package."],"explain_fr":"'Succeed in' + -ing ; ou 'manage to' + verbe."}]}],"pronunciation":[{"id":"pr-stress","title":"Word stress in HR and legal vocabulary","title_fr":"L'accent de mot dans le vocabulaire RH et juridique","explain_fr":"En anglais, une syllabe par mot est nettement plus forte, plus longue et plus haute ; les autres sont réduites, souvent en /ə/. Un accent mal placé gêne davantage la compréhension qu'une voyelle approximative. Le français accentue la dernière syllabe : méfiez-vous des mots transparents. Plusieurs paires nom / verbe ne se distinguent que par l'accent : nom sur la première syllabe, verbe sur la seconde.","items":[{"text":"employee","ipa_uk":"/ɪmˈplɔɪiː/","ipa_us":"/ɪmˈplɔɪiː/","note_fr":"Accent sur 'ploy' (on entend aussi /ˌemplɔɪˈiː/). Ne pas confondre à l'oreille avec 'employer'."},{"text":"employer","ipa_uk":"/ɪmˈplɔɪə/","ipa_us":"/ɪmˈplɔɪər/","note_fr":"Finale réduite en /ə/ ; le r n'est prononcé qu'en anglais américain."},{"text":"redundancy","ipa_uk":"/rɪˈdʌndənsi/","ipa_us":"/rɪˈdʌndənsi/","note_fr":"Accent sur 'dun'. Terme britannique ; aux États-Unis on parle de 'layoff'."},{"text":"dismissal","ipa_uk":"/dɪsˈmɪs(ə)l/","ipa_us":"/dɪsˈmɪs(ə)l/","note_fr":"Accent sur 'miss'."},{"text":"grievance","ipa_uk":"/ˈɡriːv(ə)ns/","ipa_us":"/ˈɡriːv(ə)ns/","note_fr":"Deux syllabes seulement, accent sur la première."},{"text":"disciplinary","ipa_uk":"/ˈdɪsəplɪnəri/","ipa_us":"/ˈdɪsəpləneri/","note_fr":"Accent sur la première syllabe ; au Royaume-Uni on entend aussi /ˌdɪsəˈplɪnəri/."},{"text":"negotiate","ipa_uk":"/nɪˈɡəʊʃieɪt/","ipa_us":"/nɪˈɡoʊʃieɪt/","note_fr":"Accent sur 'go' ; le t se prononce /ʃ/."},{"text":"determine","ipa_uk":"/dɪˈtɜːmɪn/","ipa_us":"/dɪˈtɜːrmɪn/","note_fr":"Accent sur 'ter' ; la fin se dit /mɪn/, pas comme 'mine'."},{"text":"colleague","ipa_uk":"/ˈkɒliːɡ/","ipa_us":"/ˈkɑːliːɡ/","note_fr":"Accent sur la première syllabe, contrairement au français."},{"text":"develop","ipa_uk":"/dɪˈveləp/","ipa_us":"/dɪˈveləp/","note_fr":"Accent sur 'vel', jamais sur la dernière syllabe."},{"text":"severance","ipa_uk":"/ˈsev(ə)rəns/","ipa_us":"/ˈsev(ə)rəns/","note_fr":"Accent initial ; souvent deux syllabes seulement."},{"text":"comparable","ipa_uk":"/ˈkɒmp(ə)rəb(ə)l/","ipa_us":"/ˈkɑːmp(ə)rəb(ə)l/","note_fr":"Accent sur la première syllabe, pas sur 'par'."},{"text":"a permanent contract","ipa_uk":"/ə ˌpɜːmənənt ˈkɒntrækt/","ipa_us":"/ə ˌpɜːrmənənt ˈkɑːntrækt/","note_fr":"Deux accents initiaux : PERmanent CONtract."}],"pairs":[{"a":"a contract","b":"to contract","ipa_a":"/ˈkɒntrækt/","ipa_b":"/kənˈtrækt/"},{"a":"a record","b":"to record","ipa_a":"/ˈrekɔːd/","ipa_b":"/rɪˈkɔːd/"},{"a":"an increase","b":"to increase","ipa_a":"/ˈɪŋkriːs/","ipa_b":"/ɪnˈkriːs/"},{"a":"an object","b":"to object","ipa_a":"/ˈɒbdʒɪkt/","ipa_b":"/əbˈdʒekt/"}]},{"id":"pr-th","title":"The two 'th' sounds","title_fr":"Les deux sons 'th'","explain_fr":"Le 'th' sourd /θ/ (think, month) et le 'th' sonore /ð/ (the, this, although) se prononcent la pointe de la langue entre les dents ou juste derrière les dents du haut. Les francophones les remplacent par /s/ et /z/, ou /t/ et /d/, ce qui crée d'autres mots ('think' devient 'sink'). /ð/ se trouve surtout dans les mots grammaticaux (the, this, that, they, with) ; /θ/ dans les noms, les adjectifs et les nombres.","items":[{"text":"the","ipa_uk":"/ðə/","ipa_us":"/ðə/","note_fr":"Sonore. Devant une voyelle : /ði/ ('the employer')."},{"text":"this","ipa_uk":"/ðɪs/","ipa_us":"/ðɪs/","note_fr":"Sonore, voyelle brève."},{"text":"although","ipa_uk":"/ɔːlˈðəʊ/","ipa_us":"/ɔːlˈðoʊ/","note_fr":"Sonore ; accent sur la seconde syllabe."},{"text":"whether","ipa_uk":"/ˈweðə/","ipa_us":"/ˈweðər/","note_fr":"Sonore ; même prononciation que 'weather'."},{"text":"thereafter","ipa_uk":"/ˌðeərˈɑːftə/","ipa_us":"/ˌðerˈæftər/","note_fr":"Sonore ; mot de contrat."},{"text":"with","ipa_uk":"/wɪð/","ipa_us":"/wɪθ/","note_fr":"Sonore au Royaume-Uni ; souvent sourd aux États-Unis."},{"text":"think","ipa_uk":"/θɪŋk/","ipa_us":"/θɪŋk/","note_fr":"Sourd. Avec /s/, on entend 'sink'."},{"text":"thirty","ipa_uk":"/ˈθɜːti/","ipa_us":"/ˈθɜːrti/","note_fr":"Sourd ; accent sur la première syllabe (à distinguer de 'thirteen')."},{"text":"month","ipa_uk":"/mʌnθ/","ipa_us":"/mʌnθ/","note_fr":"Sourd ; voyelle de 'cup', pas un 'o'."},{"text":"three months","ipa_uk":"/ˌθriː ˈmʌnθs/","ipa_us":"/ˌθriː ˈmʌnθs/","note_fr":"Enchaînement /nθs/ : à l'oral rapide, on entend souvent /mʌns/."},{"text":"both","ipa_uk":"/bəʊθ/","ipa_us":"/boʊθ/","note_fr":"Sourd."},{"text":"authority","ipa_uk":"/ɔːˈθɒrəti/","ipa_us":"/əˈθɔːrəti/","note_fr":"Sourd ; accent sur 'thor'."},{"text":"health and safety","ipa_uk":"/ˌhelθ ən ˈseɪfti/","ipa_us":"/ˌhelθ ən ˈseɪfti/","note_fr":"Sourd, juste après un l : gardez la langue en avant."}],"pairs":[{"a":"think","b":"sink","ipa_a":"/θɪŋk/","ipa_b":"/sɪŋk/"},{"a":"three","b":"tree","ipa_a":"/θriː/","ipa_b":"/triː/"},{"a":"then","b":"den","ipa_a":"/ðen/","ipa_b":"/den/"},{"a":"worth","b":"worse","ipa_a":"/wɜːθ/","ipa_b":"/wɜːs/"},{"a":"breathe","b":"breeze","ipa_a":"/briːð/","ipa_b":"/briːz/"},{"a":"thought","b":"taught","ipa_a":"/θɔːt/","ipa_b":"/tɔːt/"}]},{"id":"pr-h","title":"Pronouncing h - and the silent h","title_fr":"Le h prononcé - et le h muet","explain_fr":"Le h anglais est un souffle audible : l'oublier ('ire' pour 'hire') ou l'ajouter devant une voyelle ('h-employee') sont deux erreurs typiques des francophones. Quelques mots seulement ont un h muet : hour, honest, honour, heir et leurs dérivés ; ils prennent 'an'. Aux États-Unis, 'herb' se dit aussi sans h. Le h de 'vehicle' et celui de 'exhausted' ne se prononcent pas.","items":[{"text":"hire","ipa_uk":"/ˈhaɪə/","ipa_us":"/ˈhaɪər/","note_fr":"H soufflé. Sans h, on entend 'ire' (la colère)."},{"text":"holiday","ipa_uk":"/ˈhɒlədeɪ/","ipa_us":"/ˈhɑːlədeɪ/","note_fr":"H soufflé. Aux États-Unis, 'holiday' = jour férié ; les congés se disent 'vacation'."},{"text":"harassment","ipa_uk":"/ˈhærəsmənt/","ipa_us":"/həˈræsmənt/","note_fr":"Accent sur la première syllabe au Royaume-Uni, plutôt sur la deuxième aux États-Unis ; les deux s'entendent."},{"text":"human resources","ipa_uk":"/ˌhjuːmən rɪˈzɔːsɪz/","ipa_us":"/ˌhjuːmən ˈriːsɔːrsɪz/","note_fr":"/hj/ : souffle puis 'you'. Accent de 'resources' différent au Royaume-Uni et aux États-Unis."},{"text":"hearing","ipa_uk":"/ˈhɪərɪŋ/","ipa_us":"/ˈhɪrɪŋ/","note_fr":"Sans h, on entend 'earring'."},{"text":"handbook","ipa_uk":"/ˈhændbʊk/","ipa_us":"/ˈhændbʊk/","note_fr":"H soufflé ; le d est souvent à peine audible."},{"text":"behalf","ipa_uk":"/bɪˈhɑːf/","ipa_us":"/bɪˈhæf/","note_fr":"H au milieu du mot : il se prononce ; le l est muet."},{"text":"on behalf of the employer","ipa_uk":"/ɒn bɪˌhɑːf əv ði ɪmˈplɔɪə/","ipa_us":"/ɑːn bɪˌhæf əv ði ɪmˈplɔɪər/","note_fr":"Un h dans 'behalf', aucun devant 'employer'."},{"text":"hour","ipa_uk":"/ˈaʊə/","ipa_us":"/ˈaʊər/","note_fr":"H muet : se prononce comme 'our'."},{"text":"an hourly rate","ipa_uk":"/ən ˌaʊəli ˈreɪt/","ipa_us":"/ən ˌaʊərli ˈreɪt/","note_fr":"H muet, donc 'an'."},{"text":"honest","ipa_uk":"/ˈɒnɪst/","ipa_us":"/ˈɑːnɪst/","note_fr":"H muet : 'an honest mistake'."},{"text":"heir","ipa_uk":"/eə/","ipa_us":"/er/","note_fr":"H muet : se prononce comme 'air'."},{"text":"vehicle","ipa_uk":"/ˈviːək(ə)l/","ipa_us":"/ˈviːək(ə)l/","note_fr":"Le h ne se prononce pas dans l'usage courant."},{"text":"exhausted","ipa_uk":"/ɪɡˈzɔːstɪd/","ipa_us":"/ɪɡˈzɔːstɪd/","note_fr":"H muet ; 'x' se prononce /ɡz/."}],"pairs":[{"a":"hear","b":"ear","ipa_a":"/hɪə/","ipa_b":"/ɪə/"},{"a":"hold","b":"old","ipa_a":"/həʊld/","ipa_b":"/əʊld/"},{"a":"hair","b":"air","ipa_a":"/heə/","ipa_b":"/eə/"},{"a":"heat","b":"eat","ipa_a":"/hiːt/","ipa_b":"/iːt/"},{"a":"high","b":"eye","ipa_a":"/haɪ/","ipa_b":"/aɪ/"},{"a":"harm","b":"arm","ipa_a":"/hɑːm/","ipa_b":"/ɑːm/"}]},{"id":"pr-vowels","title":"Long and short vowels","title_fr":"Voyelles longues et voyelles brèves","explain_fr":"Le français n'a qu'un seul 'i' ; l'anglais oppose /iː/ long et tendu (leave, sheet) et /ɪ/ bref et relâché (live, bit). Confondre les deux change le mot, parfois de façon embarrassante : 'sheet' et 'beach' prononcés avec un i bref deviennent des mots grossiers. Étirez franchement les voyelles longues et souriez pour /iː/. Même vigilance pour /ɜː/ (work) et /ɔː/ (walk), et pour la diphtongue de 'focus' /əʊ/, qui n'est pas un 'o' bref.","items":[{"text":"leave","ipa_uk":"/liːv/","ipa_us":"/liːv/","note_fr":"Voyelle longue. Avec un i bref, on entend 'live'."},{"text":"live","ipa_uk":"/lɪv/","ipa_us":"/lɪv/","note_fr":"Verbe : voyelle brève. L'adjectif 'live' (en direct) se dit /laɪv/."},{"text":"sheet","ipa_uk":"/ʃiːt/","ipa_us":"/ʃiːt/","note_fr":"Voyelle bien longue, impérativement."},{"text":"breach","ipa_uk":"/briːtʃ/","ipa_us":"/briːtʃ/","note_fr":"Voyelle longue : 'a breach of contract'."},{"text":"brief","ipa_uk":"/briːf/","ipa_us":"/briːf/","note_fr":"Voyelle longue ; une seule syllabe."},{"text":"seek","ipa_uk":"/siːk/","ipa_us":"/siːk/","note_fr":"Avec un i bref, on entend 'sick'."},{"text":"fees","ipa_uk":"/fiːz/","ipa_us":"/fiːz/","note_fr":"Voyelle longue et /z/ final sonore."},{"text":"focus","ipa_uk":"/ˈfəʊkəs/","ipa_us":"/ˈfoʊkəs/","note_fr":"Diphtongue dans la première syllabe, finale réduite /kəs/ : ne prononcez ni un 'o' bref ni un 'u' français."},{"text":"work","ipa_uk":"/wɜːk/","ipa_us":"/wɜːrk/","note_fr":"Voyelle de 'her', pas un 'o'. À distinguer de 'walk'."},{"text":"law","ipa_uk":"/lɔː/","ipa_us":"/lɔː/","note_fr":"Voyelle longue et ouverte. Aux États-Unis, on entend aussi /lɑː/. À distinguer de 'low'."},{"text":"full-time","ipa_uk":"/ˌfʊl ˈtaɪm/","ipa_us":"/ˌfʊl ˈtaɪm/","note_fr":"/ʊ/ bref, comme dans 'book' ; à distinguer de 'fool' /fuːl/."},{"text":"sick leave","ipa_uk":"/ˈsɪk liːv/","ipa_us":"/ˈsɪk liːv/","note_fr":"Un i bref puis un i long : bon exercice de contraste."},{"text":"this week","ipa_uk":"/ðɪs ˈwiːk/","ipa_us":"/ðɪs ˈwiːk/","note_fr":"Bref puis long ; ne pas dire 'these weak'."}],"pairs":[{"a":"leave","b":"live","ipa_a":"/liːv/","ipa_b":"/lɪv/"},{"a":"seek","b":"sick","ipa_a":"/siːk/","ipa_b":"/sɪk/"},{"a":"reach","b":"rich","ipa_a":"/riːtʃ/","ipa_b":"/rɪtʃ/"},{"a":"feel","b":"fill","ipa_a":"/fiːl/","ipa_b":"/fɪl/"},{"a":"walk","b":"work","ipa_a":"/wɔːk/","ipa_b":"/wɜːk/"},{"a":"law","b":"low","ipa_a":"/lɔː/","ipa_b":"/ləʊ/"}]},{"id":"pr-ed","title":"The three pronunciations of -ed","title_fr":"Les trois prononciations de -ed","explain_fr":"La terminaison -ed ne forme une syllabe /ɪd/ qu'après les sons /t/ et /d/ (terminated, suspended). Après une consonne sourde (/p/, /k/, /f/, /s/, /ʃ/, /tʃ/), elle se prononce /t/ (worked, dismissed). Dans tous les autres cas, /d/ (signed, agreed). Dire 'work-ed' ou 'dismiss-ed' en deux et trois syllabes est l'une des erreurs les plus audibles des francophones.","items":[{"text":"worked","ipa_uk":"/wɜːkt/","ipa_us":"/wɜːrkt/","note_fr":"/t/ : une seule syllabe."},{"text":"dismissed","ipa_uk":"/dɪsˈmɪst/","ipa_us":"/dɪsˈmɪst/","note_fr":"/t/ : deux syllabes, pas trois."},{"text":"discussed","ipa_uk":"/dɪˈskʌst/","ipa_us":"/dɪˈskʌst/","note_fr":"/t/ après /s/."},{"text":"asked","ipa_uk":"/ɑːskt/","ipa_us":"/æskt/","note_fr":"/t/ : une syllabe ; le groupe /skt/ est souvent simplifié en /st/."},{"text":"breached","ipa_uk":"/briːtʃt/","ipa_us":"/briːtʃt/","note_fr":"/t/ après /tʃ/."},{"text":"signed","ipa_uk":"/saɪnd/","ipa_us":"/saɪnd/","note_fr":"/d/ : une syllabe ; le g est muet."},{"text":"agreed","ipa_uk":"/əˈɡriːd/","ipa_us":"/əˈɡriːd/","note_fr":"/d/ après une voyelle."},{"text":"resigned","ipa_uk":"/rɪˈzaɪnd/","ipa_us":"/rɪˈzaɪnd/","note_fr":"/d/ ; le s se prononce /z/."},{"text":"employed","ipa_uk":"/ɪmˈplɔɪd/","ipa_us":"/ɪmˈplɔɪd/","note_fr":"/d/ : deux syllabes."},{"text":"terminated","ipa_uk":"/ˈtɜːmɪneɪtɪd/","ipa_us":"/ˈtɜːrmɪneɪtɪd/","note_fr":"/ɪd/ après /t/ : une syllabe de plus."},{"text":"suspended","ipa_uk":"/səˈspendɪd/","ipa_us":"/səˈspendɪd/","note_fr":"/ɪd/ après /d/."},{"text":"negotiated","ipa_uk":"/nɪˈɡəʊʃieɪtɪd/","ipa_us":"/nɪˈɡoʊʃieɪtɪd/","note_fr":"/ɪd/ après /t/."},{"text":"drafted","ipa_uk":"/ˈdrɑːftɪd/","ipa_us":"/ˈdræftɪd/","note_fr":"/ɪd/ après /t/."},{"text":"She was dismissed in May.","ipa_uk":"/ʃi wəz dɪsˈmɪst ɪn ˈmeɪ/","ipa_us":"/ʃi wəz dɪsˈmɪst ɪn ˈmeɪ/","note_fr":"Liez le /t/ final à 'in' : 'dismis-tin'."}],"pairs":[]}],"numbers":[{"written":"12 March 2026","say_uk":"the twelfth of March twenty twenty-six","say_us":"March twelfth, twenty twenty-six","note_fr":"Au Royaume-Uni on écrit '12 March 2026', aux États-Unis 'March 12, 2026'. À l'oral, toujours un ordinal, et 'the ... of' en anglais britannique."},{"written":"03/04/2026","say_uk":"the third of April twenty twenty-six","say_us":"March fourth, twenty twenty-six","note_fr":"Piège majeur : jour/mois au Royaume-Uni (comme en France), mois/jour aux États-Unis. Dans un contrat ou un e-mail international, écrivez le mois en toutes lettres."},{"written":"1,250","say_uk":"one thousand two hundred and fifty","say_us":"one thousand two hundred fifty","note_fr":"La virgule sépare les milliers (jamais un espace ni un point). Le 'and' après 'hundred' est britannique. On entend aussi 'twelve hundred and fifty', surtout aux États-Unis ('twelve hundred fifty')."},{"written":"€45,000 a year","say_uk":"forty-five thousand euros a year","say_us":"forty-five thousand euros a year","note_fr":"Le symbole s'écrit avant le chiffre mais se dit après. 'Thousand' reste invariable. Familier : 'forty-five k' ; 'grand' est très familier."},{"written":"£12.50 / $12.50 an hour","say_uk":"twelve pounds fifty an hour","say_us":"twelve dollars and fifty cents an hour","note_fr":"Le point marque les décimales. À l'oral courant : 'twelve fifty an hour' dans les deux pays. 'An hour' ou 'per hour', jamais 'by hour'."},{"written":"3.5%","say_uk":"three point five per cent","say_us":"three point five percent","note_fr":"Virgule française = point anglais ('point'). 'Per cent' en deux mots au Royaume-Uni, 'percent' aux États-Unis ; pas d'espace avant %."},{"written":"0.75","say_uk":"nought point seven five","say_us":"zero point seven five","note_fr":"Après 'point', on énonce les chiffres un par un ('seven five', pas 'seventy-five'). 'Nought' est britannique ; 'zero' est compris partout."},{"written":"2,500,000","say_uk":"two and a half million","say_us":"two point five million","note_fr":"'Million' reste invariable après un nombre ('two million employees'). Les deux lectures s'emploient dans les deux pays. Dans les tableaux : '2.5m'."},{"written":"1.2bn","say_uk":"one point two billion","say_us":"one point two billion","note_fr":"Faux ami : 'billion' = milliard (mille millions) ; le 'billion' français se dit 'trillion'. Abréviations : 'bn' (UK), 'B' (US)."},{"written":"020 7946 0018","say_uk":"oh two oh, seven nine four six, double oh one eight","say_us":"zero two zero, seven nine four six, zero zero one eight","note_fr":"On dicte chiffre par chiffre, par groupes, jamais par paires comme en français. 'Oh' pour zéro et 'double' sont surtout britanniques ; les Américains répètent le chiffre."},{"written":"9.30 am / 9:30 a.m.","say_uk":"half past nine in the morning","say_us":"nine thirty a.m.","note_fr":"Le Royaume-Uni écrit souvent l'heure avec un point, les États-Unis avec deux-points. 'Half past' est plus britannique ; 'nine thirty' passe partout. L'anglais familier britannique 'half nine' signifie 9 h 30, pas 8 h 30."},{"written":"17:45","say_uk":"quarter to six in the evening","say_us":"a quarter to six, or five forty-five p.m.","note_fr":"L'horloge de 24 heures s'écrit (horaires, plannings) mais ne se dit presque jamais : convertissez en 'a.m.' / 'p.m.'. Aux États-Unis, on entend aussi 'a quarter of six'."},{"written":"Spelling: GIRAUD","say_uk":"G for Golf, I for India, R, A for Alpha, U, D - /dʒiː, aɪ, ɑː, eɪ, juː, diː/","say_us":"G as in Golf, I as in India, R, A as in Alpha, U, D - /dʒiː, aɪ, ɑːr, eɪ, juː, diː/","note_fr":"Pièges : A se dit /eɪ/, E se dit /iː/, I se dit /aɪ/ ; G se dit /dʒiː/ et J se dit /dʒeɪ/, l'inverse du français. En cas de doute, épelez avec un mot-repère."},{"written":"Spelling: JEAN-YVES HAZELL","say_uk":"J for Juliet, E, A, N, hyphen, Y, V, E, S; new word: H, A, Z, E, double L - Z is /zed/, H is /eɪtʃ/","say_us":"J as in Juliet, E, A, N, hyphen, Y, V, E, S; new word: H, A, Z, E, L, L - Z is /ziː/, H is /eɪtʃ/","note_fr":"Z se dit 'zed' au Royaume-Uni et 'zee' aux États-Unis. H = 'aitch', Y = /waɪ/, W = 'double-u'. Les Britanniques disent 'double L' ; le trait d'union est 'hyphen' (ou 'dash')."}],"placement":[{"skill":"vocabulary","level":"B1","prompt":"She has decided to leave the company, so she has handed in her ___.","passage":null,"audio":null,"options":["demission","notice","dismissal","licence"],"answer":1},{"skill":"vocabulary","level":"B1","prompt":"The company is ___ ten new engineers this year.","passage":null,"audio":null,"options":["charging","firing","hiring","renting"],"answer":2},{"skill":"vocabulary","level":"B1","prompt":"Hours worked beyond your normal schedule are called ___.","passage":null,"audio":null,"options":["supplementary time","extra shift","more-time","overtime"],"answer":3},{"skill":"vocabulary","level":"B2","prompt":"An employee who believes she has been treated unfairly can raise a ___.","passage":null,"audio":null,"options":["grievance","reclamation","dispute letter","demand"],"answer":0},{"skill":"vocabulary","level":"B2","prompt":"The clause stops him from working for a rival firm for six months after he leaves: it is a ___.","passage":null,"audio":null,"options":["confidentiality clause","non-compete clause","mobility clause","notice clause"],"answer":1},{"skill":"vocabulary","level":"B2","prompt":"Fifty roles are at risk, so the company has opened a collective ___ consultation.","passage":null,"audio":null,"options":["licensing","resignation","redundancy","retirement"],"answer":2},{"skill":"vocabulary","level":"C1","prompt":"The panel found that dismissal was a ___ response to a single minor error.","passage":null,"audio":null,"options":["unmeasured","overpassing","misbalanced","disproportionate"],"answer":3},{"skill":"vocabulary","level":"C1","prompt":"The offer was made 'without ___', so it could not be shown to the tribunal.","passage":null,"audio":null,"options":["prejudice","damage","commitment","engagement"],"answer":0},{"skill":"grammar","level":"B1","prompt":"She ___ in the Paris office since 2021.","passage":null,"audio":null,"options":["works","has worked","is working","worked"],"answer":1},{"skill":"grammar","level":"B1","prompt":"Could you give me ___ about the new policy?","passage":null,"audio":null,"options":["an information","some informations","some information","informations"],"answer":2},{"skill":"grammar","level":"B1","prompt":"If he ___ late again, he will get a written warning.","passage":null,"audio":null,"options":["is","will be","would be","be"],"answer":0},{"skill":"grammar","level":"B2","prompt":"I look forward to ___ from you.","passage":null,"audio":null,"options":["hear","be hearing","have heard","hearing"],"answer":3},{"skill":"grammar","level":"B2","prompt":"The report ___ by the time the committee meets next week.","passage":null,"audio":null,"options":["will finish","will have been finished","is finishing","has finished"],"answer":1},{"skill":"grammar","level":"B2","prompt":"I suggest ___ the hearing until Monday.","passage":null,"audio":null,"options":["postponing","to postpone","us to postpone","that we postponing"],"answer":0},{"skill":"grammar","level":"C1","prompt":"___ the employee refuse to cooperate, the investigation will proceed without her.","passage":null,"audio":null,"options":["Would","If","Should","Unless"],"answer":2},{"skill":"grammar","level":"C1","prompt":"Not only ___ the deadline, but he also failed to inform his manager.","passage":null,"audio":null,"options":["he missed","he did miss","missed he","did he miss"],"answer":3},{"skill":"reading","level":"B1","prompt":"When is a medical certificate needed?","passage":"All employees must tell their manager before 9 a.m. on the first day of any absence. A medical certificate is required for absences of more than three days.","audio":null,"options":["For every absence","Only for absences longer than three days","Before 9 a.m. on the first day","Never"],"answer":1},{"skill":"reading","level":"B1","prompt":"What must Ms Laurent do by 15 August?","passage":"Dear Ms Laurent, We are pleased to offer you the position of HR Assistant, starting on 1 September. Please sign and return the enclosed contract by 15 August.","audio":null,"options":["Start work","Call the company","Send back the signed contract","Attend an interview"],"answer":2},{"skill":"reading","level":"B1","prompt":"What should people do if they cannot work from home on Friday?","passage":"The office will be closed on Friday for maintenance. Staff may work from home that day. Anyone who cannot work from home should speak to their manager.","audio":null,"options":["Talk to their manager","Come to the office anyway","Take a day's leave","Work on Saturday instead"],"answer":0},{"skill":"reading","level":"B2","prompt":"Which statement is true?","passage":"The bonus is discretionary. Payment in one year does not create any entitlement to a bonus in later years, and no bonus is payable to an employee who is under notice on the payment date.","audio":null,"options":["Employees receive the bonus every year.","An employee who has resigned still receives the bonus.","The bonus becomes a right after the first payment.","An employee who is working out their notice on the payment date receives nothing."],"answer":3},{"skill":"reading","level":"B2","prompt":"What did the investigator conclude?","passage":"Although the manager denied making the remark, two colleagues confirmed that they had heard it. The investigator therefore found, on the balance of probabilities, that the comment had been made.","audio":null,"options":["The manager was telling the truth.","The remark was probably made.","There was not enough evidence to decide.","The two colleagues were unreliable."],"answer":1},{"skill":"reading","level":"B2","prompt":"What happened in the regional branches?","passage":"Staff turnover fell slightly last year. However, the improvement was confined to head office; in the regional branches, resignations continued to rise.","audio":null,"options":["Turnover fell slightly.","Nothing changed.","More people resigned.","Recruitment stopped."],"answer":2},{"skill":"reading","level":"C1","prompt":"What was the panel's view?","passage":"Notwithstanding the employee's long and hitherto unblemished service, the panel took the view that the breach of trust was so fundamental as to leave the employer with no realistic alternative to dismissal.","audio":null,"options":["Dismissal was justified despite the employee's good record.","Long service made the dismissal unfair.","The employer should have looked for alternatives.","The employee's record was poor."],"answer":0},{"skill":"reading","level":"C1","prompt":"What does the writer imply?","passage":"The proposal was, to put it mildly, not warmly received. While nobody went so far as to reject it outright, the union representatives made it plain that, absent significant concessions on working time, there was little prospect of an agreement.","audio":null,"options":["The unions formally rejected the proposal.","The unions welcomed the proposal with minor reservations.","The unions were indifferent to the proposal.","The unions are unlikely to agree unless the working-time terms improve."],"answer":3},{"skill":"listening","level":"B1","prompt":"When is the interview now?","passage":null,"audio":"Hi, it's Karen from HR. Your interview has been moved from Tuesday to Thursday at ten o'clock. Same room as before.","options":["Tuesday at ten","Thursday at two","Thursday at ten","Tuesday at two"],"answer":2},{"skill":"listening","level":"B1","prompt":"Why is Mr Davies not available?","passage":null,"audio":"I'm afraid Mr Davies is off sick today. He should be back in the office on Monday.","options":["He is ill.","He is on holiday.","He is in a meeting.","He has left the company."],"answer":0},{"skill":"listening","level":"B1","prompt":"What does the speaker need?","passage":null,"audio":"Could you send me the signed contract by the end of the week? I need it before payroll runs on the twenty-fifth.","options":["A payslip","A meeting on the twenty-fifth","A new contract","A signed document within a few days"],"answer":3},{"skill":"listening","level":"B2","prompt":"What does the speaker suggest?","passage":null,"audio":"To be honest, I'm not entirely convinced a written warning is the way to go. Why don't we have an informal word with him first?","options":["Giving a formal warning straight away","Speaking to the employee informally first","Dismissing the employee","Taking no action"],"answer":1},{"skill":"listening","level":"B2","prompt":"What happened?","passage":null,"audio":"We'd have loved to offer her the job, but she'd already accepted something else by the time we got back to her.","options":["The candidate was hired.","The candidate turned the job down because of the salary.","The company was too slow and lost the candidate.","The company rejected the candidate."],"answer":2},{"skill":"listening","level":"B2","prompt":"What is the speaker unhappy about?","passage":null,"audio":"It's not that I mind covering for him. It's just that nobody bothered to ask me.","options":["Not being consulted","Having to do extra work","Her colleague's absence","Her workload in general"],"answer":0},{"skill":"listening","level":"C1","prompt":"What does the speaker mean?","passage":null,"audio":"With respect, I think that's a rather optimistic reading of the clause. I wouldn't want to rely on it in front of a tribunal.","options":["She fully agrees with the interpretation.","She has not read the clause.","She thinks the clause is perfectly clear.","She politely disagrees and thinks the argument is weak."],"answer":3},{"skill":"listening","level":"C1","prompt":"What is the speaker's real opinion?","passage":null,"audio":"Well, the feedback wasn't bad, exactly. Let's just say there's room for improvement before she goes anywhere near a client.","options":["The feedback was excellent.","The person is not yet ready to deal with clients.","The person should be promoted.","A client complained about the person."],"answer":1}]}};</script>
<script>
'use strict';
/* Parlance — Legal & HR English. Core: state, storage, speech, recording, spaced repetition. */
const APP_VERSION = '0.1.0';
const DATA = window.PARLANCE_DATA;
const STORE_KEY = 'parlance.v1';

/* ---------- small helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mark = s => esc(s).replace(/\[\[(.+?)\]\]/g, '<mark>$1</mark>');
const plain = s => String(s || '').replace(/\[\[(.+?)\]\]/g, '$1');
const target = s => { const m = /\[\[(.+?)\]\]/.exec(s || ''); return m ? m[1] : ''; };
const blank = s => esc(s).replace(/\[\[(.+?)\]\]/g, '<span class="blank">&nbsp;</span>');
const para = s => esc(s).split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const uniq = a => Array.from(new Set(a));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const norm = s => String(s || '').toLowerCase().replace(/[‘’]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^to /, '');
const dayKey = d => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayNum = d => { d = d || new Date(); return Math.floor(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 864e5 + 0.5); };

/* ---------- state ---------- */
const DEFAULTS = () => ({
  v: 1,
  settings: { variety: 'uk', theme: 'auto', scale: 1, rate: 1, frHelp: false, goal: 15, voiceUk: '', voiceUs: '' },
  srs: {}, seen: {}, levels: {}, done: {}, drafts: {}, notebook: [], days: {}, errors: {}, answers: { ok: 0, ko: 0 },
  placement: null, welcomed: false, lastTheme: ''
});
let S = DEFAULTS();
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const o = JSON.parse(raw); S = Object.assign(DEFAULTS(), o); S.settings = Object.assign(DEFAULTS().settings, o.settings || {}); }
  } catch (e) { /* stockage indisponible : l'app fonctionne, sans mémoire */ }
}
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }, 150);
}
function saveNow() { clearTimeout(saveTimer); try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

/* ---------- study time, streak ---------- */
let lastTouch = Date.now();
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { lastTouch = Date.now(); }, true));
setInterval(() => {
  if (document.hidden || Date.now() - lastTouch > 60000) return;
  const k = dayKey(); S.days[k] = (S.days[k] || 0) + 5; save();
}, 5000);
const minutesToday = () => Math.floor((S.days[dayKey()] || 0) / 60);
function streak() {
  let n = 0; const d = new Date();
  if (!S.days[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (S.days[dayKey(d)] >= 60) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- content access ---------- */
const V = () => S.settings.variety;
const other = v => (v === 'uk' ? 'us' : 'uk');
const ALL_ENTRIES = [].concat(...Object.values(DATA.entries));
const ENTRY = {}; ALL_ENTRIES.forEach(e => { ENTRY[e.id] = e; });
const themeEntries = (t, level) => (DATA.entries[t] || []).filter(e => !level || e.level === level);
const pick = (o, v) => (o ? (o[v || V()] || o.uk || o.us || '') : '');
const regEx = (r, v) => ((v || V()) === 'us' && r.ex_us) ? r.ex_us : r.ex;
const differs = o => o && norm(o.uk) !== norm(o.us);

/* ---------- spaced repetition (SM-2 simplifié) ---------- */
function srsGrade(id, q) { // 0 again, 1 hard, 2 good, 3 easy
  const s = S.srs[id] || { i: 0, e: 2.5, r: 0, l: 0, d: 0 };
  if (q === 0) { s.r = 0; s.i = 0; s.l++; s.e = Math.max(1.3, s.e - 0.2); s.d = dayNum(); }
  else {
    s.r++;
    s.i = s.r === 1 ? 1 : s.r === 2 ? 3 : Math.max(s.i + 1, Math.round(s.i * s.e * (q === 1 ? 0.6 : q === 3 ? 1.3 : 1)));
    if (q === 1) s.e = Math.max(1.3, s.e - 0.15);
    if (q === 3) s.e += 0.1;
    s.d = dayNum() + s.i;
  }
  S.srs[id] = s; save();
}
const srsItem = id => ENTRY[id] || S.notebook.find(n => n.id === id);

/* ---------- speech synthesis (voix de l'appareil, hors ligne) ---------- */
const Speech = {
  ok: 'speechSynthesis' in window, voices: [],
  init() {
    if (!this.ok) return;
    const grab = () => { this.voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); };
    grab(); if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', grab);
  },
  list(variety) { const re = variety === 'us' ? /^en[-_]US/i : /^en[-_]GB/i; return this.voices.filter(v => re.test(v.lang)); },
  voice(variety) {
    const wanted = S.settings[variety === 'us' ? 'voiceUs' : 'voiceUk'];
    const list = this.list(variety);
    const score = v => (/premium|enhanced|natural/i.test(v.name) ? 4 : 0) + (v.localService ? 2 : 0) + (v.default ? 1 : 0);
    return list.find(v => v.name === wanted) || list.slice().sort((a, b) => score(b) - score(a))[0] || this.voices[0] || null;
  },
  say(text, opt) {
    opt = opt || {};
    if (!this.ok) { if (opt.onend) opt.onend(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain(text));
    const variety = opt.variety || V(), v = this.voice(variety);
    if (v) u.voice = v;
    u.lang = v ? v.lang : (variety === 'us' ? 'en-US' : 'en-GB');
    u.rate = (opt.slow ? 0.62 : 1) * S.settings.rate;
    if (opt.pitch) u.pitch = opt.pitch;
    let done = false; const end = () => { if (!done) { done = true; if (opt.onend) opt.onend(); } };
    u.onend = end; u.onerror = end;
    speechSynthesis.speak(u);
  },
  stop() { if (this.ok) speechSynthesis.cancel(); }
};

/* ---------- microphone: record, then listen to yourself ---------- */
const Rec = {
  ok: !!(navigator.mediaDevices && window.MediaRecorder), mr: null, stream: null, chunks: [], url: '',
  async start() {
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    this.chunks = []; this.mr = new MediaRecorder(this.stream);
    this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.start();
  },
  stop() {
    return new Promise(res => {
      const mr = this.mr; if (!mr || mr.state === 'inactive') return res(this.url);
      mr.onstop = () => {
        if (this.stream) this.stream.getTracks().forEach(t => t.stop());
        if (this.url) URL.revokeObjectURL(this.url);
        this.url = URL.createObjectURL(new Blob(this.chunks, { type: mr.mimeType || 'audio/mp4' }));
        this.mr = null; res(this.url);
      };
      mr.stop();
    });
  },
  get active() { return !!(this.mr && this.mr.state === 'recording'); }
};

function buildQuestions(entries, pool, n, kinds) {

const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function annotate(text, r) {
  const marks = r.glossary.map((g, i) => ({ k: esc(g.term), cls: 'gl', i })).concat(r.legalese.map((g, i) => ({ k: esc(g.phrase), cls: 'lg', i }))).sort((a, b) => b.k.length - a.k.length);
  if (!marks.length) return esc(text);
  const re = new RegExp('(' + marks.map(m => reEsc(m.k)).join('|') + ')', 'gi');
  return esc(text).replace(re, m => { const x = marks.find(k => k.k.toLowerCase() === m.toLowerCase()); return '<button class="' + x.cls + '" data-act="gloss" data-c="' + x.cls + '" data-i="' + x.i + '">' + m + '</button>'; });
}

/* ================= Notebook and review ================= */
function addNote(text, note) {
  text = String(text || '').trim(); if (!text) return false;
  if (S.notebook.some(n => norm(n.text) === norm(text))) return false;
  const id = 'nb-' + Date.now().toString(36) + Math.floor(Math.random() * 1e3);
  S.notebook.unshift({ id, text, note: String(note || '').trim(), t: Date.now() });
  S.srs[id] = { i: 0, e: 2.5, r: 0, l: 0, d: dayNum() }; save(); return true;
}
VIEWS.notebook = () => head('Notebook', 'Words and sentences met at work. They join your reviews automatically.') +
  '<form class="card noteform" id="noteform"><label>Word, expression or sentence<textarea id="nbText" rows="2" placeholder="e.g. Let’s park that for now."></textarea></label><label>Meaning or context <small>(optional)</small><input id="nbNote" type="text" placeholder="e.g. remettre à plus tard — said in a meeting"></label><button class="btn wide" data-act="noteAdd">' + icon('plus') + ' Add to my notebook</button></form>' +
  (S.notebook.length ? '<button class="btn ghost wide" data-act="noteDrill">Drill my notebook</button><div class="card notes">' + S.notebook.map(n => '<div class="note"><div><p><b>' + esc(n.text) + '</b></p>' + (n.note ? '<p class="sub">' + esc(n.note) + '</p>' : '') + '</div><span>' + sayBtn(n.text, V()) + '<button class="ib" data-act="noteDel" data-id="' + n.id + '" aria-label="Delete">' + icon('trash') + '</button></span></div>').join('') + '</div>'
    : '<p class="empty">Nothing yet. The best entries are the ones you nearly understood today.</p>');
ACT.noteAdd = () => { const t = $('#nbText').value, ok = addNote(t, $('#nbNote').value); if (!t.trim()) { $('#nbText').focus(); return; } toast(ok ? 'Added' : 'Already in your notebook'); render(); };
ACT.noteDel = el => { S.notebook = S.notebook.filter(n => n.id !== el.dataset.id); delete S.srs[el.dataset.id]; save(); render(); };
ACT.noteDrill = () => {
  const qs = shuffle(S.notebook).slice(0, 12).map(n => (Speech.ok && Math.random() < 0.6) || !n.note
    ? { tag: 'Dictation', prompt: 'Listen and write.', audio: { text: n.text, variety: V() }, answers: [n.text], model: n.text, selfmark: true, ref: n.id }
    : { tag: 'Recall', prompt: 'From your notebook: <q>' + esc(n.note) + '</q>', answers: [n.text], model: n.text, selfmark: true, ref: n.id });
  startSession({ title: 'Notebook drill', back: 'notebook', questions: Speech.ok ? qs : qs.filter(q => !q.audio) });
};

  const id = RV.ids[RV.i], e = ENTRY[id], n = e ? null : srsItem(id);
  const front = e ? '<p class="eyebrow">Say it in English</p><h2 lang="fr">' + esc(e.fr) + '</h2><p class="sub">' + esc(e.def) + '</p>' : '<p class="eyebrow">From your notebook</p><h2>' + esc(n.note || 'Can you use it in a sentence?') + '</h2>' + (n.note ? '' : '<p class="sub">' + esc(n.text) + '</p>');
  const back = e ? '<h2>' + esc(termOf(e)) + ' ' + sayBtn(termOf(e), V()) + '</h2><p class="ipa">' + esc(pick(e.ipa)) + (differs(e.term) ? ' · ' + chip(other(V()).toUpperCase(), 'v-' + other(V())) + ' ' + esc(e.term[other(V())]) : '') + '</p>' + (e.registers.everyday ? '<p class="ex">' + mark(regEx(e.registers.everyday)) + '</p>' : '') + fr(esc(e.note_fr), 'Note') + '<p><a href="#/entry/' + e.id + '">Open the full entry</a></p>'
    : '<h2>' + esc(n.text) + ' ' + sayBtn(n.text, V()) + '</h2>';
  return '<div class="sess"><div class="sess-top"><a class="ib" href="#/" aria-label="Close">' + icon('back') + '</a>' + bar(pct(RV.i, RV.ids.length)) + '<span class="count">' + (RV.i + 1) + ' / ' + RV.ids.length + '</span></div>' +
    '<div class="qcard flash ' + (RV.shown ? 'shown' : '') + '">' + front + (RV.shown ? '<hr>' + back + '<div class="rate"><button data-act="rate" data-q="0">Again</button><button data-act="rate" data-q="1">Hard</button><button data-act="rate" data-q="2">Good</button><button data-act="rate" data-q="3">Easy</button></div>' : '<button class="btn wide" data-act="reveal">Show the answer</button>') + '</div></div>';
};
ACT.reveal = () => { RV.shown = true; render(); };
ACT.rate = el => { srsGrade(RV.ids[RV.i], +el.dataset.q); RV.i++; RV.shown = false; render(); };

/* ================= Placement test ================= */
VIEWS.placement = () => head('Placement test', '32 questions · about 10 minutes', '') +
  '<div class="card"><p>Vocabulary, grammar, reading and listening, all in an HR and employment-law setting. The result sets your priorities and can open levels you already master.</p>' +
  fr('<p>Le résultat est indicatif : il oriente le parcours, il ne remplace pas une certification. Vous pourrez refaire le test tous les deux mois pour mesurer vos progrès.</p>', 'À savoir') +
  (S.placement ? '<p class="sub">Last result: ' + esc(S.placement.est) + ' on ' + new Date(S.placement.t).toLocaleDateString('en-GB') + '.</p>' : '') + '</div>' +
  '<button class="btn wide" data-act="placementStart">Start the test</button>';
ACT.placementStart = () => {
  const order = ['vocabulary', 'grammar', 'reading', 'listening'], lv = { B1: 1, B2: 2, C1: 3 };
  const qs = L.placement.slice().sort((a, b) => order.indexOf(a.skill) - order.indexOf(b.skill) || lv[a.level] - lv[b.level]).map(p => {
    const listen = p.audio && Speech.ok;
    return { tag: SKILL_LABEL[p.skill] || p.skill, meta: p, options: p.options, answer: p.answer, audio: listen ? { text: p.audio, variety: V() } : null,
      prompt: (p.passage ? '<div class="passage">' + esc(p.passage) + '</div>' : '') + (p.audio && !listen ? '<div class="passage">' + esc(p.audio) + '</div>' : '') + esc(p.prompt) };
  });
  startSession({ title: 'Placement test', back: '', questions: qs, onFinish: (score, s) => {
    const by = {}; let got = 0, max = 0;
    s.questions.forEach((q, i) => { const k = q.meta.skill, w = lv[q.meta.level]; by[k] = by[k] || { ok: 0, n: 0 }; by[k].n++; max += w; if (s.results[i]) { by[k].ok++; got += w; } });
    const r = got / max, est = r < 0.4 ? 'B1' : r < 0.62 ? 'B1+' : r < 0.8 ? 'B2' : r < 0.92 ? 'B2+' : 'C1';
    const weak = Object.keys(by).sort((a, b) => by[a].ok / by[a].n - by[b].ok / by[b].n).slice(0, 2);
    const vocab = by.vocabulary ? by.vocabulary.ok / by.vocabulary.n : 0;
    S.placement = { t: Date.now(), score, est, weak, by, unlock: vocab >= 0.85 ? 2 : 1 }; save();
    return 'Estimated level: <b>' + est + '</b>. Priorities: ' + weak.map(k => SKILL_LABEL[k]).join(' and ') + '.' + (S.placement.unlock > 1 ? ' Level 2 vocabulary is open.' : '');
  } });
};

/* ================= Settings ================= */
function applySettings() {
  const r = document.documentElement, t = S.settings.theme;
  if (t === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
  r.style.setProperty('--scale', S.settings.scale);
}
const seg = (key, opts) => '<div class="seg">' + opts.map(o => '<button data-act="set" data-k="' + key + '" data-v="' + o[0] + '" class="' + (String(S.settings[key]) === String(o[0]) ? 'on' : '') + '">' + o[1] + '</button>').join('') + '</div>';
VIEWS.settings = () => {
  const voices = v => { const list = Speech.list(v), key = v === 'us' ? 'voiceUs' : 'voiceUk';
    return list.length ? '<select data-chg="voice" data-k="' + key + '"><option value="">Best available</option>' + list.map(x => '<option' + (S.settings[key] === x.name ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>' : '<small>No ' + (v === 'us' ? 'American' : 'British') + ' voice found on this device.</small>'; };
  return head('Settings', '', '') +
    '<div class="card set"><label>Main variety' + seg('variety', [['uk', 'British'], ['us', 'American']]) + '</label><label>French help always open' + seg('frHelp', [['false', 'Off'], ['true', 'On']]) + '</label><label>Daily goal' + seg('goal', [[10, '10 min'], [15, '15 min'], [20, '20 min'], [30, '30 min']]) + '</label></div>' +
    '<div class="card set"><label>Appearance' + seg('theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']]) + '</label><label>Text size' + seg('scale', [[0.92, 'A−'], [1, 'A'], [1.12, 'A+'], [1.25, 'A++']]) + '</label></div>' +
    '<div class="card set"><label>Speaking rate' + seg('rate', [[0.85, 'Slower'], [1, 'Normal'], [1.1, 'Faster']]) + '</label><label>British voice' + voices('uk') + '</label><label>American voice' + voices('us') + '</label>' +
    '<p class="row">' + sayBtn('The contract takes effect on the first of March.', 'uk') + sayBtn('The contract takes effect on March first.', 'us') + '</p>' +
    fr('<p>Pour un rendu naturel, téléchargez une voix « améliorée » ou « premium » : Réglages &gt; Accessibilité &gt; Contenu énoncé &gt; Voix &gt; Anglais.</p>', 'Améliorer les voix') + '</div>' +
    '<div class="card set"><span class="reglabel">Your progress</span><p class="sub">Stored on this device only. Export it to carry it to another device.</p><div class="row"><button class="btn ghost" data-act="exportData">Export</button><label class="btn ghost filebtn">Import<input type="file" accept="application/json,.json" data-chg="importData" hidden></label></div>' +
    '<button class="btn ghost wide" data-act="go" data-to="placement">Placement test</button><button class="btn danger wide" data-act="resetAsk">Erase all progress</button></div>' +
    '<div class="card set"><span class="reglabel">Online correction</span><p class="sub">Off in this stage. It will use the API credit included in your Claude Max plan.</p></div>' +
    '<p class="foot">Parlance ' + APP_VERSION + ' · ' + ALL_ENTRIES.length + ' expressions · works offline</p>';
};
ACT.set = el => { let v = el.dataset.v; const k = el.dataset.k; if (v === 'true' || v === 'false') v = v === 'true'; else if (!isNaN(+v) && k !== 'variety' && k !== 'theme') v = +v; S.settings[k] = v; save(); applySettings(); render(); };
ACT.voice = el => { S.settings[el.dataset.k] = el.value; save(); };
ACT.exportData = async () => {
  saveNow(); const name = 'parlance-progress-' + dayKey() + '.json', text = JSON.stringify(S);
  try { const file = new File([text], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Parlance progress' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Progress exported');
};
ACT.importData = el => {
  const f = el.files && el.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || o.v !== 1 || !o.settings || !o.srs) throw 0; S = Object.assign(DEFAULTS(), o); S.settings = Object.assign(DEFAULTS().settings, o.settings); saveNow(); applySettings(); toast('Progress imported'); render(); } catch (e) { toast('This file is not a Parlance export.'); } };
  rd.readAsText(f);
};
ACT.resetAsk = () => sheet('<h2>Erase all progress?</h2><p>Reviews, notebook, drafts and results will be removed from this device. This cannot be undone.</p><div class="two"><button class="btn ghost" data-act="closeSheet">Keep everything</button><button class="btn danger" data-act="resetDo">Erase</button></div>');
ACT.resetDo = () => { S = DEFAULTS(); saveNow(); closeSheet(); applySettings(); go(''); };

/* ================= start ================= */
load(); applySettings(); Speech.init();
if (!location.hash) location.hash = '#/';
render(); netLabel();

</script>
<script>
/* Copie complète sur l'appareil : après la première ouverture, l'application fonctionne sans réseau. */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
