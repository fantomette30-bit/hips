<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parlance">
<meta name="theme-color" content="#F4F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A27" media="(prefers-color-scheme: dark)">
<meta name="description" content="Legal and HR English for professionals: vocabulary, registers, British and American usage, reading, writing and speaking. Works offline.">
<title>Parlance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#F4F1EC; --surface:#FDFCFA; --surface2:#EAE6DE; --ink:#1D2638; --muted:#5E6A80; --line:#DED8CC;
  --title:#2A3B5C; --brand:#2A3B5C; --brand2:#6B7FA1; --gold:#6B7FA1; --sand:#A8B8CC; --beige:#D9D0C1; --btn:#2A3B5C; --btn-ink:#F4F1EC;
  --ok:#3F6B4F; --ok-bg:#E3ECE3; --bad:#9C3535; --bad-bg:#F4E1DD; --mark:#E4DCCB;
  --shadow:0 1px 2px rgba(42,59,92,.06),0 8px 24px rgba(42,59,92,.09);
  --serif:"Iowan Old Style","Hoefler Text",Baskerville,"Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --scale:1; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131A27; --surface:#1B2434; --surface2:#253044; --ink:#F4F1EC; --muted:#A8B8CC; --line:#2E3A50;
  --title:#EEF1F6; --brand:#C3CFDF; --brand2:#93A5C3; --gold:#A8B8CC; --sand:#55678A; --beige:#6E685C; --btn:#465B85; --btn-ink:#FBFAF7;
  --ok:#8DBF9C; --ok-bg:#1D2D26; --bad:#E39A93; --bad-bg:#3A2224; --mark:#33415B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131A27; --surface:#1B2434; --surface2:#253044; --ink:#F4F1EC; --muted:#A8B8CC; --line:#2E3A50;
  --title:#EEF1F6; --brand:#C3CFDF; --brand2:#93A5C3; --gold:#A8B8CC; --sand:#55678A; --beige:#6E685C; --btn:#465B85; --btn-ink:#FBFAF7;
  --ok:#8DBF9C; --ok-bg:#1D2D26; --bad:#E39A93; --bad-bg:#3A2224; --mark:#33415B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(17px*var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100dvh;
  background-image:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 70%);background-attachment:fixed}
h1,h2,h3{font-family:var(--serif);color:var(--title);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:1.75rem;line-height:1.15} h2{font-size:1.25rem;line-height:1.25} h3{font-size:1rem;margin:18px 0 8px;font-family:var(--sans);color:var(--muted);font-weight:600}
p{margin:0 0 .6em} a{color:var(--brand2)} q{quotes:"«\00a0" "\00a0»";font-style:italic}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:1.35em;height:1.35em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.28em}

/* layout */
#app{min-height:100dvh}
#main{padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 96px);outline:none}
.page{max-width:720px;margin:0 auto;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 6px);
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:48px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.64rem;font-weight:600;letter-spacing:.02em}
#nav a.on{color:var(--brand)} #nav a.on .i{stroke-width:2}
#nav .brand{display:none}
body.immersive #nav{display:none} body.immersive #main{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
@media (min-width:900px){
  #app{display:grid;grid-template-columns:232px 1fr}
  #nav{position:sticky;top:0;height:100dvh;flex-direction:column;justify-content:flex-start;gap:4px;padding:28px 14px;border-top:0;border-right:1px solid var(--line)}
  #nav a{flex:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:.9rem;justify-content:flex-start}
  #nav a.on{background:var(--surface2)} #nav a.set{margin-top:auto}
  #nav .brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-family:var(--serif);font-size:1.3rem;color:var(--title)}
  #main{padding:44px 40px 60px} .page{max-width:820px}
  body.immersive #app{grid-template-columns:1fr}
}
.mono{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#6B7FA1,#2A3B5C);color:#F4F1EC;font-family:var(--serif);font-size:1.25rem;font-weight:600;box-shadow:inset 0 0 0 1px rgba(244,241,236,.35)}
.mono.big{width:84px;height:84px;border-radius:24px;font-size:3rem;box-shadow:inset 0 0 0 1.5px rgba(244,241,236,.4),var(--shadow)}

/* headings */
.head{display:flex;align-items:flex-start;gap:8px;margin:2px 0 18px}
.head .ib{margin:-4px 0 0 -10px}
.sub{color:var(--muted);font-size:.86rem;margin:.25em 0 0} .lead{font-family:var(--serif);font-size:1.08rem;color:var(--ink)}
.eyebrow,.reglabel{display:block;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
section{margin-top:26px} section>h2{margin-bottom:10px} section>.sub{margin:-6px 0 10px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.foot{color:var(--muted);font-size:.78rem;text-align:center;margin:28px 0 0}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 12px;box-shadow:var(--shadow)}
.card.link{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;transition:transform .15s ease}
.card.link:active,.tile:active{transform:scale(.985)}
.card.link b,.card b{display:block}
.card small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.cl-body{flex:1;min-width:0} .card.theme .cl-body{display:flex;gap:14px;align-items:flex-start} .card.theme .cl-body>div{flex:1;min-width:0}
.chev{color:var(--sand);margin-left:auto}
.card.feature{background:linear-gradient(150deg,#34486F,#22304B);border-color:transparent;color:#F4F1EC}
.card.feature b{font-family:var(--serif);font-size:1.2rem;color:#FBFAF7} .card.feature small{color:#C9D3E1} .card.feature .chev{color:#A8B8CC} .card.feature .eyebrow{color:#D9D0C1}
.card.locked{opacity:.62;display:flex;gap:14px;align-items:flex-start;box-shadow:none}
.card.theme{flex-wrap:nowrap;align-items:flex-start} .card.theme .chev{align-self:center}
.num{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--sand);color:var(--brand);font-family:var(--serif);font-weight:600}
.soon{display:flex!important;align-items:center;gap:6px;margin-top:8px!important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;text-align:left;margin:0;font-size:.95rem;transition:transform .15s ease}
.tile .i{color:var(--gold);width:1.6em;height:1.6em;margin-bottom:4px}
.list{padding:4px 18px} .list a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;min-height:52px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.list a:last-child{border-bottom:0} .list em{color:var(--muted);font-style:normal;font-size:.86rem;text-align:right}
.tick{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--btn);color:#fff;flex:none} .tick .i{width:15px;height:15px;stroke-width:2.4}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sand);flex:none} .dot.gold{background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.center{text-align:center} .center .ring{margin:6px auto 14px} .empty{text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic;margin:30px 20px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid transparent;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:.95rem;text-decoration:none;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.97)} .btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border-color:var(--sand);color:var(--brand)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.wide{display:flex;width:100%;margin:12px 0 0} .btn.small{min-height:36px;padding:0 12px;font-size:.82rem}
.btn.live{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{opacity:.75}}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0} .row .btn{flex:1 1 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.ib{display:inline-grid;place-items:center;position:relative;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--brand2);text-decoration:none;vertical-align:middle}
.ib:active{background:var(--surface2)} .ib.playing{color:var(--gold);background:var(--surface2)}
.tagv{position:absolute;right:1px;bottom:3px;font-size:.5rem;font-weight:800;letter-spacing:.04em;background:var(--surface);border-radius:4px;padding:0 2px;color:var(--muted)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.68rem;font-weight:700;letter-spacing:.05em;background:var(--surface2);color:var(--muted);border:0;vertical-align:.1em}
.chip.v-uk{background:color-mix(in srgb,var(--brand2) 16%,transparent);color:var(--brand)} .chip.v-us{background:color-mix(in srgb,var(--beige) 70%,transparent);color:var(--ink)}
.chip.tap{font-size:.84rem;font-weight:500;letter-spacing:0;padding:8px 14px;margin:0 6px 8px 0;color:var(--ink);min-height:38px}
.chip.r-formal{box-shadow:inset 0 0 0 1px var(--brand2);background:transparent;color:var(--brand)} .chip.r-informal{font-style:italic}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1} .bar.thin{height:5px;margin:10px 0 4px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ring{--p:0;width:92px;height:92px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--sand) calc(var(--p)*1%),var(--surface2) 0);position:relative}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)} .card .ring::before{background:var(--surface)}
.ring.gold{background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface2) 0);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.ring.live{background:conic-gradient(var(--bad) 100%,transparent 0);animation:pulse 1s ease infinite}
@keyframes pop{from{transform:scale(.8)}to{transform:none}}
.ring b{position:relative;font-family:var(--serif);font-size:1.5rem;color:var(--title);text-align:center;line-height:1} .ring small{display:block;font-family:var(--sans);font-size:.6rem;color:var(--muted);font-weight:600;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stats .i{color:var(--gold)} .stats b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--title)} .stats span{font-size:.7rem;color:var(--muted)}
.skills a,.errs div{display:grid;grid-template-columns:8.5em 1fr 3em;align-items:center;gap:10px;padding:9px 0;text-decoration:none;color:inherit;font-size:.9rem}
.skills em,.errs em{font-style:normal;color:var(--muted);font-size:.8rem;text-align:right}

/* entry */
.entry h1{font-size:2rem} .ipa{color:var(--muted);font-size:.95rem;margin:.3em 0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px} .ipa.alt b{color:var(--ink);font-weight:600}
.def{font-family:var(--serif);font-size:1.08rem;margin:.9em 0}
.reg,.explain,.colloc{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.reg{padding-left:14px;border-left:3px solid var(--sand);border-top:0;margin-left:-2px}
.reg-formal{border-left-color:var(--brand)} .reg-everyday{border-left-color:var(--brand2)} .reg-informal{border-left-color:var(--beige)}
.card.reg-formal,.card.reg-everyday,.card.reg-informal{border-left-width:4px}
.card.reg-formal{border-left-color:var(--brand)} .card.reg-everyday{border-left-color:var(--brand2)} .card.reg-informal{border-left-color:var(--beige)}
.regterm{font-weight:600;font-size:1.05rem;margin:0} .alt{color:var(--muted);font-weight:400;font-size:.88rem;display:inline-block;margin-left:4px}
.ex{font-family:var(--serif);font-size:1.02rem;margin:.2em 0}
mark{background:linear-gradient(transparent 58%,var(--mark) 0);color:inherit;font-weight:600;padding:0 1px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:6px} .recbox{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px} audio{height:40px;max-width:100%;flex:1}
details.fr{margin:.5em 0;border-radius:12px;background:var(--surface2);font-size:.9rem}
details.fr summary{list-style:none;cursor:pointer;padding:8px 12px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
details.fr summary::-webkit-details-marker{display:none} details.fr summary::before{content:"+ ";color:var(--gold)} details.fr[open] summary::before{content:"– "}
details.fr>div{padding:0 12px 10px} details.fr p:last-child{margin:0}
.conn{padding:12px 0;border-bottom:1px solid var(--line)} .conn:last-child{border-bottom:0;padding-bottom:0} .conn p{margin:0 0 .2em}
.warn{background:color-mix(in srgb,var(--gold) 10%,var(--surface))} .warn ul,.card ul{margin:0;padding-left:1.15em} .card li{margin:.35em 0}
.rule{font-family:var(--serif);font-size:1.1rem;color:var(--title)} .wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.heavy{color:var(--muted)} .natural{font-family:var(--serif);font-size:1.05rem} details.reveal summary{cursor:pointer;color:var(--brand2);font-weight:600;padding:8px 0;min-height:44px}
.written{font-family:var(--serif);font-size:1.15rem;color:var(--title)} .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 0;font-size:.92rem}
.phrase,.note{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)} .phrase:last-child,.note:last-child{border-bottom:0}
.phrase>span:last-child,.note>span{white-space:nowrap}

/* reading, dialogue, writing */
.doc{font-family:var(--serif);font-size:1.06rem;line-height:1.65;text-align:justify;hyphens:auto;-webkit-hyphens:auto} .doc p{margin:0 0 1em} .doc.veiled p{filter:blur(7px);user-select:none}
.gl,.lg{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1.5px dotted var(--gold);border-radius:0} .lg{border-bottom:1.5px solid var(--brand2)} .legend .gl,.legend .lg{padding-bottom:1px}
mark.cm{position:relative} mark.cm::after{content:attr(data-n);font-family:var(--sans);font-size:.6rem;vertical-align:super;color:var(--gold);font-weight:800;margin-left:1px}
.cmlist li{margin:.7em 0} .cmlist q{font-family:var(--serif);color:var(--title)}
.line{padding:10px 12px;margin:0 -12px;border-radius:14px;transition:background .25s} .line.on{background:var(--surface2)} .line p{margin:0}
.who{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)} .notext .txt{filter:blur(6px)}
textarea,input[type=text],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;outline:none}
textarea{min-height:9em;resize:vertical;font-family:var(--serif);line-height:1.6} textarea:focus,input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.gap{padding:10px 0;border-bottom:1px solid var(--line)} .gap:last-child{border:0} .gap input{display:inline-block;width:11em;max-width:100%;padding:6px 10px;margin:2px 4px}
input.ok{border-color:var(--ok);background:var(--ok-bg)} input.ko{border-color:var(--bad);background:var(--bad-bg)}
.right{font-weight:600;color:var(--ok)} .checkline{display:flex;gap:12px;align-items:flex-start;padding:9px 0;min-height:44px} .checkline input{width:22px;height:22px;accent-color:var(--brand2);flex:none;margin-top:1px}
.noteform label,.set label{display:block;font-size:.84rem;font-weight:600;color:var(--muted);margin-bottom:12px} .noteform textarea{min-height:0;margin-top:6px} .noteform input,.set select{margin-top:6px}
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:12px;padding:4px;margin-top:6px} .seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)} .filebtn{cursor:pointer}

/* sessions */
.sess{max-width:620px;margin:0 auto} .sess-top{display:flex;align-items:center;gap:10px;margin-bottom:18px} .sess-top .ib{margin-left:-10px} .count{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.prompt{font-family:var(--serif);font-size:1.3rem;line-height:1.35;color:var(--title);margin-bottom:8px} .qsub{color:var(--muted);font-size:.9rem;margin-bottom:6px} .qaudio{margin:4px 0 8px -10px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--gold)} .passage{font-size:1rem;color:var(--ink);background:var(--surface2);border-radius:14px;padding:14px;margin-bottom:14px;line-height:1.55}
.opts{display:grid;gap:10px;margin-top:16px} .opt{min-height:54px;text-align:left;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:1rem;transition:transform .12s,border-color .2s,background .2s}
.opt:active{transform:scale(.985)} .opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ko{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s} .opt:disabled{color:inherit;opacity:1}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.typed{display:flex;gap:10px;margin-top:16px} .typed input{flex:1}
.fb{margin-top:16px;padding:14px 16px;border-radius:16px;animation:rise .25s ease both} .fb.good{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)} .fb.neutral{background:var(--surface2)}
.fb>b{font-family:var(--serif);font-size:1.05rem} .fb.good>b{color:var(--ok)} .fb.bad>b{color:var(--bad)} .mini{font-size:.92rem;margin-top:6px} .fr-inline{color:var(--muted);margin-left:6px}
.sess.end{text-align:center;padding-top:8vh} .sess.end .ring{width:150px;height:150px;margin:0 auto 20px} .sess.end .ring b{font-size:2.6rem} .sess.end .ring small{display:inline;font-size:1rem}
.note{font-size:.95rem} .flash h2{font-size:1.6rem;margin:.2em 0} .flash hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px} .rate button{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:.86rem}
.rate button:nth-child(1){color:var(--bad)} .rate button:nth-child(3){color:var(--ok)} .rate button:nth-child(4){color:var(--brand2)}

/* welcome, sheet, toast */
.welcome{text-align:center;padding-top:6vh;max-width:460px;margin:0 auto} .welcome h1{font-size:2.6rem;margin:18px 0 8px} .welcome h2{margin:26px 0 4px;font-size:1.05rem}
#sheet{position:fixed;inset:0;z-index:50} .sheet-bg{position:absolute;inset:0;background:rgba(16,22,34,.5);animation:fade .2s} @keyframes fade{from{opacity:0}}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:24px 22px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}} .frline{color:var(--muted);font-style:italic}
@media (min-width:900px){.sheet-card{bottom:auto;top:50%;transform:translateY(-50%);border-radius:26px;animation:fade .2s}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
#toast.show{animation:rise .25s ease both}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{#nav,.ib,.btn{display:none!important} body{background:#fff} .card{box-shadow:none;break-inside:avoid}}
.ipa .ib,.ex .ib,.regterm .ib,.conn .ib,.explain .ib{width:38px;height:38px} .ib+.ib{margin-left:-6px}
.doc .reglabel{font-family:var(--sans);text-align:left}
details.fold{margin:0 0 10px} details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border-radius:16px;background:var(--surface2);margin-bottom:8px}
details.fold>summary::-webkit-details-marker{display:none} details.fold>summary small{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums} details.fold[open]>summary{background:transparent;border:1px solid var(--line)}

<script>window.PARLANCE_DATA={"themes":[{"id":"contract","title":"The employment contract","title_fr":"Le contrat de travail","blurb":"Offers, clauses, probation, amendments and the drafting words that hold a contract together."},{"id":"recruitment","title":"Recruitment","title_fr":"Le recrutement","blurb":"Job adverts, interviews, offers and onboarding."},{"id":"pay","title":"Pay and benefits","title_fr":"Rémunération et avantages","blurb":"Salary, bonuses, payslips and perks."},{"id":"time","title":"Working time","title_fr":"Le temps de travail","blurb":"Hours, overtime, leave and remote work."},{"id":"discipline","title":"Discipline and dismissal","title_fr":"Discipline et licenciement","blurb":"Warnings, hearings, grounds and procedure."},{"id":"exit","title":"Negotiated exits","title_fr":"Rupture conventionnelle et transaction","blurb":"Mutual termination and settlement agreements."},{"id":"collective","title":"Collective relations","title_fr":"Relations collectives","blurb":"Works councils, unions and bargaining."},{"id":"safety","title":"Health and safety","title_fr":"Santé et sécurité","blurb":"Risk, wellbeing, sick leave and fitness for work."},{"id":"equality","title":"Discrimination and harassment","title_fr":"Discrimination et harcèlement","blurb":"Complaints, investigations and protection."},{"id":"litigation","title":"Employment litigation","title_fr":"Le contentieux prud'homal","blurb":"Claims, hearings, remedies and appeals."},{"id":"data","title":"Data protection","title_fr":"Protection des données","blurb":"Employee data, monitoring and access requests."},{"id":"careers","title":"Training and careers","title_fr":"Formation et carrières","blurb":"Appraisals, development and mobility."}],"entries":{"contract":[{"id":"ct-001","level":1,"fr":"CDI (contrat à durée indéterminée)","term":{"uk":"permanent contract","us":"permanent contract"},"ipa":{"uk":"/ˈpɜːmənənt ˈkɒntrækt/","us":"/ˈpɜːrmənənt ˈkɑːntrækt/"},"def":"An employment contract with no end date, which continues until one of the parties terminates it.","registers":{"formal":{"uk":"indefinite-term employment contract","us":"indefinite-term employment contract","ex":"The Employee is engaged under an [[indefinite-term employment contract]] governed by French law."},"everyday":{"uk":"permanent contract","us":"permanent position","ex":"After two fixed-term contracts, they finally offered her a [[permanent contract]].","ex_us":"After two fixed-term contracts, they finally offered her a [[permanent position]]."},"informal":null},"collocations":["to be on a permanent contract","to offer someone a permanent contract","to move onto a permanent contract"],"note_fr":"Ne dites pas « undetermined contract » ni « unlimited contract ». Aux États-Unis, « permanent » ne garantit rien : l'emploi reste en principe « at-will » ; on y parle plutôt de « regular full-time employee ».","french_concept":true,"explain":{"written":"The CDI (contrat à durée indéterminée) is the standard French employment contract: it has no end date and can only be terminated on the grounds and by the procedures laid down by law.","spoken":"A CDI is basically a permanent contract - there's no end date, and the employer can't end it without a valid reason."}},{"id":"ct-002","level":1,"fr":"CDD (contrat à durée déterminée)","term":{"uk":"fixed-term contract","us":"fixed-term contract"},"ipa":{"uk":"/ˌfɪkst ˈtɜːm ˈkɒntrækt/","us":"/ˌfɪkst ˈtɜːrm ˈkɑːntrækt/"},"def":"An employment contract that ends on a set date or when a specific task or event is completed.","registers":{"formal":{"uk":"fixed-term employment contract","us":"fixed-term employment contract","ex":"A [[fixed-term employment contract]] may not be used to fill a post linked to the company's normal and permanent activity."},"everyday":{"uk":"fixed-term contract","us":"temporary contract","ex":"She's on a six-month [[fixed-term contract]] covering someone's maternity leave.","ex_us":"She's on a six-month [[temporary contract]] covering someone's maternity leave."},"informal":null},"collocations":["to be on a fixed-term contract","to take someone on on a fixed-term basis","a twelve-month fixed-term contract"],"note_fr":"Pas de « determined contract » ni de « limited contract ». Au Royaume-Uni et aux États-Unis, le recours au contrat à durée déterminée n'est pas limité à une liste de motifs comme en France : expliquez-le toujours.","french_concept":true,"explain":{"written":"The CDD (contrat à durée déterminée) is a fixed-term contract which, under French law, may only be used for specific temporary needs such as replacing an absent employee or covering a temporary increase in activity.","spoken":"A CDD is a fixed-term contract, but in France you can only use one for a genuinely temporary need - covering an absence, say, or a seasonal peak."}},{"id":"ct-003","level":1,"fr":"à temps plein","term":{"uk":"full-time","us":"full-time"},"ipa":{"uk":"/ˌfʊl ˈtaɪm/","us":"/ˌfʊl ˈtaɪm/"},"def":"Working the standard number of hours for the job, as opposed to reduced hours.","registers":{"formal":{"uk":"on a full-time basis","us":"on a full-time basis","ex":"The Employee shall be employed [[on a full-time basis]]."},"everyday":{"uk":"full-time","us":"full-time","ex":"Is the role [[full-time]], or would you consider four days a week?"},"informal":null},"collocations":["a full-time job","to work full-time","full-time equivalent (FTE)","to go back to full-time"],"note_fr":"« Full-time » s'emploie comme adjectif et comme adverbe (« she works full-time »), sans « at » : jamais « at full time ». L'ETP se dit « full-time equivalent » ou « FTE ».","french_concept":false,"explain":null},{"id":"ct-004","level":1,"fr":"à temps partiel","term":{"uk":"part-time","us":"part-time"},"ipa":{"uk":"/ˌpɑːt ˈtaɪm/","us":"/ˌpɑːrt ˈtaɪm/"},"def":"Working fewer hours than a full-time employee in the same organisation.","registers":{"formal":{"uk":"on a part-time basis","us":"on a part-time basis","ex":"The Employee is engaged [[on a part-time basis]] for twenty-four hours per week."},"everyday":{"uk":"to go part-time","us":"to go part-time","ex":"He's asked [[to go part-time]] when he comes back from parental leave."},"informal":null},"collocations":["a part-time contract","to work part-time","a part-timer","to cut down to three days a week"],"note_fr":"Évitez le calque « partial time ». Un salarié à temps partiel est « a part-timer » ou « a part-time employee ». Le « 80 % » français se dit plutôt en jours : « she works four days a week ».","french_concept":false,"explain":null},{"id":"ct-005","level":2,"fr":"travail temporaire (intérim)","term":{"uk":"agency work","us":"temp work"},"ipa":{"uk":"/ˈeɪdʒ(ə)nsi wɜːk/","us":"/ˈtemp wɜːrk/"},"def":"Work done for a client company by someone who is employed and paid by an employment agency.","registers":{"formal":{"uk":"temporary agency work","us":"temporary staffing","ex":"The company may have recourse to [[temporary agency work]] only for a precise and temporary task.","ex_us":"The company may have recourse to [[temporary staffing]] only for a precise and temporary task."},"everyday":{"uk":"agency staff","us":"temps","ex":"We've had to bring in [[agency staff]] to get through the Christmas rush.","ex_us":"We've had to bring in [[temps]] to get through the Christmas rush."},"informal":{"uk":"temping","us":"temping","ex":"She did a year of [[temping]] before she landed a proper job."}},"collocations":["an agency worker","a temp agency","to bring in agency staff","to work through an agency"],"note_fr":"« Interim » est un faux ami : « an interim manager » est un manager de transition, « in the interim » signifie « entre-temps ». L'intérimaire est « an agency worker » (UK) ou « a temp » (surtout US) ; l'entreprise de travail temporaire, « a staffing agency » (US) ou « an employment agency » (UK).","french_concept":false,"explain":null},{"id":"ct-006","level":2,"fr":"contrat d'apprentissage","term":{"uk":"apprenticeship contract","us":"apprenticeship contract"},"ipa":{"uk":"/əˈprentɪsʃɪp ˈkɒntrækt/","us":"/əˈprentɪsʃɪp ˈkɑːntrækt/"},"def":"A contract combining paid work with structured training that leads to a recognised qualification.","registers":{"formal":{"uk":"apprenticeship agreement","us":"apprenticeship agreement","ex":"The [[apprenticeship agreement]] shall specify the qualification for which the apprentice is being trained."},"everyday":{"uk":"apprenticeship","us":"apprenticeship","ex":"He's doing an [[apprenticeship]] with us while he finishes his master's."},"informal":null},"collocations":["to take on an apprentice","to do an apprenticeship","to serve an apprenticeship","a degree apprenticeship"],"note_fr":"« Alternance » n'a pas d'équivalent exact : dites « a work-study programme » (US « program ») ou « an apprenticeship ». Ne confondez pas « apprentice » (apprenti), « trainee » (stagiaire en formation interne) et « intern » (stagiaire étudiant).","french_concept":false,"explain":null},{"id":"ct-007","level":2,"fr":"contrat zéro heure","term":{"uk":"zero-hours contract","us":"zero-hours contract"},"ipa":{"uk":"/ˌzɪərəʊ ˈaʊəz ˈkɒntrækt/","us":"/ˌzɪroʊ ˈaʊərz ˈkɑːntrækt/"},"def":"A UK arrangement under which the employer does not guarantee any minimum number of working hours.","registers":{"formal":{"uk":"zero-hours contract","us":"on-call employment arrangement","ex":"Under a [[zero-hours contract]], the employer is under no obligation to offer any work.","ex_us":"Under an [[on-call employment arrangement]], the employer is under no obligation to offer any work."},"everyday":{"uk":"zero-hours contract","us":"on-call work","ex":"Most of the bar staff are on [[zero-hours contracts]], so their pay varies a lot from week to week.","ex_us":"Most of the bar staff do [[on-call work]], so their pay varies a lot from week to week."},"informal":null},"collocations":["to be on a zero-hours contract","guaranteed hours","casual work","to be offered shifts"],"note_fr":"Notion essentiellement britannique, sans équivalent en droit français, où le contrat à temps partiel doit en principe prévoir une durée de travail. Aux États-Unis, on parlera de « on-call » ou « per diem » work.","french_concept":false,"explain":null},{"id":"ct-008","level":2,"fr":"emploi « at-will » (rupture libre, sans motif)","term":{"uk":"at-will employment","us":"at-will employment"},"ipa":{"uk":"/ət ˌwɪl ɪmˈplɔɪmənt/","us":"/ət ˌwɪl ɪmˈplɔɪmənt/"},"def":"The default US rule under which either party may end the employment at any time, with or without a reason or notice.","registers":{"formal":{"uk":"employment at will","us":"employment at will","ex":"Nothing in this handbook alters the [[employment at will]] relationship between the Company and its employees."},"everyday":{"uk":"at-will","us":"at-will","ex":"Remember that our US staff are [[at-will]], so there's no notice period to negotiate."},"informal":null},"collocations":["an at-will employee","an at-will state","an exception to at-will employment","to be employed at will"],"note_fr":"Notion américaine, inconnue en France comme au Royaume-Uni. « At-will » ne veut pas dire sans limites : un licenciement discriminatoire ou prononcé en représailles reste illicite. Évitez de traduire par « à volonté ».","french_concept":false,"explain":null},{"id":"ct-009","level":1,"fr":"salarié(e)","term":{"uk":"employee","us":"employee"},"ipa":{"uk":"/ɪmˈplɔɪiː/","us":"/ɪmˈplɔɪiː/"},"def":"A person who works for an employer under a contract of employment in return for pay.","registers":{"formal":{"uk":"employee","us":"employee","ex":"The [[Employee]] shall devote the whole of his or her working time to the business of the Company."},"everyday":{"uk":"on the payroll","us":"on the payroll","ex":"We've got about two hundred people [[on the payroll]] in France."},"informal":{"uk":"on the books","us":"on the books","ex":"He's been [[on the books]] since March, so he's covered by the company health plan."}},"collocations":["a salaried employee","a member of staff","to have someone on the payroll","employee status"],"note_fr":"« Salaried » n'est pas « salarié » : « a salaried employee » est payé au mois, par opposition à « an hourly employee ». « Staff » est collectif : « a member of staff », jamais « a staff ». « Personnel » est rare et administratif.","french_concept":false,"explain":null},{"id":"ct-010","level":3,"fr":"« worker » (statut intermédiaire britannique)","term":{"uk":"worker","us":"worker"},"ipa":{"uk":"/ˈwɜːkə/","us":"/ˈwɜːrkər/"},"def":"In UK law, a person who works personally for someone else without being a full employee, and who has some but not all employment rights.","registers":{"formal":{"uk":"worker","us":"worker","ex":"The tribunal held that the claimant was a [[worker]] rather than an employee and was therefore entitled to paid annual leave."},"everyday":{"uk":"worker status","us":"worker status","ex":"The drivers are claiming [[worker status]], which would give them holiday pay and the minimum wage."},"informal":null},"collocations":["worker status","to qualify as a worker","workers' rights","a casual worker"],"note_fr":"Au Royaume-Uni, « worker » est une catégorie juridique située entre « employee » et « self-employed » : salaire minimum et congés payés, mais pas la protection contre le licenciement abusif. Ni la France ni les États-Unis ne connaissent ce troisième statut ; ailleurs, « worker » veut simplement dire « travailleur ».","french_concept":false,"explain":null},{"id":"ct-011","level":2,"fr":"travailleur indépendant / prestataire","term":{"uk":"independent contractor","us":"independent contractor"},"ipa":{"uk":"/ˌɪndɪˈpendənt kənˈtræktə/","us":"/ˌɪndɪˈpendənt ˈkɑːntræktər/"},"def":"A self-employed person who provides services to a client under a commercial contract rather than an employment contract.","registers":{"formal":{"uk":"independent contractor","us":"independent contractor","ex":"The Consultant is engaged as an [[independent contractor]] and nothing in this agreement shall create a contract of employment."},"everyday":{"uk":"freelancer","us":"freelancer","ex":"We use a [[freelancer]] for the payroll audits rather than hiring someone."},"informal":null},"collocations":["to work as a contractor","to go freelance","to be self-employed","a contract for services"],"note_fr":"Distinguez « a contract of employment » ou « contract of service » (contrat de travail) de « a contract for services » (contrat de prestation). « Independent » seul ne s'emploie pas comme nom : dites « a contractor », « a freelancer » ou « self-employed ».","french_concept":false,"explain":null},{"id":"ct-012","level":3,"fr":"salariat déguisé / requalification en contrat de travail","term":{"uk":"misclassification","us":"misclassification"},"ipa":{"uk":"/ˌmɪsklæsɪfɪˈkeɪʃ(ə)n/","us":"/ˌmɪsklæsəfəˈkeɪʃ(ə)n/"},"def":"Treating someone as self-employed when the reality of the relationship is that of an employee.","registers":{"formal":{"uk":"false self-employment","us":"worker misclassification","ex":"The inspector found evidence of [[false self-employment]] and ordered the payment of back contributions.","ex_us":"The inspector found evidence of [[worker misclassification]] and ordered the payment of back contributions."},"everyday":{"uk":"to be misclassified","us":"to be misclassified","ex":"If he works set hours and reports to our manager, there's a real risk he [[is misclassified]]."},"informal":null},"collocations":["to reclassify a contractor as an employee","bogus self-employment","employment status","a sham contract"],"note_fr":"« Requalification » n'a pas de traduction directe : dites « the contract was reclassified as an employment contract » ou « he was found to be an employee ». Le critère français est le lien de subordination ; au Royaume-Uni on parle de « employment status », aux États-Unis de « misclassification ».","french_concept":false,"explain":null},{"id":"ct-013","level":3,"fr":"portage salarial","term":{"uk":"umbrella company employment","us":"umbrella company employment"},"ipa":{"uk":"/ʌmˈbrelə ˌkʌmp(ə)ni ɪmˈplɔɪmənt/","us":"/ʌmˈbrelə ˌkʌmpəni ɪmˈplɔɪmənt/"},"def":"A three-party arrangement in which an independent professional is employed by an intermediary company that invoices the client and pays the professional a salary.","registers":{"formal":{"uk":"umbrella company employment","us":"employer-of-record arrangement","ex":"The consultant provides her services through [[umbrella company employment]], the umbrella company being her legal employer.","ex_us":"The consultant provides her services through an [[employer-of-record arrangement]], the employer of record being her legal employer."},"everyday":{"uk":"to work through an umbrella company","us":"to work through an employer of record","ex":"She finds her own clients but [[works through an umbrella company]], so she's technically an employee.","ex_us":"She finds her own clients but [[works through an employer of record]], so she's technically an employee."},"informal":null},"collocations":["an umbrella company","the end client","to invoice on someone's behalf"],"note_fr":"Les équivalents sont approximatifs : l'« umbrella company » britannique et l'« employer of record » américain reposent sur des logiques proches, mais le portage salarial est un dispositif français encadré par la loi. Gardez le terme français et glosez-le.","french_concept":true,"explain":{"written":"Portage salarial is a French statutory arrangement under which an autonomous professional is employed by a specialist company that invoices his or her clients and converts the fees into a salary.","spoken":"It's a bit like working through an umbrella company: she finds her own clients, but a specialist firm invoices them and pays her a salary."}},{"id":"ct-014","level":2,"fr":"détachement","term":{"uk":"secondment","us":"temporary assignment"},"ipa":{"uk":"/sɪˈkɒndmənt/","us":"/ˈtempəreri əˈsaɪnmənt/"},"def":"A temporary transfer to another entity or country while remaining employed by the original employer.","registers":{"formal":{"uk":"secondment","us":"temporary assignment","ex":"During the [[secondment]], the Employee shall remain an employee of the home company.","ex_us":"During the [[temporary assignment]], the Employee shall remain an employee of the home company."},"everyday":{"uk":"to be seconded to","us":"to be on loan to","ex":"She's [[been seconded to]] the Dublin office for a year.","ex_us":"She's [[been on loan to]] the Dublin office for a year."},"informal":null},"collocations":["to go on secondment","a secondment agreement","a secondee","the host company"],"note_fr":"« Secondment » (accent sur la deuxième syllabe, comme le verbe « to second » /sɪˈkɒnd/) est britannique ; un Américain dira « assignment » ou « loan ». Le détachement au sens du droit européen se dit « posting » : « a posted worker ». « Detachment » est un faux ami (détachement affectif ou militaire).","french_concept":false,"explain":null},{"id":"ct-015","level":2,"fr":"expatriation","term":{"uk":"expatriate assignment","us":"expatriate assignment"},"ipa":{"uk":"/ekˈspætriət əˈsaɪnmənt/","us":"/ekˈspeɪtriət əˈsaɪnmənt/"},"def":"A long-term posting abroad, usually with a specific package and a contract adapted to the host country.","registers":{"formal":{"uk":"international assignment","us":"international assignment","ex":"The terms of the [[international assignment]] are set out in the attached assignment letter."},"everyday":{"uk":"to be posted abroad","us":"to be posted abroad","ex":"He [[was posted abroad]] for three years and came back on a local contract."},"informal":null},"collocations":["an expat package","to go on assignment","the home country and the host country","to repatriate an employee"],"note_fr":"En français, le détaché reste rattaché au contrat et à la sécurité sociale d'origine alors que l'expatrié en sort : l'anglais ne fait pas cette distinction avec deux mots, précisez-la. La prononciation diffère : UK /ekˈspætriət/, US /ekˈspeɪtriət/.","french_concept":false,"explain":null},{"id":"ct-016","level":1,"fr":"convention collective","term":{"uk":"collective agreement","us":"collective bargaining agreement"},"ipa":{"uk":"/kəˈlektɪv əˈɡriːmənt/","us":"/kəˈlektɪv ˈbɑːrɡənɪŋ əˈɡriːmənt/"},"def":"A written agreement negotiated between employers and trade unions that sets pay and working conditions for a group of employees.","registers":{"formal":{"uk":"the applicable collective agreement","us":"the applicable collective bargaining agreement","ex":"This contract is governed by [[the applicable collective agreement]], a copy of which is available from Human Resources.","ex_us":"This contract is governed by [[the applicable collective bargaining agreement]], a copy of which is available from Human Resources."},"everyday":{"uk":"the industry agreement","us":"the union contract","ex":"Check [[the industry agreement]] first - it may give a longer notice period than the contract.","ex_us":"Check [[the union contract]] first - it may give a longer notice period than the contract."},"informal":null},"collocations":["to be covered by a collective agreement","an industry-wide agreement","a company-level agreement","to fall within the scope of the agreement"],"note_fr":"« Convention » est un faux ami (congrès, usage). En France, la convention collective de branche s'applique à presque tous les salariés ; au Royaume-Uni et aux États-Unis, un accord collectif ne couvre que les entreprises où un syndicat est reconnu. Le « CBA » américain est en pratique un accord d'entreprise.","french_concept":true,"explain":{"written":"The convention collective is a sector-wide collective agreement which, once extended by the government, binds every employer in the industry and supplements the Labour Code.","spoken":"In France almost every employee is covered by an industry-wide agreement - it sits on top of the law and often gives better terms than the contract."}},{"id":"ct-017","level":3,"fr":"forfait jours","term":{"uk":"annual working-days arrangement","us":"annual working-days arrangement"},"ipa":{"uk":"/ˌænjuəl ˈwɜːkɪŋ deɪz əˌreɪndʒmənt/","us":"/ˌænjuəl ˈwɜːrkɪŋ deɪz əˌreɪndʒmənt/"},"def":"A French arrangement under which an autonomous employee's working time is counted in days per year rather than in hours.","registers":{"formal":{"uk":"annual working-days arrangement","us":"annual working-days arrangement","ex":"The Employee's working time is organised under an [[annual working-days arrangement]], as permitted by the applicable collective agreement."},"everyday":{"uk":"to be on a days-per-year contract","us":"to be on a days-per-year contract","ex":"Most of our managers [[are on a days-per-year contract]], so we don't track their hours."},"informal":null},"collocations":["to count working time in days","an autonomous employee","to monitor workload","rest days"],"note_fr":"Aucun équivalent direct. Le plus proche est, aux États-Unis, l'« exempt employee » (non soumis aux heures supplémentaires), mais la logique est différente. N'écrivez pas « day package » ni « flat-rate days » sans explication.","french_concept":true,"explain":{"written":"The forfait jours is a French arrangement, requiring both a collective agreement and the employee's written consent, whereby working time is measured as a fixed number of days per year instead of weekly hours.","spoken":"Their time is counted in days per year, not hours - so there's no overtime, but we have to keep an eye on their workload and rest."}},{"id":"ct-018","level":3,"fr":"lien de subordination","term":{"uk":"relationship of subordination","us":"relationship of subordination"},"ipa":{"uk":"/rɪˈleɪʃ(ə)nʃɪp əv səˌbɔːdɪˈneɪʃ(ə)n/","us":"/rɪˈleɪʃ(ə)nʃɪp əv səˌbɔːrdɪˈneɪʃ(ə)n/"},"def":"The employer's power to give instructions, supervise the work and discipline the employee, which defines an employment contract in French law.","registers":{"formal":{"uk":"relationship of subordination","us":"relationship of subordination","ex":"The existence of an employment contract depends on a [[relationship of subordination]], whatever name the parties have given to their agreement."},"everyday":{"uk":"to be under someone's control","us":"to be under someone's control","ex":"If he [[is under our control]] day to day, a court will treat him as an employee."},"informal":null},"collocations":["the right to control","to work under the direction of","to give instructions","the control test"],"note_fr":"« Subordination » et « subordinate » existent, mais sonnent durs dans la conversation : parlez de « control » ou de « direction ». Au Royaume-Uni, les juges examinent « control », « mutuality of obligation » et « personal service » ; aux États-Unis, le « right to control ».","french_concept":true,"explain":{"written":"Under French law an employment contract is characterised by a relationship of subordination, meaning that the employer has the power to give orders, monitor their execution and sanction any failings.","spoken":"What makes someone an employee in France is control: the employer tells them what to do, checks the work and can discipline them."}},{"id":"ct-019","level":1,"fr":"embaucher / recruter","term":{"uk":"to hire","us":"to hire"},"ipa":{"uk":"/ˈhaɪə/","us":"/ˈhaɪər/"},"def":"To give someone a job and enter into an employment relationship with them.","registers":{"formal":{"uk":"to engage","us":"to hire","ex":"The Company agrees [[to engage]] the Employee as Regional Sales Manager.","ex_us":"The Company agrees [[to hire]] the Employee as Regional Sales Manager."},"everyday":{"uk":"to take on","us":"to bring on","ex":"We're [[taking on]] three new consultants in September.","ex_us":"We're [[bringing on]] three new consultants in September."},"informal":null},"collocations":["to hire someone as a manager","a new hire","a hiring freeze","to take on staff"],"note_fr":"« To engage » signifie ici « embaucher » uniquement en style contractuel britannique ; à l'oral, « to engage » veut dire « impliquer ». « A new hire » ou « a new joiner » (UK) désigne la personne recrutée. Évitez « to embauch » et le calque « to make an engagement ».","french_concept":false,"explain":null},{"id":"ct-020","level":1,"fr":"offre d'emploi (proposition faite au candidat)","term":{"uk":"job offer","us":"job offer"},"ipa":{"uk":"/ˈdʒɒb ˌɒfə/","us":"/ˈdʒɑːb ˌɔːfər/"},"def":"A proposal made by an employer to a chosen candidate to take up a specific job on stated terms.","registers":{"formal":{"uk":"offer of employment","us":"offer of employment","ex":"We are pleased to confirm our [[offer of employment]] on the terms set out below."},"everyday":{"uk":"to make someone an offer","us":"to make someone an offer","ex":"We'd like [[to make her an offer]] before she hears back from the other firm."},"informal":null},"collocations":["to receive a job offer","to extend an offer","a verbal offer","to put an offer in writing"],"note_fr":"« Job offer » est l'offre faite à un candidat retenu ; l'offre d'emploi publiée est « a job advertisement », « a job ad » ou « a job posting » (US), « a vacancy » (UK). « To extend an offer » est très courant aux États-Unis.","french_concept":false,"explain":null},{"id":"ct-021","level":1,"fr":"lettre d'engagement / lettre d'offre","term":{"uk":"offer letter","us":"offer letter"},"ipa":{"uk":"/ˈɒfə ˌletə/","us":"/ˈɔːfər ˌletər/"},"def":"A letter from the employer confirming the job offer and its main terms.","registers":{"formal":{"uk":"letter of offer","us":"offer letter","ex":"Please sign and return the enclosed [[letter of offer]] by Friday 12 June.","ex_us":"Please sign and return the enclosed [[offer letter]] by Friday, June 12."},"everyday":{"uk":"offer letter","us":"offer letter","ex":"HR will send out the [[offer letter]] as soon as the salary's been approved."},"informal":null},"collocations":["to send out an offer letter","to sign and return the offer letter","to countersign the letter"],"note_fr":"Aux États-Unis, l'« offer letter » tient souvent lieu de contrat : beaucoup de salariés n'ont pas d'autre document. En France et au Royaume-Uni, elle précède en général un contrat écrit complet.","french_concept":false,"explain":null},{"id":"ct-022","level":2,"fr":"offre conditionnelle (sous réserve de vérifications)","term":{"uk":"conditional offer","us":"contingent offer"},"ipa":{"uk":"/kənˈdɪʃ(ə)nəl ˈɒfə/","us":"/kənˈtɪndʒənt ˈɔːfər/"},"def":"A job offer that only becomes final once certain conditions, such as references or checks, have been met.","registers":{"formal":{"uk":"offer subject to","us":"offer contingent upon","ex":"This [[offer is subject to]] the receipt of two satisfactory references and proof of your right to work in the United Kingdom.","ex_us":"This [[offer is contingent upon]] the successful completion of a background check and proof of your eligibility to work in the United States."},"everyday":{"uk":"conditional offer","us":"contingent offer","ex":"It's only a [[conditional offer]] for now - don't hand in your notice until the checks have come back.","ex_us":"It's only a [[contingent offer]] for now - don't give notice until the checks have come back."},"informal":null},"collocations":["subject to satisfactory references","to make an offer conditional on","an unconditional offer","to meet the conditions"],"note_fr":"« Subject to » (sous réserve de) est la formule clé ; ne traduisez pas « sous réserve de » par « under reserve of ». Aux États-Unis, on dit plus volontiers « contingent on/upon ».","french_concept":false,"explain":null},{"id":"ct-023","level":2,"fr":"promesse d'embauche","term":{"uk":"binding offer of employment","us":"binding offer of employment"},"ipa":{"uk":"/ˌbaɪndɪŋ ˈɒfər əv ɪmˈplɔɪmənt/","us":"/ˌbaɪndɪŋ ˈɔːfər əv ɪmˈplɔɪmənt/"},"def":"In French practice, a written offer precise enough about the job, pay and start date to commit the employer.","registers":{"formal":{"uk":"binding offer of employment","us":"binding offer of employment","ex":"A [[binding offer of employment]] which specifies the position, the remuneration and the start date commits the employer under French law."},"everyday":{"uk":"firm offer","us":"firm offer","ex":"Be careful what you put in that email - in France a [[firm offer]] can be as good as a contract."},"informal":null},"collocations":["to make a firm offer","to go back on an offer","to be bound by an offer","to claim damages"],"note_fr":"Ne traduisez pas par « promise of hiring » ou « hiring promise ». Le droit français distingue l'offre de contrat de travail de la promesse unilatérale de contrat, cette dernière valant contrat dès que le candidat l'accepte ; au Royaume-Uni, une offre acceptée forme déjà le contrat, et aux États-Unis l'« at-will » limite fortement la portée d'une telle promesse.","french_concept":true,"explain":{"written":"Under French case law, a promesse d'embauche that states the position, the remuneration and the start date may bind the employer, so that withdrawing it can amount to an unlawful termination.","spoken":"In France, once you've put the job, the salary and the start date in writing, you may already be committed - pulling out can cost you damages."}},{"id":"ct-024","level":1,"fr":"accepter une offre","term":{"uk":"to accept an offer","us":"to accept an offer"},"ipa":{"uk":"/əkˌsept ən ˈɒfə/","us":"/əkˌsept ən ˈɔːfər/"},"def":"To agree formally to take a job on the terms proposed.","registers":{"formal":{"uk":"to accept the offer","us":"to accept the offer","ex":"Please confirm in writing that you [[accept the offer]] by signing and returning one copy of this letter."},"everyday":{"uk":"to say yes","us":"to say yes","ex":"She [[said yes]] straight away, so we can stop interviewing."},"informal":null},"collocations":["to accept an offer in writing","acceptance of the offer","to take the job","to accept on the spot"],"note_fr":"Attention à la construction : « to accept an offer », mais « to agree to the terms » (jamais « to accept to do something »). « Acceptance » est le nom ; « acceptation » n'existe pas dans ce sens.","french_concept":false,"explain":null},{"id":"ct-025","level":2,"fr":"décliner une offre","term":{"uk":"to decline an offer","us":"to decline an offer"},"ipa":{"uk":"/dɪˌklaɪn ən ˈɒfə/","us":"/dɪˌklaɪn ən ˈɔːfər/"},"def":"To refuse a job offer politely.","registers":{"formal":{"uk":"to decline the offer","us":"to decline the offer","ex":"After careful consideration, I regret that I must [[decline the offer]]."},"everyday":{"uk":"to turn down","us":"to turn down","ex":"He [[turned down]] the offer because the package didn't include a company car."},"informal":null},"collocations":["to turn an offer down flat","to decline politely","to reject a counter-offer","to pass on an opportunity"],"note_fr":"« To refuse an offer » est correct mais plus sec ; « to turn down » est le verbe naturel à l'oral. « To decline » se construit directement : « she declined the offer », sans préposition.","french_concept":false,"explain":null},{"id":"ct-026","level":2,"fr":"retirer une offre","term":{"uk":"to withdraw an offer","us":"to rescind an offer"},"ipa":{"uk":"/wɪðˌdrɔː ən ˈɒfə/","us":"/rɪˌsɪnd ən ˈɔːfər/"},"def":"To cancel a job offer after it has been made.","registers":{"formal":{"uk":"to withdraw the offer","us":"to rescind the offer","ex":"The Company reserves the right [[to withdraw the offer]] if the references prove unsatisfactory.","ex_us":"The Company reserves the right [[to rescind the offer]] if the background check proves unsatisfactory."},"everyday":{"uk":"to pull the offer","us":"to pull the offer","ex":"They [[pulled the offer]] two days before he was due to start."},"informal":null},"collocations":["to withdraw an offer of employment","to go back on an offer","a withdrawn offer"],"note_fr":"« To retire » signifie « prendre sa retraite », jamais « retirer ». Au Royaume-Uni, retirer une offre déjà acceptée constitue une rupture de contrat ; aux États-Unis, « to rescind an offer » est en général possible, sous réserve des règles anti-discrimination.","french_concept":false,"explain":null},{"id":"ct-027","level":1,"fr":"date d'entrée en fonction","term":{"uk":"start date","us":"start date"},"ipa":{"uk":"/ˈstɑːt deɪt/","us":"/ˈstɑːrt deɪt/"},"def":"The day on which the employee begins working under the contract.","registers":{"formal":{"uk":"commencement date","us":"commencement date","ex":"The Employee's employment shall begin on the [[commencement date]] stated in Schedule 1."},"everyday":{"uk":"start date","us":"start date","ex":"Can we push her [[start date]] back a week? Her laptop won't be ready."},"informal":null},"collocations":["to agree a start date","to bring the start date forward","to push back the start date","with effect from 1 March"],"note_fr":"Ne dites pas « date of entry » ni « entrance date ». « To push back » = reporter, « to bring forward » = avancer. Notez l'usage : UK « to agree a date », US « to agree on a date ».","french_concept":false,"explain":null},{"id":"ct-028","level":2,"fr":"prendre ses fonctions","term":{"uk":"to take up one's duties","us":"to take up one's duties"},"ipa":{"uk":"/ˌteɪk ʌp wʌnz ˈdjuːtiz/","us":"/ˌteɪk ʌp wʌnz ˈduːtiz/"},"def":"To begin working in a new job or position.","registers":{"formal":{"uk":"to take up one's duties","us":"to take up one's duties","ex":"The Employee shall [[take up her duties]] on 1 September at the Company's head office."},"everyday":{"uk":"to start","us":"to start","ex":"She [[starts]] on Monday, so let's make sure someone's there to show her round."},"informal":null},"collocations":["to take up a post","to take up a position","to join the company","to step into a role"],"note_fr":"Pas de « to take one's functions » : « function » désigne en anglais un service de l'entreprise (« the HR function ») ou une réception, pas le poste d'une personne. « To take up » est indispensable ; « to join » (sans « to ») pour « rejoindre l'entreprise ».","french_concept":false,"explain":null},{"id":"ct-029","level":2,"fr":"vérification du droit de travailler (titre de séjour, autorisation de travail)","term":{"uk":"right-to-work check","us":"employment eligibility verification"},"ipa":{"uk":"/ˌraɪt tə ˈwɜːk tʃek/","us":"/ɪmˈplɔɪmənt ˌelɪdʒəˈbɪləti ˌverɪfɪˈkeɪʃ(ə)n/"},"def":"The employer's legal duty to verify, before employment starts, that a person is allowed to work in the country.","registers":{"formal":{"uk":"right-to-work check","us":"employment eligibility verification","ex":"Your employment is conditional upon the satisfactory completion of a [[right-to-work check]].","ex_us":"Your employment is conditional upon the satisfactory completion of [[employment eligibility verification]]."},"everyday":{"uk":"to check someone's right to work","us":"to verify someone's work authorization","ex":"Don't let him start until we've [[checked his right to work]].","ex_us":"Don't let him start until we've [[verified his work authorization]]."},"informal":null},"collocations":["proof of the right to work","a work permit","a work visa","to carry out a check"],"note_fr":"Piège majeur : aux États-Unis, « right-to-work » désigne les lois d'État qui interdisent d'imposer l'adhésion à un syndicat, pas le droit de travailler des étrangers. Là-bas, la vérification passe par le formulaire I-9 ; on parle de « work authorization ».","french_concept":false,"explain":null},{"id":"ct-030","level":2,"fr":"vérifications préalables à l'embauche (références, antécédents)","term":{"uk":"pre-employment checks","us":"background check"},"ipa":{"uk":"/ˌpriː ɪmˈplɔɪmənt tʃeks/","us":"/ˈbækɡraʊnd tʃek/"},"def":"Verifications of a candidate's identity, qualifications, work history or record carried out before hiring is confirmed.","registers":{"formal":{"uk":"pre-employment checks","us":"background check","ex":"The offer remains subject to the satisfactory outcome of [[pre-employment checks]].","ex_us":"The offer remains subject to the satisfactory outcome of a [[background check]]."},"everyday":{"uk":"to take up references","us":"to check references","ex":"We always [[take up references]] before we send the contract out.","ex_us":"We always [[check references]] before we send the contract out."},"informal":null},"collocations":["to give someone a reference","a referee","to run a background check","a criminal record check"],"note_fr":"« A reference » est la recommandation ; la personne qui la donne est « a referee » (UK) ou « a reference » (US). En France, ces vérifications sont strictement encadrées (lien direct avec le poste, information du candidat), bien plus qu'aux États-Unis où le « background check » est courant.","french_concept":false,"explain":null},{"id":"ct-031","level":3,"fr":"document écrit récapitulant les conditions essentielles d'emploi (UK)","term":{"uk":"written statement of particulars","us":"written statement of terms"},"ipa":{"uk":"/ˌrɪt(ə)n ˌsteɪtmənt əv pəˈtɪkjʊləz/","us":"/ˌrɪt(ə)n ˌsteɪtmənt əv ˈtɜːrmz/"},"def":"In the UK, the document an employer must give setting out the main terms of employment, such as pay, hours and holiday.","registers":{"formal":{"uk":"written statement of employment particulars","us":"written statement of the terms of employment","ex":"The employer must provide a [[written statement of employment particulars]] no later than the first day of employment.","ex_us":"The employer must provide a [[written statement of the terms of employment]] no later than the first day of employment."},"everyday":{"uk":"written statement","us":"written statement","ex":"He never got a contract as such, but he did get a [[written statement]] on day one."},"informal":null},"collocations":["to issue a written statement","the principal statement","the main terms of employment","a day-one right"],"note_fr":"Notion britannique : ce n'est pas le contrat lui-même, mais l'information écrite obligatoire sur ses éléments essentiels, due au plus tard le premier jour de travail. « Particulars » signifie ici « mentions, renseignements », pas « particuliers ». Il n'existe pas d'obligation fédérale générale comparable aux États-Unis.","french_concept":false,"explain":null},{"id":"ct-032","level":1,"fr":"livret d'accueil / règlement et politiques internes","term":{"uk":"staff handbook","us":"employee handbook"},"ipa":{"uk":"/ˈstɑːf ˌhændbʊk/","us":"/ɪmˈplɔɪiː ˌhændbʊk/"},"def":"A document given to employees that explains the organisation's rules, policies and procedures.","registers":{"formal":{"uk":"staff handbook","us":"employee handbook","ex":"The policies contained in the [[Staff Handbook]] do not form part of your contract of employment.","ex_us":"The policies contained in the [[Employee Handbook]] do not create a contract of employment."},"everyday":{"uk":"handbook","us":"handbook","ex":"It's all in the [[handbook]] - have a look at the section on expenses."},"informal":null},"collocations":["to issue a handbook","to update the handbook","to acknowledge receipt of the handbook","company policies"],"note_fr":"Ce n'est pas le règlement intérieur français, qui est obligatoire à partir d'un certain effectif et soumis à une procédure légale : traduisez celui-ci par « internal rules » ou « works rules ». Le « handbook » est le plus souvent non contractuel.","french_concept":false,"explain":null},{"id":"ct-033","level":1,"fr":"rédiger / établir un contrat","term":{"uk":"to draw up a contract","us":"to draw up a contract"},"ipa":{"uk":"/ˌdrɔː ʌp ə ˈkɒntrækt/","us":"/ˌdrɔː ʌp ə ˈkɑːntrækt/"},"def":"To prepare the written text of a contract.","registers":{"formal":{"uk":"to draft the contract","us":"to draft the contract","ex":"The contract shall be [[drafted]] in French, with an English translation provided for information only."},"everyday":{"uk":"to draw up","us":"to draw up","ex":"Can you [[draw up]] the contract today so she can sign before the weekend?"},"informal":null},"collocations":["to draw up a contract","a first draft","to redraft a clause","to tidy up the wording"],"note_fr":"« To redact » est un faux ami : il signifie « caviarder, occulter » un passage. « Rédiger » se dit « to draft », « to draw up » ou simplement « to write ». « To establish a contract » est un calque à éviter.","french_concept":false,"explain":null},{"id":"ct-034","level":1,"fr":"les parties au contrat","term":{"uk":"the parties to the contract","us":"the parties to the contract"},"ipa":{"uk":"/ðə ˌpɑːtiz tə ðə ˈkɒntrækt/","us":"/ðə ˌpɑːrtiz tə ðə ˈkɑːntrækt/"},"def":"The persons or organisations that sign a contract and are bound by it.","registers":{"formal":{"uk":"the parties","us":"the parties","ex":"This agreement is made between [[the parties]] named below."},"everyday":{"uk":"both sides","us":"both sides","ex":"[[Both sides]] need to sign before she can start."},"informal":null},"collocations":["a party to the contract","the other party","a third party","between the parties"],"note_fr":"On est « a party to a contract » (préposition « to », jamais « of »). Devant un nom défini, les contrats anglais mettent une majuscule : « the Employer », « the Employee », « the Parties ».","french_concept":false,"explain":null},{"id":"ct-035","level":1,"fr":"intitulé de poste","term":{"uk":"job title","us":"job title"},"ipa":{"uk":"/ˈdʒɒb ˌtaɪt(ə)l/","us":"/ˈdʒɑːb ˌtaɪt(ə)l/"},"def":"The official name of the position a person holds in an organisation.","registers":{"formal":{"uk":"to be employed as","us":"to be employed as","ex":"The Employee shall [[be employed as]] Senior Payroll Officer."},"everyday":{"uk":"job title","us":"job title","ex":"Her [[job title]] is HR Business Partner, but she does a lot of employee relations work."},"informal":null},"collocations":["to hold the position of","a change of job title","an inflated job title","what's your title?"],"note_fr":"Ne traduisez pas « poste » par « post » dans tous les cas : « position », « role » et « job » sont plus naturels (« post » est surtout britannique et administratif). « Cadre » n'a pas d'équivalent : dites « manager » ou « professional » selon le cas.","french_concept":false,"explain":null},{"id":"ct-036","level":1,"fr":"fonctions / attributions","term":{"uk":"duties","us":"duties"},"ipa":{"uk":"/ˈdjuːtiz/","us":"/ˈduːtiz/"},"def":"The tasks and responsibilities that an employee is required to carry out in a job.","registers":{"formal":{"uk":"duties","us":"duties","ex":"The Employee shall perform such [[duties]] as the Company may reasonably assign from time to time."},"everyday":{"uk":"what the job involves","us":"what the job involves","ex":"Let me run you through [[what the job involves]] before we talk about salary."},"informal":null},"collocations":["to carry out one's duties","to perform one's duties","a job description","duties and responsibilities"],"note_fr":"« Functions » ne désigne pas les fonctions d'une personne en anglais courant : préférez « duties », « responsibilities » ou « role ». La fiche de poste est « a job description » (« a JD » à l'oral).","french_concept":false,"explain":null},{"id":"ct-037","level":1,"fr":"être rattaché(e) à / relever de","term":{"uk":"to report to","us":"to report to"},"ipa":{"uk":"/rɪˈpɔːt tə/","us":"/rɪˈpɔːrt tə/"},"def":"To have someone as your direct manager in the organisation.","registers":{"formal":{"uk":"to report to","us":"to report to","ex":"The Employee shall [[report to]] the Head of Human Resources or such other person as the Company may designate."},"everyday":{"uk":"to answer to","us":"to answer to","ex":"On paper she reports to Paris, but day to day she [[answers to]] the site manager."},"informal":null},"collocations":["a reporting line","a direct report","a line manager","to report directly to"],"note_fr":"« To be attached to » est un calque. « A direct report » est le subordonné direct (N-1) ; le supérieur hiérarchique est « line manager » (UK) ou « supervisor », « manager » (US). « Hierarchy » et surtout « hierarchical superior » sonnent très français.","french_concept":false,"explain":null},{"id":"ct-038","level":1,"fr":"lieu de travail","term":{"uk":"place of work","us":"place of work"},"ipa":{"uk":"/ˌpleɪs əv ˈwɜːk/","us":"/ˌpleɪs əv ˈwɜːrk/"},"def":"The location where the employee normally carries out the job.","registers":{"formal":{"uk":"normal place of work","us":"principal place of work","ex":"The Employee's [[normal place of work]] shall be the Company's offices in Lyon.","ex_us":"The Employee's [[principal place of work]] shall be the Company's offices in Lyon."},"everyday":{"uk":"to be based in","us":"to be based in","ex":"She [[is based in]] Lyon but spends two days a week at the Paris office."},"informal":null},"collocations":["to work from home","to be office-based","to work remotely","a hybrid working arrangement"],"note_fr":"Dites « to be based in/at », pas « to be located » pour une personne. Le télétravail se dit « remote work », « working from home » (« WFH ») ; « telework » existe surtout dans les textes officiels, et « home office » désigne la pièce, pas la pratique.","french_concept":false,"explain":null},{"id":"ct-039","level":1,"fr":"durée / horaires de travail","term":{"uk":"working hours","us":"working hours"},"ipa":{"uk":"/ˈwɜːkɪŋ ˌaʊəz/","us":"/ˈwɜːrkɪŋ ˌaʊərz/"},"def":"The number of hours, and the times of day, that an employee is required to work.","registers":{"formal":{"uk":"normal hours of work","us":"normal hours of work","ex":"The Employee's [[normal hours of work]] are thirty-five hours per week, Monday to Friday."},"everyday":{"uk":"hours","us":"hours","ex":"The [[hours]] are nine to five-thirty, with some flexibility if you need it."},"informal":null},"collocations":["to work long hours","contracted hours","core hours","to put in the hours"],"note_fr":"« Horaire » ne se traduit pas par « hourly » (qui veut dire « à l'heure ») ni par « schedule » dans tous les cas : « working hours » couvre la durée et les horaires. « Timetable » est scolaire ou ferroviaire. Les « 35 heures » : « the 35-hour week ».","french_concept":false,"explain":null},{"id":"ct-040","level":1,"fr":"rémunération","term":{"uk":"remuneration","us":"compensation"},"ipa":{"uk":"/rɪˌmjuːnəˈreɪʃ(ə)n/","us":"/ˌkɑːmpenˈseɪʃ(ə)n/"},"def":"Everything an employee receives in return for work, including salary, bonuses and other payments.","registers":{"formal":{"uk":"remuneration","us":"compensation","ex":"In consideration of her services, the Employee shall receive a gross annual [[remuneration]] of the amount stated in Schedule 1.","ex_us":"In consideration of her services, the Employee shall receive gross annual [[compensation]] in the amount stated in Schedule 1."},"everyday":{"uk":"pay","us":"pay","ex":"The [[pay]] isn't great, but the pension contributions are generous."},"informal":{"uk":"pay packet","us":"paycheck","ex":"With the bonus on top, it adds up to a pretty decent [[pay packet]].","ex_us":"With the bonus on top, it adds up to a pretty decent [[paycheck]]."}},"collocations":["a remuneration package","basic salary","gross pay","take-home pay"],"note_fr":"Orthographe : « remuneration », pas « renumeration » (erreur fréquente, même chez les natifs). Aux États-Unis, « compensation » signifie rémunération ; au Royaume-Uni, il évoque plutôt une indemnisation (dommages-intérêts). Brut / net : « gross » / « net » ou « take-home pay ».","french_concept":false,"explain":null},{"id":"ct-041","level":1,"fr":"avantages (sociaux, en nature)","term":{"uk":"benefits","us":"benefits"},"ipa":{"uk":"/ˈbenɪfɪts/","us":"/ˈbenəfɪts/"},"def":"Things an employee receives from the employer in addition to salary, such as health cover, a pension or a company car.","registers":{"formal":{"uk":"benefits","us":"benefits","ex":"The Employee shall be entitled to participate in the Company's [[benefits]] schemes, subject to their rules as amended from time to time.","ex_us":"The Employee shall be eligible to participate in the Company's [[benefits]] plans, subject to their terms as amended from time to time."},"everyday":{"uk":"benefits package","us":"benefits package","ex":"The salary's about average, but the [[benefits package]] is hard to beat."},"informal":{"uk":"perks","us":"perks","ex":"Free parking and a gym membership are nice [[perks]], but they won't keep people for long."}},"collocations":["a benefit in kind","fringe benefits","a company car","to be eligible for benefits"],"note_fr":"« Advantages » ne s'emploie pas dans ce sens. Attention aussi : au Royaume-Uni, « to be on benefits » signifie toucher des allocations de l'État. Avantage en nature : « benefit in kind » (UK), « fringe benefit » (US). Mutuelle : « health cover » (UK), « health insurance » (US).","french_concept":false,"explain":null},{"id":"ct-042","level":1,"fr":"congés payés","term":{"uk":"annual leave","us":"paid time off"},"ipa":{"uk":"/ˌænjuəl ˈliːv/","us":"/ˌpeɪd taɪm ˈɔːf/"},"def":"The paid days off work that an employee is entitled to each year.","registers":{"formal":{"uk":"paid annual leave","us":"paid vacation","ex":"The Employee is entitled to five weeks' [[paid annual leave]] in each holiday year.","ex_us":"The Employee is entitled to five weeks of [[paid vacation]] in each calendar year."},"everyday":{"uk":"holiday","us":"vacation","ex":"How much [[holiday]] have you got left this year?","ex_us":"How much [[vacation]] do you have left this year?"},"informal":null},"collocations":["to take annual leave","to book a day off","to carry over leave","holiday entitlement"],"note_fr":"UK « holiday », US « vacation » ; « holidays » aux États-Unis désigne les jours fériés (UK « bank holidays » ou « public holidays »). « Congé » en général se dit « leave » : « sick leave », « parental leave ». « PTO » (US) regroupe souvent congés et jours de maladie. Il n'existe pas de congés payés légaux au niveau fédéral américain.","french_concept":false,"explain":null},{"id":"ct-043","level":2,"fr":"conditions d'emploi / clauses et conditions du contrat","term":{"uk":"terms and conditions of employment","us":"terms and conditions of employment"},"ipa":{"uk":"/ˌtɜːmz ən kənˌdɪʃ(ə)nz əv ɪmˈplɔɪmənt/","us":"/ˌtɜːrmz ən kənˌdɪʃ(ə)nz əv ɪmˈplɔɪmənt/"},"def":"All the rights and obligations that apply to a job, such as pay, hours, holiday and notice.","registers":{"formal":{"uk":"terms and conditions of employment","us":"terms and conditions of employment","ex":"Your [[terms and conditions of employment]] are set out in this letter and in the attached schedule."},"everyday":{"uk":"terms","us":"terms","ex":"The [[terms]] are pretty standard - nothing you'd need a lawyer for."},"informal":null},"collocations":["under the terms of the contract","to agree terms","on the same terms","express and implied terms"],"note_fr":"« Terms » = les stipulations du contrat ; « term » au singulier = la durée (« the term of the contract ») : ne les confondez pas. « T&Cs » est l'abréviation courante. « Conditions » seul évoque plutôt les conditions matérielles de travail.","french_concept":false,"explain":null},{"id":"ct-044","level":1,"fr":"période d'essai","term":{"uk":"probationary period","us":"probationary period"},"ipa":{"uk":"/prəˈbeɪʃ(ə)n(ə)ri ˌpɪəriəd/","us":"/proʊˈbeɪʃəneri ˌpɪriəd/"},"def":"An initial period during which the employer assesses the new employee and either party can end the contract more easily.","registers":{"formal":{"uk":"probationary period","us":"probationary period","ex":"The first four months of employment shall constitute a [[probationary period]], during which either party may terminate the contract on short notice."},"everyday":{"uk":"on probation","us":"on probation","ex":"He's still [[on probation]], so let's give him feedback now rather than wait."},"informal":null},"collocations":["to serve a probationary period","to be on probation","a three-month probation","during probation"],"note_fr":"« Trial period » se comprend mais « probation » est le terme usuel ; « essay » et « test period » sont à proscrire. En France, la période d'essai doit être prévue expressément par le contrat et sa durée maximale dépend de la catégorie du salarié ; au Royaume-Uni et aux États-Unis, elle relève surtout de la pratique de l'entreprise.","french_concept":true,"explain":{"written":"The période d'essai is a probationary period which must be expressly stipulated in the contract, whose maximum length is set by law according to the employee's category, and during which either party may end the contract without giving reasons, subject to a short notice.","spoken":"It's the French probation period: it has to be written into the contract, the law caps how long it can last, and either side can end things quickly while it's running."}},{"id":"ct-045","level":2,"fr":"renouveler la période d'essai","term":{"uk":"to extend the probationary period","us":"to extend the probationary period"},"ipa":{"uk":"/ɪkˌstend ðə prəˈbeɪʃ(ə)n(ə)ri ˌpɪəriəd/","us":"/ɪkˌstend ðə proʊˈbeɪʃəneri ˌpɪriəd/"},"def":"To lengthen the initial assessment period because more time is needed to evaluate the employee.","registers":{"formal":{"uk":"to extend the probationary period","us":"to extend the probationary period","ex":"The Company may [[extend the probationary period]] once, with the Employee's express written agreement."},"everyday":{"uk":"to extend someone's probation","us":"to extend someone's probation","ex":"We'd rather [[extend his probation]] by a couple of months than let him go now."},"informal":null},"collocations":["an extension of probation","to extend probation by three months","to agree to an extension"],"note_fr":"En anglais on « extends » une période d'essai ; « to renew probation » surprendrait un natif. Précisez la règle française à vos interlocuteurs, qui pensent qu'une simple décision de l'employeur suffit.","french_concept":true,"explain":{"written":"Under French law the probationary period may be renewed once only, provided that the applicable industry-wide agreement allows it, the contract provides for it and the employee expressly agrees.","spoken":"In France you can only extend probation once, and only if the industry agreement and the contract allow it - and the employee has to agree in writing."}},{"id":"ct-046","level
