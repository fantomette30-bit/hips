 employees accrue paid leave from their first day, whilst US employees have no statutory right to paid leave.","UK employees accrue paid leave from their first day; by contrast, US employees have no statutory right to paid leave.","UK employees accrue paid leave from their first day. By contrast, US employees have no statutory right to paid leave.","UK employees accrue paid leave from their first day; however, US employees have no statutory right to paid leave."],"explain_fr":"'Whereas' / 'while' (UK aussi 'whilst') dans une seule phrase, ou 'by contrast' après un point ou un point-virgule."},{"type":"join","prompt":"The salary is lower. The benefits are much better. (spoken)","answer":"The salary is lower, but the benefits are much better.","accept":["The salary is lower. The benefits are much better, though.","The salary is lower, though the benefits are much better.","The salary is lower. On the other hand, the benefits are much better.","The salary is lower; however, the benefits are much better.","The salary is lower. However, the benefits are much better.","The salary is lower but the benefits are much better."],"explain_fr":"À l'oral, 'but' ou 'though' en fin de phrase suffisent ; inutile de sortir 'however'."}]},{"id":"cn-concede","function":"Conceding","function_fr":"Concéder","items":[{"text":"nevertheless","register":"formal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; après un point ou un point-virgule","ex":"The delay was short. [[Nevertheless]], it amounted to a breach of the procedure."},{"text":"nonetheless","register":"formal","variety":"both","position":"any","punct_fr":"en tête avec virgule, ou en fin de phrase","ex":"The evidence is thin; the allegation must [[nonetheless]] be investigated."},{"text":"notwithstanding","register":"formal","variety":"both","position":"start","punct_fr":"+ nom, sans virgule entre les deux ; langue des contrats","ex":"[[Notwithstanding]] clause 4, the Company may vary the place of work."},{"text":"albeit","register":"formal","variety":"both","position":"mid","punct_fr":"+ adjectif, adverbe ou groupe nominal, jamais une proposition complète","ex":"The parties reached an agreement, [[albeit]] a fragile one."},{"text":"although","register":"everyday","variety":"both","position":"start","punct_fr":"+ proposition ; virgule à la fin de la subordonnée placée en tête","ex":"[[Although]] he apologised, the warning stays on his file."},{"text":"even so","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; reprend la phrase précédente","ex":"She has only been here a month. [[Even so]], she is entitled to a week's notice."},{"text":"despite","register":"everyday","variety":"both","position":"start","punct_fr":"+ nom ou -ing ; jamais 'despite of'","ex":"[[Despite]] several reminders, the form was never returned."},{"text":"that said","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; idéal en réunion comme à l'écrit courant","ex":"[[That said]], I think we should still take legal advice."},{"text":"still","register":"informal","variety":"both","position":"start","punct_fr":"en tête, suivi d'une virgule ; oral","ex":"[[Still]], it's better than nothing."},{"text":"all the same","register":"informal","variety":"both","position":"any","punct_fr":"en tête avec virgule ou en fin de phrase","ex":"I know he's busy. I'd like a quick word with him [[all the same]]."}],"pitfalls_fr":["Pas de double marquage : 'Although he apologised, but...' est fautif. Choisissez 'although' OU 'but'.","'Despite' se construit directement ('despite the delay', 'despite being late'). 'Despite of' n'existe pas ; 'in spite of' prend 'of'.","'Even if' = hypothèse ('même si, à supposer que') ; 'even though' = fait réel ('bien que'). 'Even though she was warned' : elle a bien été avertie."],"exercises":[{"type":"mcq","prompt":"(formal letter) You apologised promptly. ___, the misconduct was serious enough to justify a final written warning.","options":["Still","Nevertheless","Despite","Although"],"answer":1,"explain_fr":"'Nevertheless' : registre soutenu, en tête de phrase. 'Still' est oral ; 'despite' veut un nom ; 'although' une subordonnée."},{"type":"mcq","prompt":"(written) ___ repeated reminders, he failed to return the equipment.","options":["Although","Even so","Despite","Nevertheless"],"answer":2,"explain_fr":"Devant un groupe nominal, seul 'despite' convient."},{"type":"mcq","prompt":"(in a meeting) I know it's expensive. ___, I think we should get proper legal advice.","options":["Notwithstanding","Albeit","Despite","Still"],"answer":3,"explain_fr":"À l'oral : 'still'. 'Notwithstanding' et 'albeit' appartiennent à l'écrit juridique."},{"type":"mcq","prompt":"(contract clause) ___ clause 4, the Company may require the Employee to work at other sites.","options":["Notwithstanding","Although","Even so","All the same"],"answer":0,"explain_fr":"'Notwithstanding' + nom : 'nonobstant'. C'est le connecteur de dérogation des contrats."},{"type":"join","prompt":"She had only been there two months. She was entitled to notice. (everyday)","answer":"Although she had only been there two months, she was entitled to notice.","accept":["Even though she had only been there two months, she was entitled to notice.","She was entitled to notice although she had only been there two months.","She was entitled to notice even though she had only been there two months.","She had only been there two months. Even so, she was entitled to notice.","She had only been there two months; nevertheless, she was entitled to notice.","She had only been there two months, but she was still entitled to notice."],"explain_fr":"'Although' / 'even though' + proposition, ou 'even so' après un point. Jamais 'although... but'."},{"type":"join","prompt":"The procedure was followed. It was followed slowly. (formal - use 'albeit')","answer":"The procedure was followed, albeit slowly.","accept":["The procedure was followed, albeit slowly","The procedure was followed, albeit rather slowly."],"explain_fr":"'Albeit' + adverbe ou adjectif : concession très concise, réservée à l'écrit."}]},{"id":"cn-nuance","function":"Nuancing","function_fr":"Nuancer","items":[{"text":"to some extent","register":"formal","variety":"both","position":"any","punct_fr":"en tête avec virgule, ou en fin de proposition","ex":"[[To some extent]], the dispute could have been avoided."},{"text":"arguably","register":"formal","variety":"both","position":"mid","punct_fr":"souvent entre virgules ; 'on peut soutenir que'","ex":"The restriction is, [[arguably]], wider than the business needs."},{"text":"strictly speaking","register":"formal","variety":"both","position":"start","punct_fr":"suivi d'une virgule","ex":"[[Strictly speaking]], a freelancer is not covered by the staff handbook."},{"text":"in practice","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; s'oppose à 'in principle' / 'in theory'","ex":"[[In practice]], nobody takes the full lunch break."},{"text":"on the whole","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; 'dans l'ensemble'","ex":"[[On the whole]], the consultation went smoothly."},{"text":"up to a point","register":"everyday","variety":"both","position":"end","punct_fr":"souvent après 'I agree' ; sous-entend un désaccord poli","ex":"I agree with you [[up to a point]]."},{"text":"as a rule","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; 'en règle générale'","ex":"[[As a rule]], we don't give references over the phone."},{"text":"more or less","register":"informal","variety":"both","position":"mid","punct_fr":"avant l'adjectif ou le participe, ou seul en réponse","ex":"The handbook is [[more or less]] ready."},{"text":"pretty much","register":"informal","variety":"both","position":"mid","punct_fr":"avant le verbe ou l'adjectif ; familier","ex":"We've [[pretty much]] agreed on the figures."},{"text":"kind of","register":"informal","variety":"both","position":"mid","punct_fr":"avant l'adjectif ou le verbe ; UK aussi 'sort of' ; jamais à l'écrit","ex":"It's [[kind of]] awkward to raise it now."}],"pitfalls_fr":["'In fact' et 'indeed' ne sont pas des tics de liaison. 'In fact' corrige ou renforce ('en réalité') ; 'indeed' confirme ou insiste. Pour 'en effet' explicatif, on ne met souvent rien, ou 'because'.","'Normally' au sens de 'normalement, il devrait...' se dit plutôt 'in principle' ou 'should' : 'She should be back on Monday'.","'Globally' signifie 'dans le monde entier'. Pour 'globalement', dites 'on the whole', 'overall' ou 'broadly'."],"exercises":[{"type":"mcq","prompt":"(written advice) The restriction is, ___, wider than is necessary to protect the business.","options":["pretty much","arguably","kind of","globally"],"answer":1,"explain_fr":"'Arguably' : nuance d'expert à l'écrit. 'Globally' = 'mondialement' ; les deux autres sont familiers."},{"type":"mcq","prompt":"(in a meeting) ___, yes, she can work from home, but in practice her manager wants her in on Mondays.","options":["In principle","In fact","Indeed","Normally speaking"],"answer":0,"explain_fr":"'In principle... but in practice' : le couple naturel. 'Normally speaking' n'existe pas."},{"type":"mcq","prompt":"(chatting with a colleague) The handbook is ___ finished - I just need to check the leave section.","options":["to some extent","arguably","strictly speaking","pretty much"],"answer":3,"explain_fr":"'Pretty much' = 'quasiment', registre familier."},{"type":"mcq","prompt":"(formal email) ___, a consultant is not an employee, although the two are often treated alike day to day.","options":["Kind of","More or less","Strictly speaking","Up to a point"],"answer":2,"explain_fr":"'Strictly speaking' : 'à strictement parler', pour rappeler la règle avant de nuancer."},{"type":"join","prompt":"The new policy has worked. Absence is still high in one team. (use 'on the whole')","answer":"On the whole, the new policy has worked, although absence is still high in one team.","accept":["On the whole, the new policy has worked, but absence is still high in one team.","On the whole the new policy has worked, although absence is still high in one team.","The new policy has worked on the whole, although absence is still high in one team.","The new policy has worked on the whole, but absence is still high in one team.","On the whole, the new policy has worked, though absence is still high in one team."],"explain_fr":"'On the whole' annonce un bilan globalement positif avant la réserve."},{"type":"join","prompt":"I agree with you. I don't think we should dismiss him. (use 'up to a point')","answer":"I agree with you up to a point, but I don't think we should dismiss him.","accept":["I agree with you up to a point but I don't think we should dismiss him.","Up to a point I agree with you, but I don't think we should dismiss him.","I agree with you up to a point. I don't think we should dismiss him, though."],"explain_fr":"'I agree up to a point' : formule de désaccord poli, très utilisée en réunion."}]},{"id":"cn-cause","function":"Giving a cause","function_fr":"Exprimer la cause","items":[{"text":"owing to","register":"formal","variety":"both","position":"start","punct_fr":"+ nom ; virgule après le groupe placé en tête","ex":"[[Owing to]] a restructuring, the role will move to Dublin."},{"text":"on account of","register":"formal","variety":"both","position":"mid","punct_fr":"+ nom ; écrit soutenu","ex":"He was excused from night shifts [[on account of]] his health."},{"text":"in view of","register":"formal","variety":"both","position":"start","punct_fr":"+ nom ; 'compte tenu de'","ex":"[[In view of]] her length of service, a longer notice period is appropriate."},{"text":"given that","register":"formal","variety":"both","position":"start","punct_fr":"+ proposition ; 'given' + nom","ex":"[[Given that]] the deadline has passed, the appeal cannot be heard."},{"text":"because","register":"everyday","variety":"both","position":"mid","punct_fr":"+ proposition ; pas de virgule avant en général","ex":"We can't sign today [[because]] the client hasn't approved the figures."},{"text":"because of","register":"everyday","variety":"both","position":"mid","punct_fr":"+ nom","ex":"The hearing was postponed [[because of]] the rail strike."},{"text":"since","register":"everyday","variety":"both","position":"start","punct_fr":"+ proposition ; cause déjà connue de l'interlocuteur","ex":"[[Since]] you were not informed, we will extend the deadline."},{"text":"due to","register":"everyday","variety":"both","position":"mid","punct_fr":"+ nom ; très courant dans les avis et les e-mails","ex":"The office is closed today [[due to]] maintenance work."},{"text":"seeing as","register":"informal","variety":"both","position":"start","punct_fr":"+ proposition ; oral, plus fréquent au Royaume-Uni","ex":"[[Seeing as]] you're here, could you look at this letter?"},{"text":"what with","register":"informal","variety":"both","position":"start","punct_fr":"+ nom(s) ; énumère des causes, oral","ex":"[[What with]] the audit and the pay review, we haven't had a minute."}],"pitfalls_fr":["'Because' + proposition, 'because of' + nom. 'Because of he was late' est fautif.","'Due to the fact that' est un tic administratif : dites 'because'. De même, 'thanks to' ne s'emploie que pour une cause favorable.","'As' causal est ambigu (cause ou temps) ; préférez 'because' ou 'since' quand la cause est l'information importante."],"exercises":[{"type":"mcq","prompt":"(formal letter) The hearing has been postponed ___ the unavailability of your representative.","options":["because","owing to","seeing as","since"],"answer":1,"explain_fr":"Devant un nom, registre soutenu : 'owing to'. 'Because', 'since' et 'seeing as' exigent une proposition."},{"type":"mcq","prompt":"(in a meeting) We can't sign today ___ the client hasn't approved the figures.","options":["because of","due to","owing to","because"],"answer":3,"explain_fr":"Devant une proposition (sujet + verbe), seul 'because' convient."},{"type":"mcq","prompt":"(chatting) ___ you're already here, could you have a quick look at this letter?","options":["Owing to","On account of","Seeing as","Due to"],"answer":2,"explain_fr":"'Seeing as' + proposition : 'vu que', familier."},{"type":"mcq","prompt":"(written advice) ___ the employee's length of service, a longer notice period would be appropriate.","options":["In view of","Given that","Because","Seeing as"],"answer":0,"explain_fr":"'In view of' + nom : 'compte tenu de'. 'Given that' serait suivi d'une proposition."},{"type":"join","prompt":"The meeting was cancelled. There was a rail strike. (everyday)","answer":"The meeting was cancelled because of a rail strike.","accept":["The meeting was cancelled because there was a rail strike.","The meeting was cancelled due to a rail strike.","The meeting was cancelled owing to a rail strike.","The meeting was cancelled as there was a rail strike.","The meeting was cancelled since there was a rail strike.","The meeting was canceled because of a rail strike.","The meeting was cancelled because of the rail strike."],"explain_fr":"'Because of' + nom est la solution la plus légère."},{"type":"join","prompt":"He has a long disciplinary record. A final warning is justified. (formal, written)","answer":"Given his long disciplinary record, a final warning is justified.","accept":["In view of his long disciplinary record, a final warning is justified.","Given that he has a long disciplinary record, a final warning is justified.","A final warning is justified given his long disciplinary record.","A final warning is justified in view of his long disciplinary record.","Since he has a long disciplinary record, a final warning is justified."],"explain_fr":"'Given' / 'in view of' + nom condensent la cause en tête de phrase."}]},{"id":"cn-consequence","function":"Giving a consequence","function_fr":"Exprimer la conséquence","items":[{"text":"therefore","register":"formal","variety":"both","position":"any","punct_fr":"en tête avec virgule, ou entre le sujet et le verbe sans virgule","ex":"The notice was sent to the wrong address and was [[therefore]] invalid."},{"text":"accordingly","register":"formal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; fréquent dans les lettres et décisions","ex":"[[Accordingly]], your appeal has been dismissed."},{"text":"hence","register":"formal","variety":"both","position":"mid","punct_fr":"+ nom, sans verbe ; écrit uniquement","ex":"The role has disappeared; [[hence]] the need for a consultation."},{"text":"consequently","register":"formal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; lourd à l'oral","ex":"[[Consequently]], the bonus will not be paid this year."},{"text":"as a result","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; 'as a result of' + nom","ex":"[[As a result]], two members of the team have resigned."},{"text":"which means","register":"everyday","variety":"both","position":"mid","punct_fr":"précédé d'une virgule ; reprend toute la proposition","ex":"She's on leave until the 15th, [[which means]] we can't meet before then."},{"text":"for that reason","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule","ex":"[[For that reason]], we recommend putting the change in writing."},{"text":"so","register":"informal","variety":"both","position":"mid","punct_fr":"virgule avant 'so' ; en tête de phrase à l'oral seulement","ex":"He didn't reply, [[so]] I called him."},{"text":"that's why","register":"informal","variety":"both","position":"start","punct_fr":"+ proposition ; oral et e-mails courants","ex":"[[That's why]] we need her signature before Friday."}],"pitfalls_fr":["'Thus' ne traduit pas le 'ainsi' de liaison français : il est rare et très soutenu. À l'écrit préférez 'therefore', à l'oral 'so'.","'Hence' se construit avec un nom ('hence the delay'), pas avec une proposition complète dans l'usage courant.","Commencer une phrase par 'So,' est normal en réunion mais déplacé dans un avis écrit ; 'consequently' ou 'accordingly' prononcés en réunion font l'effet inverse."],"exercises":[{"type":"mcq","prompt":"(formal letter) You failed to attend two hearings without explanation. ___, the decision was taken in your absence.","options":["So that","Accordingly","That's why","Which means"],"answer":1,"explain_fr":"'Accordingly' : 'en conséquence', ton d'une lettre officielle. 'So that' exprime le but."},{"type":"mcq","prompt":"(in a meeting) She's on leave until the 15th, ___ we can't hold the interview before then.","options":["hence","thus","so","consequently"],"answer":2,"explain_fr":"À l'oral, après une virgule : 'so'. Les autres sont des adverbes écrits et ne relient pas deux propositions après une virgule."},{"type":"mcq","prompt":"(written) The role no longer exists; ___ the need for a redundancy consultation.","options":["hence","so","therefore","as a result"],"answer":0,"explain_fr":"'Hence' + groupe nominal, sans verbe : 'd'où'."},{"type":"mcq","prompt":"(chatting) Nobody told him about the deadline. ___ he's annoyed.","options":["Accordingly,","Hence","Thus","That's why"],"answer":3,"explain_fr":"'That's why' + proposition : 'c'est pour ça que'."},{"type":"join","prompt":"The notice was sent to the wrong address. It was not validly served. (formal, written)","answer":"The notice was sent to the wrong address and was therefore not validly served.","accept":["The notice was sent to the wrong address; therefore, it was not validly served.","The notice was sent to the wrong address. Therefore, it was not validly served.","The notice was sent to the wrong address; consequently, it was not validly served.","The notice was sent to the wrong address. Consequently, it was not validly served.","The notice was sent to the wrong address. As a result, it was not validly served.","The notice was sent to the wrong address; accordingly, it was not validly served.","The notice was sent to the wrong address and therefore was not validly served."],"explain_fr":"'And was therefore...' : 'therefore' au milieu, sans virgules, est la tournure la plus élégante."},{"type":"join","prompt":"The budget was cut. We had to freeze recruitment. (spoken)","answer":"The budget was cut, so we had to freeze recruitment.","accept":["The budget was cut. That's why we had to freeze recruitment.","The budget was cut, which is why we had to freeze recruitment.","The budget was cut, which meant we had to freeze recruitment.","The budget was cut. As a result, we had to freeze recruitment.","The budget was cut so we had to freeze recruitment."],"explain_fr":"À l'oral : 'so' ou 'that's why'."}]},{"id":"cn-purpose","function":"Expressing purpose","function_fr":"Exprimer le but","items":[{"text":"in order to","register":"formal","variety":"both","position":"mid","punct_fr":"+ base verbale ; négatif : 'in order not to'","ex":"The policy was amended [[in order to]] reflect the new legislation."},{"text":"so as to","register":"formal","variety":"both","position":"mid","punct_fr":"+ base verbale ; surtout au négatif : 'so as not to'","ex":"The rota was redrawn [[so as to]] give every team one free weekend in two."},{"text":"with a view to","register":"formal","variety":"both","position":"mid","punct_fr":"+ -ing (ici 'to' est une préposition)","ex":"We are consulting staff [[with a view to]] introducing flexible hours."},{"text":"for the purposes of","register":"formal","variety":"both","position":"start","punct_fr":"+ nom ; formule de définition dans les contrats","ex":"[[For the purposes of]] this clause, 'Group' includes all subsidiaries."},{"text":"to","register":"everyday","variety":"both","position":"mid","punct_fr":"+ base verbale ; la solution par défaut","ex":"I'm writing [[to]] confirm the arrangements for your first day."},{"text":"so that","register":"everyday","variety":"both","position":"mid","punct_fr":"+ sujet + can / will / could ; pas de virgule avant","ex":"I'll send the draft tonight [[so that]] you can read it before the call."},{"text":"the aim is to","register":"everyday","variety":"both","position":"start","punct_fr":"+ base verbale ; présente un objectif","ex":"[[The aim is to]] reduce turnover by the end of the year."},{"text":"so","register":"informal","variety":"both","position":"mid","punct_fr":"'so that' sans 'that' ; oral","ex":"Send it to me today [[so]] I can check it before the meeting."},{"text":"the idea is to","register":"informal","variety":"both","position":"start","punct_fr":"+ base verbale ; oral, présente un projet sans solennité","ex":"[[The idea is to]] get everybody in the same room for once."}],"pitfalls_fr":["Jamais 'for' + infinitif : 'I'm writing for to confirm' et 'for confirm' sont fautifs. Le but d'une action se dit 'to' + verbe. ('For' + -ing décrit l'usage d'un objet : 'a form for claiming expenses'.)","'In order to' alourdit la phrase quand 'to' suffit. Gardez-le pour lever une ambiguïté ou dans un texte formel.","Au négatif : 'so as not to' / 'in order not to', et non 'to not' ou 'for not'. 'With a view to' est suivi de -ing."],"exercises":[{"type":"mcq","prompt":"(written) The company has introduced exit interviews ___ identifying the causes of staff turnover.","options":["in order to","so that","with a view to","so as to"],"answer":2,"explain_fr":"Devant un -ing, seul 'with a view to' est possible : 'to' y est une préposition."},{"type":"mcq","prompt":"(in a meeting) I'll send you the draft tonight ___ you can read it before the call.","options":["so that","in order to","for","with a view to"],"answer":0,"explain_fr":"Sujet différent + 'can' : 'so that'."},{"type":"mcq","prompt":"(email) I'm writing ___ confirm the arrangements for your first day.","options":["for","for to","so that","to"],"answer":3,"explain_fr":"But = 'to' + base verbale. 'For to' est un calque de 'pour'."},{"type":"mcq","prompt":"(formal) The names have been removed ___ breach confidentiality.","options":["to not","so as not to","for not","in order not"],"answer":1,"explain_fr":"But négatif : 'so as not to' (ou 'in order not to', avec 'to')."},{"type":"join","prompt":"We are reviewing the pay structure. We want to close the gender pay gap. (everyday)","answer":"We are reviewing the pay structure to close the gender pay gap.","accept":["We are reviewing the pay structure in order to close the gender pay gap.","We are reviewing the pay structure so as to close the gender pay gap.","We are reviewing the pay structure with a view to closing the gender pay gap.","We are reviewing the pay structure so that we can close the gender pay gap.","We're reviewing the pay structure to close the gender pay gap."],"explain_fr":"Même sujet dans les deux phrases : 'to' + verbe suffit."},{"type":"join","prompt":"She recorded the meeting. Nobody could dispute what was said. (everyday)","answer":"She recorded the meeting so that nobody could dispute what was said.","accept":["She recorded the meeting so nobody could dispute what was said.","She recorded the meeting so that no one could dispute what was said.","She recorded the meeting so no one could dispute what was said."],"explain_fr":"Sujets différents : 'so that' + sujet + 'could' (au passé)."}]},{"id":"cn-condition","function":"Setting a condition","function_fr":"Poser une condition","items":[{"text":"provided that","register":"formal","variety":"both","position":"mid","punct_fr":"+ présent ; 'that' peut tomber ; pas de 'will'","ex":"Leave may be carried over [[provided that]] the line manager agrees in writing."},{"text":"in the event that","register":"formal","variety":"both","position":"start","punct_fr":"+ proposition ; 'in the event of' + nom","ex":"[[In the event that]] the parties fail to agree, the matter will go to mediation."},{"text":"should","register":"formal","variety":"both","position":"start","punct_fr":"inversion : 'should' + sujet + base verbale ; remplace 'if'","ex":"[[Should]] you need any adjustments for the interview, please let us know."},{"text":"subject to","register":"formal","variety":"both","position":"start","punct_fr":"+ nom ; 'sous réserve de'","ex":"[[Subject to]] satisfactory references, we would like to offer you the post."},{"text":"if","register":"everyday","variety":"both","position":"any","punct_fr":"virgule après la subordonnée placée en tête ; jamais 'will' après 'if'","ex":"[[If]] she accepts, we can start on the first of the month."},{"text":"unless","register":"everyday","variety":"both","position":"any","punct_fr":"= 'if... not' ; verbe à la forme affirmative","ex":"We'll go ahead on Thursday [[unless]] we hear otherwise."},{"text":"as long as","register":"everyday","variety":"both","position":"mid","punct_fr":"+ présent ; condition suffisante, ton courant","ex":"You can swap shifts [[as long as]] your manager knows."},{"text":"otherwise","register":"everyday","variety":"both","position":"start","punct_fr":"après un point ou un point-virgule, suivi d'une virgule ; 'sinon'","ex":"Please reply by Friday. [[Otherwise]], we will assume you are not interested."},{"text":"or else","register":"informal","variety":"both","position":"mid","punct_fr":"précédé d'une virgule ; oral ; peut sonner comme une menace","ex":"We need to answer today, [[or else]] we'll lose her to a competitor."},{"text":"supposing","register":"informal","variety":"both","position":"start","punct_fr":"+ proposition ; ouvre une hypothèse à l'oral","ex":"[[Supposing]] he says no, what do we do then?"}],"pitfalls_fr":["Pas de 'will' ni de 'would' après 'if', 'unless', 'provided that', 'as long as' : 'if he accepts', jamais 'if he will accept'.","'In case' ne veut pas dire 'si' : il exprime une précaution ('Take a copy in case they ask for it'). 'Au cas où vous seriez malade' = 'If you are ill'.","'Unless' contient déjà la négation : 'unless you don't object' dit le contraire de ce que vous voulez. Calque à éviter : 'at the condition that' (dites 'on condition that' ou 'provided that')."],"exercises":[{"type":"mcq","prompt":"(contract) The Employee may work remotely ___ the Line Manager has given prior written approval.","options":["unless","provided that","in case","or else"],"answer":1,"explain_fr":"'Provided that' : 'à condition que', registre contractuel."},{"type":"mcq","prompt":"(in a meeting) You can carry the days over ___ you take them before March.","options":["as long as","unless","in the event that","should"],"answer":0,"explain_fr":"'As long as' : la version courante de 'provided that'."},{"type":"mcq","prompt":"(policy) ___ the Employee be unable to attend, the hearing will be rescheduled once.","options":["If","Provided","Unless","Should"],"answer":3,"explain_fr":"La base verbale 'be' révèle l'inversion formelle : 'Should the Employee be unable...'."},{"type":"mcq","prompt":"(email) We'll go ahead on Thursday ___ we hear otherwise from the union.","options":["if","provided that","unless","as long as"],"answer":2,"explain_fr":"'Unless' = 'sauf si'. Avec 'otherwise', 'if' donnerait le sens inverse."},{"type":"join","prompt":"You don't give a month's notice. You will lose the bonus. (use 'unless')","answer":"Unless you give a month's notice, you will lose the bonus.","accept":["You will lose the bonus unless you give a month's notice.","Unless you give a month's notice, you'll lose the bonus.","You'll lose the bonus unless you give a month's notice."],"explain_fr":"'Unless' + verbe affirmatif au présent ; 'will' seulement dans la principale."},{"type":"join","prompt":"The parties fail to agree. The matter will be referred to mediation. (formal, written)","answer":"In the event that the parties fail to agree, the matter will be referred to mediation.","accept":["Should the parties fail to agree, the matter will be referred to mediation.","If the parties fail to agree, the matter will be referred to mediation.","The matter will be referred to mediation in the event that the parties fail to agree.","The matter will be referred to mediation if the parties fail to agree.","The matter will be referred to mediation should the parties fail to agree."],"explain_fr":"'In the event that' ou l'inversion 'Should the parties fail...' : deux marques de l'écrit juridique."}]},{"id":"cn-illustrate","function":"Giving an example","function_fr":"Illustrer","items":[{"text":"by way of example","register":"formal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; écrit","ex":"[[By way of example]], a manager may not ask a candidate about her family plans."},{"text":"notably","register":"formal","variety":"both","position":"mid","punct_fr":"précédé d'une virgule ; moins fréquent que 'notamment' en français","ex":"Several benefits are taxable, [[notably]] the company car."},{"text":"namely","register":"formal","variety":"both","position":"mid","punct_fr":"précédé d'une virgule ; introduit la liste complète, pas un exemple","ex":"Two documents are missing, [[namely]] the signed contract and the job description."},{"text":"in particular","register":"formal","variety":"both","position":"any","punct_fr":"en tête avec virgule, ou après une virgule","ex":"The audit raised several concerns, [[in particular]] the lack of written contracts."},{"text":"for example","register":"everyday","variety":"both","position":"any","punct_fr":"entre virgules ; en tête, suivi d'une virgule","ex":"You could, [[for example]], offer her a phased return to work."},{"text":"for instance","register":"everyday","variety":"both","position":"any","punct_fr":"même ponctuation que 'for example'","ex":"[[For instance]], we could move the weekly meeting to the afternoon."},{"text":"such as","register":"everyday","variety":"both","position":"mid","punct_fr":"+ nom(s) ; virgule avant si l'exemple est accessoire","ex":"Serious offences [[such as]] theft or fraud may lead to summary dismissal."},{"text":"especially","register":"everyday","variety":"both","position":"mid","punct_fr":"précédé d'une virgule ; jamais en tête de phrase comme connecteur","ex":"Morale is low, [[especially]] in the night-shift team."},{"text":"like","register":"informal","variety":"both","position":"mid","punct_fr":"+ nom ; à l'écrit soigné, préférer 'such as'","ex":"We should offer perks [[like]] gym membership or extra leave."},{"text":"say","register":"informal","variety":"both","position":"mid","punct_fr":"entre virgules ; propose un exemple chiffré ou une hypothèse","ex":"Could we meet next week - [[say]], Tuesday morning?"}],"pitfalls_fr":["'Comme' introduisant un exemple se dit 'such as' ou 'like', pas 'as' : 'benefits such as a company car'. Et 'like for example' est redondant.","'e.g.' = 'for example' ; 'i.e.' = 'that is' (c'est-à-dire). Ils ne sont pas interchangeables et ne se prononcent pas en réunion.","'Namely' annonce tous les éléments ('à savoir'), pas un échantillon. 'Notamment' se rend plus naturellement par 'in particular' ou 'including' que par 'notably'."],"exercises":[{"type":"mcq","prompt":"(formal policy) Gross misconduct includes serious offences, ___ theft, violence and fraud.","options":["like for example","as","such as","say"],"answer":2,"explain_fr":"'Such as' + noms. 'As' seul ne signifie pas 'comme par exemple' ; 'like for example' est redondant."},{"type":"mcq","prompt":"(in a meeting) We could offer something extra - ___, two more days' leave.","options":["namely","say","notably","by way of example"],"answer":1,"explain_fr":"'Say' : façon orale d'avancer un exemple ou un chiffre."},{"type":"mcq","prompt":"(written) Only one member of the panel dissented, ___ the HR Director.","options":["namely","for instance","like","such as"],"answer":0,"explain_fr":"On nomme précisément la personne : 'namely' ('à savoir'), pas un exemple parmi d'autres."},{"type":"mcq","prompt":"(written advice) Several benefits are taxable, ___ the company car.","options":["as","say","like for instance","in particular"],"answer":3,"explain_fr":"'In particular' : 'notamment'. 'Say' est oral ; 'as' ne convient pas."},{"type":"join","prompt":"Some costs can be reclaimed. Travel and accommodation can be reclaimed. (everyday)","answer":"Some costs, such as travel and accommodation, can be reclaimed.","accept":["Some costs can be reclaimed, such as travel and accommodation.","Some costs, for example travel and accommodation, can be reclaimed.","Some costs can be reclaimed, for example travel and accommodation.","Some costs, for instance travel and accommodation, can be reclaimed.","Some costs can be reclaimed, for instance travel and accommodation.","Some costs, like travel and accommodation, can be reclaimed."],"explain_fr":"'Such as' + exemples, entre virgules parce que l'information est accessoire."},{"type":"join","prompt":"Two documents are missing. They are the signed contract and the job description. (use 'namely')","answer":"Two documents are missing, namely the signed contract and the job description.","accept":["Two documents are missing: namely, the signed contract and the job description.","Two documents are missing, namely the signed contract and the job description"],"explain_fr":"'Namely' énumère la totalité de ce qui vient d'être annoncé."}]},{"id":"cn-rephrase","function":"Rephrasing","function_fr":"Reformuler","items":[{"text":"that is to say","register":"formal","variety":"both","position":"mid","punct_fr":"entre virgules ; écrit ; lourd à l'oral","ex":"The contract is open-ended, [[that is to say]], it has no fixed end date."},{"text":"to put it another way","register":"formal","variety":"both","position":"start","punct_fr":"suivi d'une virgule","ex":"[[To put it another way]], the burden of proof lies with the employer."},{"text":"i.e.","register":"formal","variety":"both","position":"mid","punct_fr":"écrit uniquement ; précédé d'une virgule ou entre parenthèses","ex":"Fixed-term employees, [[i.e.]] those whose contracts have an end date, are also covered."},{"text":"more precisely","register":"formal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; affine ce qui précède","ex":"He left in March or, [[more precisely]], on the last working day of March."},{"text":"in other words","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; valable à l'écrit comme à l'oral","ex":"[[In other words]], the clause cannot be enforced."},{"text":"put simply","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; annonce une version sans jargon","ex":"[[Put simply]], we are paying two people to do the same job."},{"text":"or rather","register":"everyday","variety":"both","position":"mid","punct_fr":"précédé d'une virgule ou d'un tiret ; on se corrige","ex":"We need to talk to her manager, [[or rather]] her former manager."},{"text":"what I mean is","register":"everyday","variety":"both","position":"start","punct_fr":"+ proposition ; pour clarifier en réunion","ex":"[[What I mean is]] we shouldn't promise anything in writing yet."},{"text":"basically","register":"informal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; résume sans détour ; à ne pas répéter à chaque phrase","ex":"[[Basically]], he wants more money and fewer hours."},{"text":"I mean","register":"informal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; reformulation spontanée","ex":"It's not ideal. [[I mean]], it works, but nobody likes it."}],"pitfalls_fr":["'C'est-à-dire' ne se traduit pas mécaniquement par 'that is to say' : à l'oral dites 'I mean', 'in other words' ou 'which means'.","'Concretely' est un calque de 'concrètement' : dites 'in practice', 'in practical terms' ou 'specifically'. De même, 'en clair' = 'put simply', pas 'clearly'.","'i.e.' reformule, 'e.g.' donne un exemple. Si la liste n'est pas complète, c'est 'e.g.'."],"exercises":[{"type":"mcq","prompt":"(in a meeting) The role is being 'restructured' - ___, it's being made redundant.","options":["i.e.","in other words","that is to say that","namely"],"answer":1,"explain_fr":"'In other words' passe aussi bien à l'oral qu'à l'écrit. 'i.e.' ne se dit pas ; 'that is to say that' est un calque."},{"type":"mcq","prompt":"(written) Employees on fixed-term contracts, ___ those whose contracts have a set end date, are also covered.","options":["e.g.","basically","i.e.","I mean"],"answer":2,"explain_fr":"On définit le terme, on ne donne pas un exemple : 'i.e.'."},{"type":"mcq","prompt":"(chatting) ___, he wants more money and fewer hours.","options":["Basically","That is to say","More precisely","I.e."],"answer":0,"explain_fr":"'Basically' : résumé direct, registre familier."},{"type":"mcq","prompt":"(in a meeting) We'll need to speak to her manager - ___, her former manager.","options":["i.e.","that is to say that","concretely","or rather"],"answer":3,"explain_fr":"'Or rather' : on se corrige ('ou plutôt')."},{"type":"join","prompt":"The clause is void. It has no legal effect. (use 'in other words')","answer":"The clause is void; in other words, it has no legal effect.","accept":["The clause is void. In other words, it has no legal effect.","The clause is void - in other words, it has no legal effect.","The clause is void, in other words it has no legal effect.","The clause is void: in other words, it has no legal effect."],"explain_fr":"'In other words' après un point ou un point-virgule, suivi d'une virgule."},{"type":"join","prompt":"He was not dismissed. He resigned before the hearing. (formal - use 'more precisely' or 'rather')","answer":"He was not dismissed; more precisely, he resigned before the hearing.","accept":["He was not dismissed. More precisely, he resigned before the hearing.","He was not dismissed; rather, he resigned before the hearing.","He was not dismissed. Rather, he resigned before the hearing.","He was not dismissed - rather, he resigned before the hearing."],"explain_fr":"'Rather' ou 'more precisely' rectifient une première formulation inexacte."}]},{"id":"cn-sequence","function":"Sequencing","function_fr":"Ordonner dans le temps","items":[{"text":"in the first instance","register":"formal","variety":"uk","position":"any","punct_fr":"en tête avec virgule ou en fin de phrase ; surtout britannique","ex":"Concerns should be raised with your line manager [[in the first instance]]."},{"text":"subsequently","register":"formal","variety":"both","position":"any","punct_fr":"en tête avec virgule, ou avant le verbe","ex":"She was suspended and [[subsequently]] dismissed."},{"text":"thereafter","register":"formal","variety":"both","position":"end","punct_fr":"souvent en fin de proposition ; langue des contrats","ex":"Salary is reviewed after six months and annually [[thereafter]]."},{"text":"prior to","register":"formal","variety":"both","position":"mid","punct_fr":"+ nom ou -ing ; 'before' suffit presque toujours","ex":"References will be taken up [[prior to]] any offer of employment."},{"text":"first","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; 'firstly' possible à l'écrit, jamais 'at first'","ex":"[[First]], we need to establish the facts."},{"text":"after that","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; 'after' seul n'est pas un adverbe","ex":"[[After that]], HR will write to confirm the outcome."},{"text":"once","register":"everyday","variety":"both","position":"start","punct_fr":"+ proposition au présent ou au present perfect ; pas de 'will'","ex":"[[Once]] the investigation is complete, you will be invited to a hearing."},{"text":"finally","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; dernier point d'une liste","ex":"[[Finally]], please remember to return your security pass."},{"text":"first off","register":"informal","variety":"us","position":"start","punct_fr":"suivi d'une virgule ; oral, d'origine américaine mais compris partout","ex":"[[First off]], thanks for coming at such short notice."},{"text":"to start with","register":"informal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; oral","ex":"[[To start with]], let's go through last month's figures."}],"pitfalls_fr":["'At first' = 'au début' (et la suite a changé). Pour énumérer, dites 'first' ou 'first of all'. 'In a first time' n'existe pas.","'Eventually' = 'finalement, au bout du compte', jamais 'éventuellement' (= 'possibly'). 'At last' exprime le soulagement ('enfin !'), pas le dernier point d'une liste ('finally', 'lastly').","'After' seul ne peut pas commencer une phrase comme adverbe : dites 'after that', 'afterwards' ou 'then'."],"exercises":[{"type":"mcq","prompt":"(formal procedure) The complaint is investigated by HR. ___, a written report is sent to both parties.","options":["After","Subsequently","At last","Eventually"],"answer":1,"explain_fr":"'Subsequently' : 'par la suite', écrit formel. 'After' seul est impossible ; 'eventually' = 'au bout du compte'."},{"type":"mcq","prompt":"(in a meeting) ___, thanks for coming at such short notice.","options":["At first","In a first time","First off","Firstly of all"],"answer":2,"explain_fr":"'First off' ouvre une réunion sur un ton détendu. 'At first' = 'au début'."},{"type":"mcq","prompt":"(written) ___ the investigation is complete, you will be invited to a hearing.","options":["Once","After that","Thereafter","Then"],"answer":0,"explain_fr":"'Once' + présent : 'une fois que'. Les autres sont des adverbes, pas des conjonctions."},{"type":"mcq","prompt":"(contract) The first review will take place after six months and annually ___.","options":["after","then","next","thereafter"],"answer":3,"explain_fr":"'Annually thereafter' : collocation contractuelle ('puis chaque année')."},{"type":"join","prompt":"You must inform your manager. Then you may book the leave. (use 'before' or 'prior to' + -ing)","answer":"You must inform your manager before booking the leave.","accept":["You must inform your manager prior to booking the leave.","You must inform your manager before you book the leave.","Before booking the leave, you must inform your manager.","Prior to booking the leave, you must inform your manager.","Before you book the leave, you must inform your manager."],"explain_fr":"'Before' / 'prior to' + -ing quand le sujet est le même."},{"type":"join","prompt":"She completed her probation. She was given a permanent contract. (use 'once')","answer":"Once she had completed her probation, she was given a permanent contract.","accept":["Once she completed her probation, she was given a permanent contract.","She was given a permanent contract once she had completed her probation.","She was given a permanent contract once she completed her probation."],"explain_fr":"'Once' + past perfect (ou prétérit) pour l'action achevée en premier."}]},{"id":"cn-transition","function":"Changing topic","function_fr":"Changer de sujet","items":[{"text":"with regard to","register":"formal","variety":"both","position":"start","punct_fr":"+ nom, puis virgule ; 'regard' sans s","ex":"[[With regard to]] your request for flexible working, I can confirm that it has been approved."},{"text":"as regards","register":"formal","variety":"both","position":"start","punct_fr":"+ nom, puis virgule ; sans 'to' ; un peu plus britannique","ex":"[[As regards]] the bonus, no decision has yet been taken."},{"text":"turning to","register":"formal","variety":"both","position":"start","punct_fr":"+ nom, puis virgule ; dans un rapport ou un exposé","ex":"[[Turning to]] the question of notice, the contract is silent."},{"text":"in respect of","register":"formal","variety":"uk","position":"mid","punct_fr":"+ nom ; écrit juridique britannique ; US : 'with respect to'","ex":"No payment is due [[in respect of]] untaken leave from previous years."},{"text":"as for","register":"everyday","variety":"both","position":"start","punct_fr":"+ nom, puis virgule ; introduit un second sujet, parfois avec une pointe de réserve","ex":"[[As for]] the Lyon office, I'm less optimistic."},{"text":"when it comes to","register":"everyday","variety":"both","position":"start","punct_fr":"+ nom ou -ing, puis virgule","ex":"[[When it comes to]] pay, the two sites are not comparable."},{"text":"moving on to","register":"everyday","variety":"both","position":"start","punct_fr":"+ nom ; pour passer au point suivant de l'ordre du jour","ex":"[[Moving on to]] the pay review - where are we?"},{"text":"on a separate note","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; e-mails et réunions","ex":"[[On a separate note]], could you send me the latest headcount figures?"},{"text":"by the way","register":"informal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; parenthèse sans lien direct","ex":"[[By the way]], did the new starter get her laptop?"},{"text":"speaking of which","register":"informal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; rebondit sur ce qui vient d'être dit","ex":"[[Speaking of which]], have we heard back from the training provider?"}],"pitfalls_fr":["Ne commencez pas chaque phrase par 'Concerning...' ou 'Regarding...' (calque de 'concernant'). Souvent, il suffit de faire du thème le sujet : 'The bonus has not been decided yet.'","'About the contract, I think...' en tête de phrase n'est pas idiomatique. Dites 'As for the contract,' ou 'On the contract,'.","'With regard to' et 'in regard to' sans s ; 'as regards' avec s et sans 'to'. 'With regards to' est une faute fréquente ('regards' = salutations)."],"exercises":[{"type":"mcq","prompt":"(formal letter) ___ your request for flexible working, I can confirm that it has been approved.","options":["About","With regard to","With regards of","Speaking of"],"answer":1,"explain_fr":"'With regard to' + nom : formule d'ouverture d'une lettre. 'About' en tête est un calque."},{"type":"mcq","prompt":"(in a meeting) OK, that's recruitment covered. ___ the pay review - where are we?","options":["In respect of","As regards to","Moving on to","By the way"],"answer":2,"explain_fr":"'Moving on to' fait avancer l'ordre du jour. 'As regards to' est fautif (pas de 'to')."},{"type":"mcq","prompt":"(chatting) '...and the training budget is gone.' - '___, did you ever hear back from the provider?'","options":["Speaking of which","With regard to which","Turning to","As regards"],"answer":0,"explain_fr":"'Speaking of which' : on rebondit sur le sujet évoqué ('à ce propos')."},{"type":"mcq","prompt":"(in a meeting) The Paris team is fine. ___ the Lyon office, I'm less sure.","options":["About","Concerning to","In respect","As for"],"answer":3,"explain_fr":"'As for' + nom introduit le second terme de la comparaison ('quant à')."},{"type":"join","prompt":"Bonuses are discretionary. Overtime is governed by the collective agreement. (use 'as for')","answer":"Bonuses are discretionary. As for overtime, it is governed by the collective agreement.","accept":["Bonuses are discretionary; as for overtime, it is governed by the collective agreement.","Bonuses are discretionary. As for overtime, it's governed by the collective agreement.","Bonuses are discretionary. As for overtime, that is governed by the collective agreement.","Bonuses are discretionary. As regards overtime, it is governed by the collective agreement."],"explain_fr":"'As for' + nom, virgule, puis reprise par un pronom."},{"type":"join","prompt":"I am writing about your email of 3 May. I confirm the meeting. (formal - use 'with regard to')","answer":"With regard to your email of 3 May, I confirm the meeting.","accept":["With regard to your email of 3 May, I can confirm the meeting.","With regard to your email of 3 May, I am writing to confirm the meeting.","With regard to your email of May 3, I confirm the meeting.","With regard to your email of May 3, I can confirm the meeting."],"explain_fr":"'With regard to' + nom ouvre la phrase et remplace 'I am writing about'."}]},{"id":"cn-conclude","function":"Concluding","function_fr":"Conclure","items":[{"text":"in conclusion","register":"formal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; rapports et exposés, pas en réunion informelle","ex":"[[In conclusion]], the evidence does not support the allegation."},{"text":"in summary","register":"formal","variety":"both","position":"start","punct_fr":"suivi d'une virgule","ex":"[[In summary]], the proposed change requires the employee's consent."},{"text":"on balance","register":"formal","variety":"both","position":"any","punct_fr":"en tête ou entre virgules ; 'tout bien pesé'","ex":"[[On balance]], we would recommend settling the claim."},{"text":"to sum up","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ou de deux-points","ex":"[[To sum up]]: we extend the probation and review in three months."},{"text":"in short","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; 'bref'","ex":"[[In short]], the policy is clear and has been applied consistently."},{"text":"overall","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; 'globalement'","ex":"[[Overall]], the feedback from managers has been positive."},{"text":"all in all","register":"everyday","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; bilan plutôt oral","ex":"[[All in all]], it was a useful meeting."},{"text":"the bottom line is","register":"informal","variety":"both","position":"start","punct_fr":"+ proposition ; va droit à l'essentiel ; très courant aux États-Unis","ex":"[[The bottom line is]] we can't afford to lose her."},{"text":"long story short","register":"informal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; UK aussi 'to cut a long story short'","ex":"[[Long story short]], she's staying."},{"text":"at the end of the day","register":"informal","variety":"both","position":"start","punct_fr":"suivi d'une virgule ; oral ; cliché si on en abuse","ex":"[[At the end of the day]], it's the client's decision."}],"pitfalls_fr":["'As a conclusion' est un calque : dites 'in conclusion' ou 'to conclude'. Et 'to resume' signifie 'reprendre', pas 'résumer' ('to sum up', 'to summarise').","'At the end' = à la fin (de quelque chose : 'at the end of the meeting'). 'In the end' = finalement, après bien des péripéties.","'In conclusion' en fin de réunion sonne comme un discours. Dites plutôt 'So, to sum up...' ou 'So where does that leave us?'. 'Finally' annonce le dernier point, pas la conclusion."],"exercises":[{"type":"mcq","prompt":"(written report) ___, the evidence does not support the allegation of harassment.","options":["As a conclusion","At the end","In conclusion","Long story short"],"answer":2,"explain_fr":"'In conclusion' dans un rapport. 'As a conclusion' est un calque ; 'at the end' appelle 'of...'."},{"type":"mcq","prompt":"(in a meeting) So, ___: we extend the probation, and we review in three months.","options":["in conclusion","to sum up","to resume","as a conclusion"],"answer":1,"explain_fr":"En réunion : 'to sum up'. 'To resume' = 'reprendre'."},{"type":"mcq","prompt":"(written advice) There are risks on both sides but, ___, we would recommend settling the claim.","options":["on balance","at the end","at last","finally"],"answer":0,"explain_fr":"'On balance' : après avoir pesé le pour et le contre."},{"type":"mcq","prompt":"(chatting) There were three meetings and a lot of emails but, ___, she's staying.","options":["in summary","on balance","to conclude","long story short"],"answer":3,"explain_fr":"'Long story short' : 'bref', pour sauter les détails à l'oral."},{"type":"join","prompt":"The process was long. We reached an agreement. (use 'in the end')","answer":"The process was long, but in the end we reached an agreement.","accept":["The process was long, but we reached an agreement in the end.","The process was long but we reached an agreement in the end.","The process was long but in the end we reached an agreement.","The process was long. In the end, we reached an agreement.","The process was long, but in the end, we reached an agreement."],"explain_fr":"'In the end' = 'finalement', à ne pas confondre avec 'at the end'."},{"type":"join","prompt":"The policy is clear and has been applied consistently. We see no ground for a grievance. (use 'in short')","answer":"The policy is clear and has been applied consistently. In short, we see no ground for a grievance.","accept":["The policy is clear and has been applied consistently; in short, we see no ground for a grievance.","The policy is clear and has been applied consistently. In short, we see no grounds for a grievance."],"explain_fr":"'In short' + virgule ramasse l'argument en une phrase."}]}],"softeners":[{"function":"Giving bad news","function_fr":"Annoncer une mauvaise nouvelle","phrases":[{"text":"I'm afraid ...","variety":"both","note_fr":"L'amortisseur universel : 'I'm afraid we can't extend the deadline.' Aucune idée de peur ; plus fréquent encore au Royaume-Uni."},{"text":"Unfortunately, ...","variety":"both","note_fr":"Neutre, à l'oral comme à l'écrit. Suivi d'une virgule."},{"text":"I'm sorry to say that ...","variety":"both","note_fr":"Plus personnel ; convient en entretien individuel."},{"text":"I regret to inform you that ...","variety":"both","note_fr":"Écrit très formel (lettre de refus, notification). Déplacé à l'oral."},{"text":"It's not quite what we were hoping for.","variety":"uk","note_fr":"Litote britannique : comprendre 'c'est insuffisant'. 'Not quite' signifie souvent 'pas du tout'."},{"text":"That's not going to work for us.","variety":"us","note_fr":"Formulation américaine plus directe, sans être impolie. Un Britannique dirait 'I'm not sure that would work for us'."},{"text":"We've decided to go in a different direction.","variety":"us","note_fr":"Euphémisme d'entreprise, surtout américain, pour annoncer un refus (candidature, prestataire)."}]},{"function":"Making a request","function_fr":"Formuler une demande","phrases":[{"text":"Could you possibly ...?","variety":"uk","note_fr":"Très britannique : 'possibly' adoucit encore 'could'. Peut sembler excessif à un Américain."},{"text":"Would you mind + -ing ...?","variety":"both","note_fr":"'Would you mind sending me the file?' Attention : pour accepter, on répond 'Not at all', pas 'Yes'."},{"text":"I was wondering if you could ...","variety":"both","note_fr":"Le passé ('was wondering') crée la distance polie ; très courant au Royaume-Uni, y compris entre collègues."},{"text":"I'd be grateful if you could ...","variety":"uk","note_fr":"Formule écrite britannique standard. Évitez 'I would be thankful' et 'Thanks in advance' sec."},{"text":"I'd appreciate it if you could ...","variety":"us","note_fr":"Équivalent américain de 'I'd be grateful if'. Ne pas oublier 'it'."},{"text":"When you get a moment, could you ...?","variety":"both","note_fr":"Demande sans urgence, entre collègues."},{"text":"Can you get this to me by Friday?","variety":"us","note_fr":"Demande directe, normale dans un contexte américain. Au Royaume-Uni, on ajouterait 'Would you be able to...' ou 'if at all possible'."}]},{"function":"Disagreeing","function_fr":"Exprimer un désaccord","phrases":[{"text":"I'm not sure I agree.","variety":"both","note_fr":"Comprendre : 'je ne suis pas d'accord'. 'I don't agree' ou 'I disagree' tout court sonnent brutal."},{"text":"I see your point, but ...","variety":"both","note_fr":"On reconnaît l'argument avant de le contester : structure attendue en réunion."},{"text":"With respect, ...","variety":"uk","note_fr":"Attention : au Royaume-Uni, annonce un désaccord net. 'With the greatest respect' est encore plus sévère."},{"text":"I take a slightly different view.","variety":"uk","note_fr":"Litote britannique : 'slightly' peut recouvrir un désaccord complet."},{"text":"I'm not convinced that ...","variety":"both","note_fr":"Désaccord argumenté, courtois, utilisable à l'écrit."},{"text":"I see it differently.","variety":"us","note_fr":"Plus direct, courant aux États-Unis ; reste poli parce qu'il parle de soi et non de l'autre."},{"text":"I hear what you're saying, but ...","variety":"both","note_fr":"Signale souvent que l'on n'a pas été convaincu. Ne pas prendre le début pour une approbation."}]},{"function":"Suggesting","function_fr":"Suggérer","phrases":[{"text":"Have you thought about + -ing ...?","variety":"both","note_fr":"Suggestion sous forme de question : 'Have you thought about offering mediation?'"},{"text":"It might be worth + -ing ...","variety":"uk","note_fr":"Très britannique. 'It might be worth checking the contract' = 'vérifiez le contrat'."},{"text":"Why don't we ...?","variety":"both","note_fr":"Proposition directe et cordiale, suivie de la base verbale."},{"text":"What if we ...?","variety":"both","note_fr":"Ouvre une piste sans l'imposer : 'What if we extended the probation instead?' (prétérit fréquent)."},{"text":"Perhaps we could ...","variety":"uk","note_fr":"'Perhaps' est plus britannique ; un Américain dira plutôt 'Maybe we could ...'."},{"text":"You might want to ...","variety":"both","note_fr":"Conseil appuyé, parfois une instruction déguisée : 'You might want to check with Legal first.'"},{"text":"My suggestion would be to ...","variety":"both","note_fr":"Le conditionnel 'would be' adoucit ; plus naturel que 'I propose to'."}]},{"function":"Hedging","function_fr":"Nuancer une affirmation","phrases":[{"text":"It seems to me that ...","variety":"both","note_fr":"Présente un avis comme une impression. Évitez 'According to me', qui n'existe pas : dites 'In my view' ou 'I think'."},{"text":"As far as I know, ...","variety":"both","note_fr":"Réserve sur l'exhaustivité de vos informations ; à l'écrit, 'To my knowledge'."},{"text":"I may be wrong, but ...","variety":"both","note_fr":"Précède souvent une affirmation dont le locuteur est assez sûr, surtout au Royaume-Uni."},{"text":"It would appear that ...","variety":"both","note_fr":"Écrit formel : permet de rapporter un fait sans s'engager ('Il semblerait que')."},{"text":"I'd say ...","variety":"both","note_fr":"Estimation prudente à l'oral : 'I'd say three months at most.'"},{"text":"I tend to think ...","variety":"both","note_fr":"Avis nuancé, plus doux que 'I think'."},{"text":"That's a bit of a problem.","variety":"uk","note_fr":"Litote britannique : 'a bit of a problem' désigne souvent un problème sérieux. Un Américain dirait plus volontiers 'That's a real problem'."}]}],"spoken_markers":[{"text":"actually","meaning_fr":"en fait, à vrai dire","ex":"[[Actually]], we signed it last week.","note_fr":"Faux ami : ne signifie jamais 'actuellement' (= 'currently', 'at the moment'). Sert à corriger poliment ou à annoncer une surprise."},{"text":"by the way","meaning_fr":"au fait, à propos","ex":"[[By the way]], has the union replied yet?","note_fr":"Introduit une parenthèse. Dans un e-mail professionnel, préférez 'On a separate note'."},{"text":"anyway","meaning_fr":"bref, de toute façon ; pour revenir au sujet","ex":"[[Anyway]], let's get back to the agenda.","note_fr":"Sert à clore une digression ou à conclure. 'Anyways' est familier et américain."},{"text":"to be fair","meaning_fr":"il faut reconnaître que, à sa décharge","ex":"[[To be fair]], nobody had explained the procedure to him.","note_fr":"Introduit un élément à décharge ou une nuance honnête ; très fréquent au Royaume-Uni."},{"text":"as it happens","meaning_fr":"il se trouve que, justement","ex":"[[As it happens]], I spoke to her manager this morning.","note_fr":"Signale une coïncidence utile. Plutôt britannique."},{"text":"having said that","meaning_fr":"cela dit","ex":"It's a strong application. [[Having said that]], she has no management experience.","note_fr":"Concession orale et écrite courante ; 'that said' en est la forme courte."},{"text":"going forward","meaning_fr":"à l'avenir, désormais","ex":"[[Going forward]], all requests will go through the HR portal.","note_fr":"Jargon d'entreprise très répandu, surtout américain ; certains le jugent creux. 'From now on' ou 'in future' sont plus simples."},{"text":"I mean","meaning_fr":"enfin, je veux dire","ex":"It's a risk. [[I mean]], she could simply refuse to sign.","note_fr":"Sert à préciser ou à justifier ce qu'on vient de dire. Ne pas en faire un tic."},{"text":"you know","meaning_fr":"tu sais, vous voyez","ex":"It's hard to say no when, [[you know]], the request comes from the CEO.","note_fr":"Cherche l'assentiment ou comble une hésitation. Naturel à petite dose, jamais à l'écrit."},{"text":"right","meaning_fr":"bien, bon ; n'est-ce pas ?","ex":"[[Right]], shall we make a start?","note_fr":"En tête : marque le début ou un changement de sujet (très britannique). En fin de phrase : demande de confirmation ('You've seen the draft, right?')."},{"text":"so","meaning_fr":"bon, alors, donc","ex":"[[So]], where are we with the Leeds dismissal?","note_fr":"Ouvre un sujet ou relance la discussion ; pas toujours une conséquence. À éviter en tête de phrase dans un document."},{"text":"well","meaning_fr":"eh bien, disons","ex":"[[Well]], it depends on what the contract says.","note_fr":"Annonce une réponse nuancée, une hésitation ou un désaccord poli. Ne se traduit pas par 'bien'."},{"text":"mind you","meaning_fr":"remarquez, cela dit","ex":"The process took six months. [[Mind you]], it was a complicated case.","note_fr":"Britannique. Ajoute une réserve ou relativise ce qui précède ; rare aux États-Unis ('then again')."},{"text":"for what it's worth","meaning_fr":"pour ce que ça vaut, si mon avis compte","ex":"[[For what it's worth]], I think you handled the meeting very well.","note_fr":"Présente un avis avec modestie ; souvent abrégé 'FWIW' dans les messages informels."},{"text":"at the end of the day","meaning_fr":"au bout du compte, en définitive","ex":"[[At the end of the day]], it's her decision.","note_fr":"N'a rien à voir avec la fin de la journée. Cliché oral : à utiliser avec modération."},{"text":"fair enough","meaning_fr":"d'accord, ça se tient","ex":"'I'd rather wait for the medical report.' - '[[Fair enough]].'","note_fr":"Accepte l'argument de l'autre, parfois sans enthousiasme. Surtout britannique ; s'emploie seul, en réponse."}],"rhythm":[{"title":"One idea per sentence","title_fr":"Une idée par phrase","explain_fr":"La phrase française enchaîne volontiers les subordonnées ; la phrase anglaise professionnelle est courte. Coupez dès qu'une nouvelle idée commence, puis alternez phrases brèves et phrases un peu plus longues.","heavy":"Following the meeting which took place on Monday with the employee representatives, during which the question of the reorganisation of the working time was raised, we would like to inform you that the management, which has taken note of the concerns expressed, will come back to you with a proposal which will take them into account.","natural":"We met the employee representatives on Monday. They raised concerns about the changes to working time. Management has taken these on board and will come back to you with a revised proposal."},{"title":"Use verbs, not abstract nouns","title_fr":"Le verbe plutôt que le nom abstrait","explain_fr":"Le français aime les noms ('procéder à la vérification de') ; l'anglais préfère le verbe ('check'). Cherchez le verbe caché dans les noms en -tion, -ment, -ance.","heavy":"The implementation of the new policy will require the organisation of an information session for the managers.","natural":"Before we introduce the new policy, we need to brief the managers."},{"title":"Active voice when you speak","title_fr":"La voix active à l'oral","explain_fr":"Le passif convient à un document formel ; à l'oral, il crée de la distance et allonge la phrase. Dites qui fait quoi, avec 'we', 'I' ou 'they'.","heavy":"It has been decided by the management that the proposal which was submitted by the union will not be accepted.","natural":"Management has decided not to accept the union's proposal."},{"title":"Drop the connectors you don't need","title_fr":"Supprimer les connecteurs inutiles","explain_fr":"L'anglais s'appuie sur l'ordre des phrases plus que sur les mots de liaison. 'Indeed', 'in fact', 'moreover', 'thus' en rafale trahissent le francophone. N'en gardez un que s'il ajoute du sens.","heavy":"Indeed, the employee was absent for three weeks. Moreover, he did not provide any certificate. Thus, the employer sent him a letter. In fact, he never answered.","natural":"The employee was absent for three weeks and provided no medical certificate. The employer wrote to him, but he never replied."},{"title":"Put the point first","title_fr":"Commencer par l'essentiel","explain_fr":"En français, on expose le contexte puis on conclut. En anglais professionnel, on donne d'abord la conclusion ou la demande, ensuite les raisons.","heavy":"Given the fact that the budget has been reduced, that two people are on long-term leave and that the recruitment freeze is still in force, I am afraid that it will not be possible for us to approve your request.","natural":"I'm afraid we can't approve your request. The budget has been cut, two people are on long-term leave, and the recruitment freeze is still in place."},{"title":"Break up 'of' chains","title_fr":"Éviter les enfilades de 'of'","explain_fr":"Les chaînes 'the X of the Y of the Z' calquent les compléments du nom français. Utilisez le possessif ('s), un nom en position d'adjectif, ou un verbe.","heavy":"The analysis of the results of the survey of the satisfaction of the employees of the group shows a deterioration of the level of confidence.","natural":"The group's employee satisfaction survey shows that confidence has fallen."},{"title":"Subject and verb early","title_fr":"Le sujet et le verbe d'abord","explain_fr":"L'auditeur anglophone attend le sujet et le verbe dès le début. Les longues introductions avant le sujet, et les incises entre sujet et verbe, font perdre le fil.","heavy":"The employee, who had been working for the company for more than fifteen years and who had never received the slightest warning, after the meeting of 3 June, resigned.","natural":"The employee resigned after the meeting on 3 June. He had been with the company for more than fifteen years and had a clean disciplinary record."},{"title":"Plain words and contractions","title_fr":"Mots simples et contractions","explain_fr":"Les mots d'origine latine paraissent naturels à un francophone mais pompeux en anglais courant. À l'oral, préférez les mots courts et les contractions ; gardez le registre soutenu pour les documents.","heavy":"I will endeavour to obtain the information that you requested and I will not fail to revert to you in the event that I encounter any difficulty.","natural":"I'll try to get the information you asked for, and I'll let you know if there's a problem."}],"grammar":[{"id":"gr-shall","track":"legal","title":"Shall, must, may and will in contracts and policies","title_fr":"Shall, must, may et will dans les contrats et les politiques internes","points":[{"rule":"In a contract, 'shall' imposes an obligation on a party. It is not a future tense.","rule_fr":"Dans un contrat, 'shall' impose une obligation à une partie ; ce n'est pas un futur. On ne l'emploie pas pour un simple constat.","examples":[{"wrong":null,"right":"The Employee [[shall]] devote the whole of his or her working time to the Company.","note_fr":"Obligation à la charge du salarié : 'shall' = 'est tenu de'. En français, le présent de l'indicatif joue ce rôle ('Le salarié consacre...')."},{"wrong":"This Agreement shall be governed by French law.","right":"This Agreement [[is governed]] by French law.","note_fr":"Un constat, pas une obligation : la rédaction moderne emploie le présent. La version avec 'shall' reste très répandue dans les contrats traditionnels."},{"wrong":"The Employee shall be entitled to 25 days' holiday.","right":"The Employee [[is entitled]] to 25 days' holiday.","note_fr":"Un droit n'est pas une obligation : 'is entitled to'. Réservez 'shall' à ce qu'une partie doit faire."}]},{"rule":"Plain-English drafting prefers 'must' for obligations, especially in policies and handbooks.","rule_fr":"La rédaction en langage clair préfère 'must' pour l'obligation, surtout dans les politiques internes et les règlements. Les rédacteurs de textes officiels britanniques et américains évitent désormais 'shall' ; les contrats commerciaux le conservent davantage.","examples":[{"wrong":null,"right":"Employees [[must]] report any absence before 9 a.m.","note_fr":"'Must' est sans ambiguïté et compris de tous. Un 'handbook' américain ou une 'policy' britannique n'emploie pratiquement plus 'shall'."},{"wrong":"Employees have to report any accident immediately.","right":"Employees [[must]] report any accident immediately.","note_fr":"'Have to' est oral ; dans un document, l'obligation se dit 'must'."}]},{"rule":"'May' gives permission or discretion; 'must not' or 'may not' prohibits.","rule_fr":"'May' accorde une faculté ou un pouvoir discrétionnaire ; 'must not' ou 'may not' interdit. 'Can' exprime la capacité et n'a pas sa place dans une clause.","examples":[{"wrong":null,"right":"The Company [[may]] require the Employee to work additional hours.","note_fr":"Faculté de l'employeur : 'peut', à sa discrétion."},{"wrong":"The Employee can not disclose confidential information.","right":"The Employee [[must not]] disclose confidential information.","note_fr":"Interdiction : 'must not' (ou 'shall not' en style traditionnel). 'Cannot' décrirait une impossibilité."}]},{"rule":"'Will' states what a party undertakes to do or what is going to happen; it is common in UK employment contracts and offer letters addressed to 'you'.","rule_fr":"'Will' énonce un engagement ou ce qui va se passer ; il est courant dans les contrats de travail britanniques et les lettres d'embauche rédigés à la deuxième personne ('you'). Aux États-Unis, les 'offer letters' et 'handbooks' emploient aussi 'will' et 'must' plutôt que 'shall'.","examples":[{"wrong":null,"right":"You [[will]] be paid monthly in arrears by bank transfer.","note_fr":"Style britannique courant : contrat adressé à 'you', engagement exprimé par 'will'."},{"wrong":null,"right":"The Company [[will]] reimburse reasonable travel expenses.","note_fr":"Engagement de l'employeur. Dans un même document, gardez un seul modal par fonction : ne mélangez pas 'shall' et 'will' pour l'obligation."}]},{"rule":"'Must not' prohibits; 'need not' and 'do not have to' simply remove an obligation.","rule_fr":"'Must not' interdit ; 'need not' et 'do not have to' lèvent seulement l'obligation. Piège classique pour un francophone ('ne doit pas' est ambigu).","examples":[{"wrong":"Part-time staff must not attend the Friday briefing.","right":"Part-time staff [[do not have to]] attend the Friday briefing.","note_fr":"Si la présence est facultative : 'do not have to' ou 'need not'. 'Must not attend' leur interdirait de venir."},{"wrong":null,"right":"Visitors [[must not]] be left unaccompanied in the building.","note_fr":"Interdiction ferme."}]}],"exercises":[{"type":"mcq","prompt":"(contract clause) The Employee ___ during the employment work for any competitor of the Company.","options":["shall not","doesn't have to","need not","would not"],"answer":0,"explain_fr":"Interdiction contractuelle : 'shall not' (ou 'must not'). 'Need not' et 'doesn't have to' signifient l'absence d'obligation."},{"type":"mcq","prompt":"(staff handbook, plain English) You ___ tell your manager as soon as possible if you are unwell.","options":["shall to","must","may","would"],"answer":1,"explain_fr":"Obligation en langage clair : 'must'. 'May' serait une simple faculté."},{"type":"mcq","prompt":"The Company ___, at its absolute discretion, pay a bonus.","options":["must","shall","may","has to"],"answer":2,"explain_fr":"'At its discretion' appelle 'may' : faculté, pas obligation."},{"type":"mcq","prompt":"Which sentence means that there is NO obligation?","options":["Staff must not attend.","Staff may not attend.","Staff shall not attend.","Staff need not attend."],"answer":3,"explain_fr":"'Need not' = 'ne sont pas tenus de'. Les trois autres interdisent."},{"type":"gap","prompt":"The Company ___ (reimburse) reasonable expenses on production of receipts. [undertaking, UK contract style]","answer":"will reimburse","accept":["shall reimburse"],"explain_fr":"Engagement de l'employeur : 'will' (style britannique actuel) ou 'shall' (style traditionnel)."},{"type":"gap","prompt":"Employees ___ (not / use) company equipment for personal business. [prohibition in a policy]","answer":"must not use","accept":["may not use","shall not use"],"explain_fr":"Interdiction : 'must not' en langage clair."},{"type":"gap","prompt":"This Agreement ___ governed by the laws of France. [statement of fact, modern drafting]","answer":"is","accept":["shall be"],"explain_fr":"Constat : présent simple. 'Shall be' reste courant mais n'exprime aucune obligation réelle."},{"type":"rewrite","prompt":"Rewrite in plain English for a staff handbook: 'Employees shall notify HR of any change of address.'","answer":"Employees must notify HR of any change of address.","accept":["You must notify HR of any change of address.","Employees must tell HR about any change of address.","You must tell HR about any change of address.","You must tell HR if you change address.","You must tell HR if your address changes.","Employees must tell HR if their address changes."],"explain_fr":"'Shall' devient 'must' ; on peut aussi s'adresser directement au lecteur avec 'you'."},{"type":"rewrite","prompt":"Rewrite as a permission with 'may': 'The Employee is allowed to take up to five days' unpaid leave per year.'","answer":"The Employee may take up to five days' unpaid leave per year.","accept":["The Employee may take up to five days of unpaid leave per year.","The Employee may take up to five days' unpaid leave a year.","The Employee may take up to five days' unpaid leave each year."],"explain_fr":"'Is allowed to' = 'may' dans une clause."},{"type":"rewrite","prompt":"Rewrite to show that there is no obligation: 'It is not necessary for you to provide a medical certificate for the first three days.'","answer":"You do not have to provide a medical certificate for the first three days.","accept":["You don't have to provide a medical certificate for the first three days.","You need not provide a medical certificate for the first three days.","You do not need to provide a medical certificate for the first three days.","You don't need to provide a medical certificate for the first three days."],"explain_fr":"Absence d'obligation : 'do not have to', 'do not need to' ou 'need not' - jamais 'must not'."}]},{"id":"gr-passive","track":"legal","title":"The passive in formal documents - and when to prefer the active","title_fr":"Le passif dans les documents formels - et quand préférer l'actif","points":[{"rule":"Use the passive when the actor is unknown, obvious or unimportant: it is standard in formal letters and procedures.","rule_fr":"Le passif s'impose quand l'auteur de l'action est inconnu, évident ou sans importance : c'est la norme dans les lettres officielles et les procédures.","examples":[{"wrong":null,"right":"Your application [[has been received]] and will be reviewed shortly.","note_fr":"Peu importe qui a reçu le dossier."},{"wrong":null,"right":"The employee [[was dismissed]] for gross misconduct.","note_fr":"L'auteur (l'employeur) est évident."}]},{"rule":"Prefer the active when it matters who must act, especially for obligations in contracts and policies.","rule_fr":"Préférez l'actif quand il faut savoir qui doit agir : une obligation au passif laisse le débiteur dans l'ombre.","examples":[{"wrong":"A medical certificate must be provided within 48 hours.","right":"The employee [[must provide]] a medical certificate within 48 hours.","note_fr":"Qui doit fournir le certificat ? L'actif le dit."},{"wrong":"It has been decided by the committee to reject the appeal.","right":"The committee [[has decided]] to reject the appeal.","note_fr":"'It has been decided by...' est lourd : si l'on nomme l'auteur, autant en faire le sujet."}]},{"rule":"French 'on' and many reflexive verbs become an English passive, and the person can be the subject.","rule_fr":"'On' et de nombreux verbes pronominaux se rendent par un passif anglais. La personne concernée peut devenir sujet ('I was told', 'She was given'), ce que le français ne permet pas.","examples":[{"wrong":"One has informed me that the meeting is cancelled.","right":"I [[have been told]] that the meeting is cancelled.","note_fr":"'On m'a dit' = 'I have been told' / 'I was told'. 'One' est guindé et rare."},{"wrong":"It was given to me a copy of the report.","right":"I [[was given]] a copy of the report.","note_fr":"Le complément d'objet indirect devient sujet du passif."},{"wrong":"It was explained to me the procedure.","right":"The procedure [[was explained]] to me.","note_fr":"Avec 'explain', c'est la chose expliquée qui devient sujet ; 'I was explained' est fautif."}]},{"rule":"In speech, prefer the active with 'we', 'I' or 'they'; a passive with 'by me' or 'by us' sounds stiff.","rule_fr":"À l'oral, préférez l'actif avec 'we', 'I' ou 'they' : un passif suivi de 'by me' ou 'by us' sonne raide.","examples":[{"wrong":"A decision will be taken by us next week.","right":"We [[will decide]] next week.","note_fr":"Le verbe simple remplace 'a decision will be taken'."},{"wrong":"Your email was read by me with interest.","right":"I [[read]] your email with interest.","note_fr":"Si l'agent est 'me', commencez par 'I'."}]},{"rule":"Reporting passives ('is alleged to', 'is deemed to', 'is said to') report a claim or a legal fiction without endorsing it.","rule_fr":"Les passifs de report ('is alleged to', 'is deemed to', 'is said to') rapportent une affirmation ou une fiction juridique sans
