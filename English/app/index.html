":2,"fr":"valider sa période d'essai / être confirmé(e) dans son poste","term":{"uk":"to pass one's probation","us":"to pass one's probation"},"ipa":{"uk":"/ˌpɑːs wʌnz prəˈbeɪʃ(ə)n/","us":"/ˌpæs wʌnz proʊˈbeɪʃ(ə)n/"},"def":"To complete the probationary period successfully and continue in the job.","registers":{"formal":{"uk":"to be confirmed in post","us":"to be confirmed in the position","ex":"On successful completion of the probationary period, the Employee shall [[be confirmed in post]].","ex_us":"On successful completion of the probationary period, the Employee shall [[be confirmed in the position]]."},"everyday":{"uk":"to pass probation","us":"to pass probation","ex":"She [[passed probation]] with flying colours, so the longer notice period now applies."},"informal":null},"collocations":["to complete probation successfully","to fail probation","a probation review","to sign off someone's probation"],"note_fr":"« To validate » est un calque : on « passes » ou « completes » sa période d'essai. Pour la rupture pendant l'essai, dites « she didn't pass probation » ou « we ended his probation » ; « to break the trial period » ne se dit pas.","french_concept":false,"explain":null},{"id":"ct-047","level":2,"fr":"ancienneté","term":{"uk":"length of service","us":"seniority"},"ipa":{"uk":"/ˌleŋθ əv ˈsɜːvɪs/","us":"/ˌsiːniˈɔːrəti/"},"def":"The amount of time an employee has worked for the same employer without a break.","registers":{"formal":{"uk":"continuous service","us":"length of service","ex":"For the purposes of this clause, the Employee's period of [[continuous service]] began on 3 January 2019.","ex_us":"For the purposes of this section, the Employee's [[length of service]] began on January 3, 2019."},"everyday":{"uk":"to have been with the company for","us":"to have been with the company for","ex":"She's [[been with the company for]] twelve years, so her notice period is much longer."},"informal":null},"collocations":["two years' service","continuity of employment","a long-serving employee","to accrue service"],"note_fr":"« Ancientness » n'existe pas. Au Royaume-Uni, « seniority » désigne surtout le rang hiérarchique ; l'ancienneté est « length of service » ou, en droit, « continuous employment ». Aux États-Unis, « seniority » signifie bien ancienneté, surtout en contexte syndical. « Tenure » se dit aussi (US).","french_concept":false,"explain":null},{"id":"ct-048","level":1,"fr":"clause","term":{"uk":"clause","us":"clause"},"ipa":{"uk":"/klɔːz/","us":"/klɔːz/"},"def":"A numbered section of a contract dealing with one particular point.","registers":{"formal":{"uk":"clause","us":"section","ex":"The restrictions in [[clause]] 14 shall continue to apply after the termination of this agreement.","ex_us":"The restrictions in [[Section]] 14 shall continue to apply after the termination of this agreement."},"everyday":{"uk":"clause","us":"clause","ex":"There's a [[clause]] in his contract that says he can be moved to any site in France."},"informal":null},"collocations":["to insert a clause","to strike out a clause","under clause 5","the small print"],"note_fr":"On dit « under clause 5 » ou « pursuant to clause 5 », pas « according to the clause 5 » (pas d'article devant un numéro). Les contrats américains parlent plutôt de « Section » ; « article » est possible mais « provision » est le mot générique pour « stipulation ».","french_concept":false,"explain":null},{"id":"ct-049","level":2,"fr":"stipuler / prévoir (dans un contrat)","term":{"uk":"to set out","us":"to set out"},"ipa":{"uk":"/ˌset ˈaʊt/","us":"/ˌset ˈaʊt/"},"def":"To state something clearly and in an organised way in a written document.","registers":{"formal":{"uk":"to provide that","us":"to provide that","ex":"Clause 8 [[provides that]] the Employee may be required to travel within the European Union."},"everyday":{"uk":"to say","us":"to say","ex":"What does the contract actually [[say]] about working from home?"},"informal":null},"collocations":["as set out in clause 3","to set out the terms","the contract provides for","to spell something out"],"note_fr":"« To stipulate » existe mais reste rare ; « to provide that » et « to set out » sont les verbes naturels. Attention : « to foresee » (prévoir l'avenir) ne convient pas - « the contract foresees » est un calque. « To provide for » + nom, « to provide that » + proposition.","french_concept":false,"explain":null},{"id":"ct-050","level":2,"fr":"clause de mobilité","term":{"uk":"mobility clause","us":"relocation clause"},"ipa":{"uk":"/məʊˈbɪləti klɔːz/","us":"/ˌriːloʊˈkeɪʃ(ə)n klɔːz/"},"def":"A contract term allowing the employer to change the employee's place of work within a defined area.","registers":{"formal":{"uk":"mobility clause","us":"relocation clause","ex":"The [[mobility clause]] must define precisely the geographical area within which the Employee may be transferred.","ex_us":"The [[relocation clause]] must define precisely the geographic area within which the Employee may be transferred."},"everyday":{"uk":"to be asked to relocate","us":"to be asked to relocate","ex":"Under her contract she can [[be asked to relocate]] anywhere in the Paris region."},"informal":null},"collocations":["to invoke a mobility clause","to relocate an employee","a relocation package","within a reasonable distance"],"note_fr":"En droit français, la clause doit délimiter précisément sa zone géographique et ne peut pas être étendue unilatéralement. Au Royaume-Uni, la « mobility clause » doit être appliquée de façon raisonnable ; aux États-Unis, l'employeur peut en général imposer une mutation sans clause.","french_concept":false,"explain":null},{"id":"ct-051","level":1,"fr":"clause de confidentialité","term":{"uk":"confidentiality clause","us":"confidentiality clause"},"ipa":{"uk":"/ˌkɒnfɪˌdenʃiˈæləti klɔːz/","us":"/ˌkɑːnfɪˌdenʃiˈæləti klɔːz/"},"def":"A contract term that forbids the employee from disclosing or misusing the employer's confidential information.","registers":{"formal":{"uk":"duty of confidentiality","us":"duty of confidentiality","ex":"The Employee's [[duty of confidentiality]] shall continue without limit in time after the termination of employment."},"everyday":{"uk":"to keep something confidential","us":"to keep something confidential","ex":"You're expected [[to keep client data confidential]], even after you've left."},"informal":null},"collocations":["to breach confidentiality","to disclose confidential information","a non-disclosure agreement (NDA)","trade secrets"],"note_fr":"« Confidential » se construit avec « keep » : « to keep it confidential ». « To divulge » existe mais « to disclose » est le verbe juridique. Secret des affaires : « trade secrets ». L'« NDA » est un accord distinct, très courant aux États-Unis.","french_concept":false,"explain":null},{"id":"ct-052","level":2,"fr":"clause de non-concurrence","term":{"uk":"non-compete clause","us":"noncompete agreement"},"ipa":{"uk":"/ˌnɒn kəmˈpiːt klɔːz/","us":"/ˌnɑːn kəmˈpiːt əˌɡriːmənt/"},"def":"A contract term that prevents an employee from working for a competitor or setting up a competing business for a period after leaving.","registers":{"formal":{"uk":"non-competition covenant","us":"covenant not to compete","ex":"The [[non-competition covenant]] shall apply for twelve months following the termination date.","ex_us":"The [[covenant not to compete]] shall apply for twelve months following the termination date."},"everyday":{"uk":"non-compete","us":"non-compete","ex":"He can't join them until next spring - he's got a twelve-month [[non-compete]]."},"informal":null},"collocations":["to be bound by a non-compete","to enforce a non-compete","to release someone from a non-compete","to pay non-compete compensation"],"note_fr":"Différence de fond : en France, la clause n'est valable que si elle est limitée dans le temps et l'espace, justifiée par les intérêts légitimes de l'entreprise et assortie d'une contrepartie financière. Au Royaume-Uni, aucune contrepartie n'est exigée mais la clause doit être raisonnable ; aux États-Unis, tout dépend de l'État (la Californie les interdit pour l'essentiel).","french_concept":false,"explain":null},{"id":"ct-053","level":3,"fr":"clause de non-sollicitation (de clients ou de salariés)","term":{"uk":"non-solicitation clause","us":"non-solicitation clause"},"ipa":{"uk":"/ˌnɒn səˌlɪsɪˈteɪʃ(ə)n klɔːz/","us":"/ˌnɑːn səˌlɪsɪˈteɪʃ(ə)n klɔːz/"},"def":"A contract term forbidding a former employee from approaching the employer's clients or staff for a set period.","registers":{"formal":{"uk":"non-solicitation covenant","us":"non-solicitation covenant","ex":"Under the [[non-solicitation covenant]], the Employee shall not approach any client with whom she dealt in the twelve months before leaving."},"everyday":{"uk":"to poach","us":"to poach","ex":"She's free to work for a competitor, but she can't [[poach]] our clients or our people."},"informal":null},"collocations":["to solicit clients","to poach staff","a non-poaching clause","a non-dealing clause"],"note_fr":"« To solicit » signifie ici « démarcher », mais attention : hors contexte, « soliciting » évoque le racolage. À l'oral, « to poach » (débaucher, littéralement braconner) est le mot juste. Distinguez la non-sollicitation de clients et celle de salariés (« non-poaching »).","french_concept":false,"explain":null},{"id":"ct-054","level":3,"fr":"clause d'exclusivité","term":{"uk":"exclusivity clause","us":"exclusivity clause"},"ipa":{"uk":"/ˌekskluːˈsɪvəti klɔːz/","us":"/ˌekskluːˈsɪvəti klɔːz/"},"def":"A contract term that forbids the employee from doing any other paid work during the employment.","registers":{"formal":{"uk":"exclusivity of service","us":"exclusivity of service","ex":"By virtue of the [[exclusivity of service]] clause, the Employee shall not engage in any other professional activity without the Company's prior written consent."},"everyday":{"uk":"to have a second job","us":"to have a second job","ex":"Her contract says she can't [[have a second job]] without clearing it with us first."},"informal":{"uk":"to moonlight","us":"to moonlight","ex":"He was [[moonlighting]] for a competitor at weekends, which is a clear breach."}},"collocations":["outside business interests","to work on the side","prior written consent","a conflict of interest"],"note_fr":"En France, la clause doit être justifiée par la nature des fonctions et proportionnée, et elle est en principe exclue pour les temps partiels. Au Royaume-Uni, elle est inopposable dans les contrats zéro heure. « To moonlight » = avoir un second emploi, souvent non déclaré à l'employeur.","french_concept":false,"explain":null},{"id":"ct-055","level":3,"fr":"cession des droits de propriété intellectuelle","term":{"uk":"intellectual property assignment","us":"intellectual property assignment"},"ipa":{"uk":"/ˌɪntəˈlektʃuəl ˈprɒpəti əˌsaɪnmənt/","us":"/ˌɪntəˈlektʃuəl ˈprɑːpərti əˌsaɪnmənt/"},"def":"A contract term transferring to the employer the rights in what the employee creates in the course of the job.","registers":{"formal":{"uk":"to assign","us":"to assign","ex":"The Employee hereby [[assigns]] to the Company all intellectual property rights in any work created in the course of her employment."},"everyday":{"uk":"to belong to the company","us":"to belong to the company","ex":"Anything you develop on the job [[belongs to the company]] - that's standard."},"informal":null},"collocations":["to assign rights to the employer","to own the IP","a work made for hire","moral rights"],"note_fr":"« Assignment » = cession (et aussi « mission ») ; « cession » en anglais est rare et concerne surtout les territoires. Le régime diffère : en France, l'auteur salarié reste en principe titulaire de ses droits sauf cession expresse (avec des règles propres aux logiciels et aux inventions) ; aux États-Unis, la doctrine du « work made for hire » attribue l'œuvre à l'employeur.","french_concept":false,"explain":null},{"id":"ct-056","level":3,"fr":"dispense de préavis rémunérée avec maintien des obligations (« garden leave »)","term":{"uk":"garden leave","us":"garden leave"},"ipa":{"uk":"/ˈɡɑːd(ə)n liːv/","us":"/ˈɡɑːrd(ə)n liːv/"},"def":"A period during notice when the employee stays at home on full pay, remains bound by the contract and may not work for anyone else.","registers":{"formal":{"uk":"garden leave","us":"garden leave","ex":"The Company may place the Employee on [[garden leave]] for all or part of the notice period."},"everyday":{"uk":"gardening leave","us":"garden leave","ex":"They've put him on [[gardening leave]] for three months so he can't take the clients with him.","ex_us":"They've put him on [[garden leave]] for three months so he can't take the clients with him."},"informal":null},"collocations":["to put someone on garden leave","a garden leave clause","to remain on full pay","to stay away from clients"],"note_fr":"Notion essentiellement britannique (« gardening leave » à l'oral), connue aux États-Unis surtout dans la finance. Ce n'est pas la dispense de préavis française : le contrat continue, le salarié reste tenu à la loyauté et ne peut pas commencer ailleurs.","french_concept":false,"explain":null},{"id":"ct-057","level":3,"fr":"clause de dédit-formation","term":{"uk":"training costs repayment clause","us":"training costs repayment clause"},"ipa":{"uk":"/ˈtreɪnɪŋ kɒsts rɪˈpeɪmənt klɔːz/","us":"/ˈtreɪnɪŋ kɔːsts rɪˈpeɪmənt klɔːz/"},"def":"A contract term requiring an employee to reimburse training costs if he or she leaves within a set period after the training.","registers":{"formal":{"uk":"training costs repayment clause","us":"training repayment agreement","ex":"Under the [[training costs repayment clause]], the sum repayable decreases by one twenty-fourth for each complete month of service.","ex_us":"Under the [[training repayment agreement]], the sum repayable decreases by one twenty-fourth for each complete month of service."},"everyday":{"uk":"to pay back","us":"to pay back","ex":"If she leaves within two years, she'll have [[to pay back]] part of the course fees."},"informal":null},"collocations":["to repay training costs","on a sliding scale","to recover the cost of training","to leave within two years"],"note_fr":"Pas de traduction figée : évitez « forfeit clause » ou « training penalty ». En France, la clause n'est valable que si la formation dépasse les obligations légales ou conventionnelles de l'employeur, si le montant est proportionné et si elle ne prive pas le salarié de sa faculté de démissionner.","french_concept":true,"explain":{"written":"A clause de dédit-formation is a French contractual clause under which an employee who resigns within a specified period after employer-funded training must repay a proportionate share of its cost.","spoken":"It's a training payback clause: if we fund an expensive course and the person resigns soon afterwards, they owe us part of the cost."}},{"id":"ct-058","level":3,"fr":"clause de restitution (de bonus ou de primes)","term":{"uk":"clawback clause","us":"clawback clause"},"ipa":{"uk":"/ˈklɔːbæk klɔːz/","us":"/ˈklɔːbæk klɔːz/"},"def":"A contract term allowing the employer to recover money already paid, typically a bonus, if certain events occur.","registers":{"formal":{"uk":"clawback provision","us":"clawback provision","ex":"Any bonus paid under this scheme is subject to the [[clawback provision]] in clause 9."},"everyday":{"uk":"to claw back","us":"to claw back","ex":"If he leaves within a year, they can [[claw back]] the sign-on bonus."},"informal":null},"collocations":["to be subject to clawback","to claw back a bonus","malus and clawback","a sign-on bonus"],"note_fr":"Terme propre à la rémunération variable, courant dans la finance. Prudence en France : les sanctions pécuniaires sont interdites et une telle clause n'est admise que dans des limites étroites. « To claw back » se sépare : « to claw the money back ».","french_concept":false,"explain":null},{"id":"ct-059","level":3,"fr":"clause de variation / de révision unilatérale","term":{"uk":"variation clause","us":"modification clause"},"ipa":{"uk":"/ˌveəriˈeɪʃ(ə)n klɔːz/","us":"/ˌmɑːdɪfɪˈkeɪʃ(ə)n klɔːz/"},"def":"A contract term reserving the employer's right to change certain terms without a new agreement.","registers":{"formal":{"uk":"to reserve the right to vary","us":"to reserve the right to modify","ex":"The Company [[reserves the right to vary]] the Employee's duties and place of work on reasonable notice.","ex_us":"The Company [[reserves the right to modify]] the Employee's duties and place of work on reasonable notice."},"everyday":{"uk":"flexibility clause","us":"flexibility clause","ex":"There's a [[flexibility clause]] in the contract, but I wouldn't rely on it to cut anyone's pay."},"informal":null},"collocations":["to rely on a variation clause","a unilateral change","on reasonable notice","from time to time"],"note_fr":"En droit français, une clause par laquelle l'employeur se réserve de modifier unilatéralement un élément essentiel (rémunération, durée du travail) est sans effet. Au Royaume-Uni, ces clauses sont interprétées strictement ; aux États-Unis, l'employeur « at-will » peut en général modifier les conditions pour l'avenir.","french_concept":false,"explain":null},{"id":"ct-060","level":3,"fr":"clause d'intégralité (de l'accord)","term":{"uk":"entire agreement clause","us":"integration clause"},"ipa":{"uk":"/ɪnˌtaɪər əˈɡriːmənt klɔːz/","us":"/ˌɪntɪˈɡreɪʃ(ə)n klɔːz/"},"def":"A contract term stating that the written document contains everything the parties have agreed and replaces earlier discussions.","registers":{"formal":{"uk":"entire agreement clause","us":"integration clause","ex":"By virtue of the [[entire agreement clause]], this contract supersedes all previous arrangements between the parties.","ex_us":"By virtue of the [[integration clause]], this contract supersedes all prior arrangements between the parties."},"everyday":{"uk":"to replace anything agreed before","us":"to replace anything agreed before","ex":"The signed contract [[replaces anything agreed before]], so that email about the bonus doesn't count."},"informal":null},"collocations":["to supersede all prior agreements","the whole agreement","a merger clause","prior representations"],"note_fr":"Trois noms pour la même clause : « entire agreement clause » (UK), « integration clause » ou « merger clause » (US). Le verbe clé est « to supersede » (remplacer, avec un s : pas « supercede »).","french_concept":false,"explain":null},{"id":"ct-061","level":3,"fr":"clause de divisibilité (nullité partielle)","term":{"uk":"severability clause","us":"severability clause"},"ipa":{"uk":"/ˌsev(ə)rəˈbɪləti klɔːz/","us":"/ˌsev(ə)rəˈbɪləti klɔːz/"},"def":"A contract term providing that if one provision is invalid, the rest of the contract remains in force.","registers":{"formal":{"uk":"to be severed from","us":"to be severed from","ex":"Any provision held to be invalid shall [[be severed from]] this agreement, and the remaining provisions shall continue in full force and effect."},"everyday":{"uk":"the rest of the contract still stands","us":"the rest of the contract still stands","ex":"Even if the court throws out the non-compete, [[the rest of the contract still stands]]."},"informal":null},"collocations":["to sever a clause","to remain in full force and effect","to be held invalid","to strike down a clause"],"note_fr":"« To sever » /ˈsevə/ (retrancher) ne se prononce pas comme « severe » /sɪˈvɪə/. « Nullité partielle » se rend par « severance » d'une clause - à ne pas confondre avec « severance pay » (indemnité de départ).","french_concept":false,"explain":null},{"id":"ct-062","level":2,"fr":"droit applicable","term":{"uk":"governing law","us":"governing law"},"ipa":{"uk":"/ˌɡʌvənɪŋ ˈlɔː/","us":"/ˌɡʌvərnɪŋ ˈlɔː/"},"def":"The national or state law that the parties or the rules designate to interpret and regulate the contract.","registers":{"formal":{"uk":"to be governed by","us":"to be governed by","ex":"This contract shall [[be governed by]] and construed in accordance with French law."},"everyday":{"uk":"to come under","us":"to come under","ex":"She's based in London, but her contract [[comes under]] French law."},"informal":null},"collocations":["the governing law clause","a choice of law","to be construed in accordance with","mandatory rules"],"note_fr":"« Applicable law » se dit aussi, mais « governing law » est le titre habituel de la clause. « To construe » = interpréter (un texte). Aux États-Unis, la loi applicable est celle d'un État (« the laws of the State of New York »), pas une loi « américaine ». Le choix de loi ne prive pas le salarié des règles impératives protectrices.","french_concept":false,"explain":null},{"id":"ct-063","level":3,"fr":"attribution de compétence / juridiction compétente","term":{"uk":"jurisdiction","us":"jurisdiction"},"ipa":{"uk":"/ˌdʒʊərɪsˈdɪkʃ(ə)n/","us":"/ˌdʒʊrɪsˈdɪkʃ(ə)n/"},"def":"The power of a particular court to hear a dispute, or the territory in which a legal system applies.","registers":{"formal":{"uk":"to have exclusive jurisdiction","us":"to have exclusive jurisdiction","ex":"The courts of France shall [[have exclusive jurisdiction]] over any dispute arising out of this contract."},"everyday":{"uk":"to go to","us":"to go to","ex":"Any dispute would [[go to]] the French labour court, not an English tribunal.","ex_us":"Any dispute would [[go to]] the French labor court, not a US court."},"informal":null},"collocations":["to submit to the jurisdiction of","a jurisdiction clause","in this jurisdiction","a forum selection clause"],"note_fr":"« Jurisdiction » ne signifie pas « juridiction » au sens de tribunal (« a court », « a tribunal ») : c'est la compétence, ou le pays dont le droit s'applique (« in other jurisdictions »). Le conseil de prud'hommes : « the French labour court » ; au Royaume-Uni, « employment tribunal ». Aux États-Unis, la clause s'appelle « forum selection clause ».","french_concept":false,"explain":null},{"id":"ct-064","level":3,"fr":"clause de notification (modalités d'envoi des notifications)","term":{"uk":"notices clause","us":"notices clause"},"ipa":{"uk":"/ˈnəʊtɪsɪz klɔːz/","us":"/ˈnoʊtɪsɪz klɔːz/"},"def":"A contract term specifying how formal communications between the parties must be sent and when they are treated as received.","registers":{"formal":{"uk":"to serve notice","us":"to serve notice","ex":"Any [[notice served]] under this agreement shall be in writing and delivered by hand or sent by recorded delivery.","ex_us":"Any [[notice served]] under this agreement shall be in writing and delivered by hand or sent by certified mail."},"everyday":{"uk":"to notify in writing","us":"to notify in writing","ex":"You need [[to notify her in writing]] - a phone call isn't enough under the contract."},"informal":null},"collocations":["to give written notice","to be deemed received","by recorded delivery","an address for service"],"note_fr":"« To notify » est transitif direct : « to notify someone of something », jamais « to notify to someone ». La lettre recommandée avec accusé de réception : « recorded delivery » ou « signed for » (UK), « certified mail, return receipt requested » (US). « Notice » peut aussi signifier préavis : le contexte tranche.","french_concept":false,"explain":null},{"id":"ct-065","level":3,"fr":"sans préjudice de","term":{"uk":"without prejudice to","us":"without prejudice to"},"ipa":{"uk":"/wɪˌðaʊt ˈpredʒʊdɪs tə/","us":"/wɪˌðaʊt ˈpredʒədɪs tə/"},"def":"Without affecting or limiting another right or provision.","registers":{"formal":{"uk":"without prejudice to","us":"without prejudice to","ex":"[[Without prejudice to]] clause 12, the Company may suspend the Employee on full pay pending an investigation."},"everyday":{"uk":"without affecting","us":"without affecting","ex":"We can pay the bonus now [[without affecting]] her right to claim the rest later."},"informal":null},"collocations":["without prejudice to any other rights","a without-prejudice conversation","on a without-prejudice basis"],"note_fr":"« Prejudice » est un faux ami : il signifie d'abord « préjugé » ; le préjudice subi se dit « harm », « loss » ou « damage ». Au Royaume-Uni, « without prejudice » en tête d'un courrier signifie aussi que son contenu ne pourra pas être produit en justice (négociation transactionnelle). Aux États-Unis, « dismissed with/without prejudice » concerne le rejet d'une action.","french_concept":false,"explain":null},{"id":"ct-066","level":3,"fr":"nonobstant / par dérogation à","term":{"uk":"notwithstanding","us":"notwithstanding"},"ipa":{"uk":"/ˌnɒtwɪθˈstændɪŋ/","us":"/ˌnɑːtwɪθˈstændɪŋ/"},"def":"In spite of; used to say that a provision applies even if another provision appears to say otherwise.","registers":{"formal":{"uk":"notwithstanding","us":"notwithstanding","ex":"[[Notwithstanding]] clause 4, the Employee may be required to work at any of the Company's sites in France."},"everyday":{"uk":"despite","us":"despite","ex":"[[Despite]] what clause 4 says, she can be asked to work at another site."},"informal":null},"collocations":["notwithstanding the foregoing","notwithstanding any other provision","regardless of","save as provided in"],"note_fr":"Mot purement rédactionnel : ne l'employez jamais à l'oral. Il indique quelle clause l'emporte ; son symétrique est « subject to » (sous réserve de). « Notwithstanding the foregoing » = nonobstant ce qui précède.","french_concept":false,"explain":null},{"id":"ct-067","level":1,"fr":"avenant (au contrat de travail)","term":{"uk":"amendment to the contract","us":"amendment to the contract"},"ipa":{"uk":"/əˌmendmənt tə ðə ˈkɒntrækt/","us":"/əˌmendmənt tə ðə ˈkɑːntrækt/"},"def":"A written document, signed by both parties, that changes one or more terms of an existing contract.","registers":{"formal":{"uk":"amendment","us":"amendment","ex":"This [[amendment]] forms an integral part of the employment contract dated 2 May 2022.","ex_us":"This [[amendment]] forms an integral part of the employment contract dated May 2, 2022."},"everyday":{"uk":"to put a change in writing","us":"to put a change in writing","ex":"If we're changing her hours, we need [[to put the change in writing]] and get her to sign."},"informal":null},"collocations":["to sign an amendment","an amendment to the contract","an addendum","a variation letter"],"note_fr":"« Avenant » n'a pas d'équivalent unique : « amendment » (modifie le texte), « addendum » (ajoute), ou au Royaume-Uni « variation letter ». « Rider » concerne surtout les assurances. Ne dites pas « an avenant » sans l'expliquer.","french_concept":true,"explain":{"written":"An avenant is a written amendment to the employment contract which, under French law, must be signed by both parties whenever an essential term such as pay, working time or job content is changed.","spoken":"An avenant is just a signed amendment to the contract - in France you need one every time you change something essential like pay or hours."}},{"id":"ct-068","level":2,"fr":"modifier le contrat de travail","term":{"uk":"to vary a contract","us":"to modify a contract"},"ipa":{"uk":"/ˌveəri ə ˈkɒntrækt/","us":"/ˌmɑːdɪfaɪ ə ˈkɑːntrækt/"},"def":"To change one or more of the agreed terms of a contract.","registers":{"formal":{"uk":"to vary the contract","us":"to modify the contract","ex":"The employer may not [[vary the contract]] without the Employee's express agreement.","ex_us":"The employer may not [[modify the contract]] without the Employee's express agreement."},"everyday":{"uk":"to change the contract","us":"to change the contract","ex":"We can't just [[change her contract]] - she has to agree to it."},"informal":null},"collocations":["a variation of contract","a unilateral variation","to agree to a change","to impose a change"],"note_fr":"Au Royaume-Uni, le terme juridique est « variation of contract » ; un Américain dira « modification » ou « amendment ». En France, toute modification d'un élément essentiel du contrat exige l'accord du salarié, dont le refus n'est pas fautif.","french_concept":false,"explain":null},{"id":"ct-069","level":3,"fr":"simple changement des conditions de travail","term":{"uk":"change in working conditions","us":"change in working conditions"},"ipa":{"uk":"/ˌtʃeɪndʒ ɪn ˈwɜːkɪŋ kənˌdɪʃ(ə)nz/","us":"/ˌtʃeɪndʒ ɪn ˈwɜːrkɪŋ kənˌdɪʃ(ə)nz/"},"def":"In French law, a change the employer may impose without the employee's agreement because it does not affect an essential term of the contract.","registers":{"formal":{"uk":"change in working conditions","us":"change in working conditions","ex":"A mere [[change in working conditions]] falls within the employer's managerial prerogative and does not require the Employee's consent."},"everyday":{"uk":"a change we can make without consent","us":"a change we can make without consent","ex":"Moving her start time by half an hour is [[a change we can make without consent]] - it isn't a contract change."},"informal":null},"collocations":["the employer's managerial prerogative","an essential term of the contract","to refuse a change","to fall within the employer's discretion"],"note_fr":"La distinction « modification du contrat » / « changement des conditions de travail » est propre au droit français. Les Britanniques raisonnent en « contractual » / « non-contractual terms » ; expliquez toujours les deux branches et leurs conséquences.","french_concept":true,"explain":{"written":"French law distinguishes a variation of the contract, which requires the employee's consent, from a mere change in working conditions, which the employer may impose by virtue of its managerial prerogative and which the employee may not refuse without being at fault.","spoken":"In France there are two kinds of change: the ones that touch the contract itself, where you need the employee's agreement, and the day-to-day ones the employer can simply decide."}},{"id":"ct-070","level":1,"fr":"donner son accord / consentement","term":{"uk":"to give one's consent","us":"to give one's consent"},"ipa":{"uk":"/ˌɡɪv wʌnz kənˈsent/","us":"/ˌɡɪv wʌnz kənˈsent/"},"def":"To agree formally to something that is proposed.","registers":{"formal":{"uk":"express written consent","us":"express written consent","ex":"No change shall be made to the Employee's remuneration without her [[express written consent]]."},"everyday":{"uk":"to agree to","us":"to agree to","ex":"She's [[agreed to]] the new hours, so we just need her signature."},"informal":null},"collocations":["to give consent","to withhold consent","prior written consent","to agree in writing"],"note_fr":"« To agree » : pas de « to be agree » ni « I am agree ». Construction : « to agree to a change », « to agree with someone », « to agree on a date ». « Consent » /kənˈsent/ est accentué sur la seconde syllabe ; « express » (exprès) s'oppose à « implied » (tacite).","french_concept":false,"explain":null},{"id":"ct-071","level":2,"fr":"suspension du contrat de travail","term":{"uk":"suspension of the employment contract","us":"suspension of the employment contract"},"ipa":{"uk":"/səˌspenʃ(ə)n əv ði ɪmˈplɔɪmənt ˌkɒntrækt/","us":"/səˌspenʃ(ə)n əv ði ɪmˈplɔɪmənt ˌkɑːntrækt/"},"def":"A period during which the main obligations of work and pay are paused while the contract itself continues to exist.","registers":{"formal":{"uk":"to be suspended","us":"to be suspended","ex":"The employment contract shall [[be suspended]] for the duration of the parental leave."},"everyday":{"uk":"to be on leave","us":"to be on leave","ex":"While she [[is on leave]], the contract's still in place - she just isn't working or being paid by us."},"informal":null},"collocations":["during a period of leave","to remain an employee","to return to work","to be put on hold"],"note_fr":"Piège : en anglais, « to suspend an employee » ou « she's been suspended » évoque presque toujours une mise à pied (disciplinaire ou conservatoire). Pour la suspension du contrat à la française (maladie, maternité, congé parental), dites plutôt « she is on leave » et glosez.","french_concept":true,"explain":{"written":"In French law the employment contract is said to be suspended when, during events such as sick leave, maternity leave or a strike, the duties to work and to pay cease temporarily while the contract remains in existence.","spoken":"In France we say the contract is 'suspended' when someone's off sick or on parental leave - it just means the contract is on hold, not that they're in any trouble."}},{"id":"ct-072","level":1,"fr":"renouveler un contrat","term":{"uk":"to renew a contract","us":"to renew a contract"},"ipa":{"uk":"/rɪˌnjuː ə ˈkɒntrækt/","us":"/rɪˌnuː ə ˈkɑːntrækt/"},"def":"To make a contract continue for a further period after it would otherwise have ended.","registers":{"formal":{"uk":"to be renewed","us":"to be renewed","ex":"The fixed-term contract may [[be renewed]] on the conditions laid down by the applicable collective agreement."},"everyday":{"uk":"to keep someone on","us":"to keep someone on","ex":"We'd like [[to keep him on]] for another six months if the budget allows."},"informal":null},"collocations":["to renew a contract for a further term","a renewal","non-renewal","to roll a contract over"],"note_fr":"« To extend » (prolonger) et « to renew » (renouveler) sont proches ; « to keep someone on » est l'expression naturelle à l'oral. « To reconduct » n'existe pas : la tacite reconduction se dit « automatic renewal » ou « the contract rolls over ».","french_concept":false,"explain":null},{"id":"ct-073","level":1,"fr":"arriver à échéance / à son terme","term":{"uk":"to expire","us":"to expire"},"ipa":{"uk":"/ɪkˈspaɪə/","us":"/ɪkˈspaɪər/"},"def":"To come to an end because the agreed period has finished.","registers":{"formal":{"uk":"on expiry of","us":"upon expiration of","ex":"[[On expiry of]] the fixed term, the contract shall end automatically without notice.","ex_us":"[[Upon expiration of]] the fixed term, the contract shall end automatically without notice."},"everyday":{"uk":"to run out","us":"to run out","ex":"His contract [[runs out]] at the end of June, so we need to decide soon."},"informal":null},"collocations":["the expiry date","to come to an end","to be due to expire","to lapse"],"note_fr":"UK « expiry », US « expiration ». « Échéance » ne se traduit pas par « deadline » ici (date limite pour faire quelque chose) mais par « end date » ou « expiry ». « Term » = durée du contrat, d'où « the end of the term ».","french_concept":false,"explain":null},{"id":"ct-074","level":2,"fr":"transformer un CDD en CDI","term":{"uk":"to convert to a permanent contract","us":"to convert to a permanent contract"},"ipa":{"uk":"/kənˌvɜːt tə ə ˌpɜːmənənt ˈkɒntrækt/","us":"/kənˌvɜːrt tə ə ˌpɜːrmənənt ˈkɑːntrækt/"},"def":"To change a temporary employment relationship into one with no end date.","registers":{"formal":{"uk":"to be deemed to be permanent","us":"to be deemed to be permanent","ex":"Where the employee continues to work after the end of the fixed term, the contract shall [[be deemed to be permanent]]."},"everyday":{"uk":"to make someone permanent","us":"to make someone permanent","ex":"She's done so well that we've decided [[to make her permanent]]."},"informal":{"uk":"to go perm","us":"to go perm","ex":"He started as a temp and [[went perm]] after six months."}},"collocations":["to go permanent","to be taken on permanently","to become permanent by operation of law","temp-to-perm"],"note_fr":"« To be deemed » = être réputé. En France, la poursuite du travail après le terme du CDD le transforme en CDI, et le juge peut aussi requalifier un CDD irrégulier : dites « the contract was reclassified as permanent ». Au Royaume-Uni, des contrats à durée déterminée successifs peuvent aussi devenir permanents au bout d'un certain temps ; rien de tel aux États-Unis.","french_concept":false,"explain":null},{"id":"ct-075","level":3,"fr":"transfert d'entreprise (transfert automatique des contrats de travail)","term":{"uk":"transfer of an undertaking","us":"business transfer"},"ipa":{"uk":"/ˌtrænsfɜːr əv ən ˌʌndəˈteɪkɪŋ/","us":"/ˈbɪznəs ˌtrænsfɜːr/"},"def":"The sale or handover of a business or service, as a result of which the employees' contracts pass automatically to the new employer in Europe.","registers":{"formal":{"uk":"transfer of an undertaking","us":"business transfer","ex":"In the event of a [[transfer of an undertaking]], the contracts of employment shall transfer automatically to the transferee.","ex_us":"In the event of a [[business transfer]], French law provides that the employment contracts transfer automatically to the buyer."},"everyday":{"uk":"to transfer under TUPE","us":"to transfer automatically","ex":"The catering staff will [[transfer under TUPE]] when the new contractor takes over.","ex_us":"In France the catering staff will [[transfer automatically]] when the new contractor takes over."},"informal":{"uk":"to be TUPE'd across","us":"to move across","ex":"About forty of us [[were TUPE'd across]] when the contract changed hands.","ex_us":"About forty of us [[moved across]] when the contract changed hands."}},"collocations":["the transferor and the transferee","a TUPE transfer","to transfer on existing terms","to take over the staff"],"note_fr":"« TUPE » (prononcé /ˈtjuːpi/) désigne la réglementation britannique issue du droit européen, comme le transfert automatique des contrats en France. Aux États-Unis, rien de tel : en cas de cession d'actifs, l'acquéreur choisit en principe qui il réembauche. « Undertaking » = entreprise au sens du droit européen, mais aussi « engagement ».","french_concept":false,"explain":null},{"id":"ct-076","level":2,"fr":"entrer en vigueur / prendre effet","term":{"uk":"to come into force","us":"to take effect"},"ipa":{"uk":"/ˌkʌm ɪntə ˈfɔːs/","us":"/ˌteɪk ɪˈfekt/"},"def":"To start to apply and produce legal effects.","registers":{"formal":{"uk":"to come into force","us":"to take effect","ex":"This amendment shall [[come into force]] on the date of its signature by both parties.","ex_us":"This amendment shall [[take effect]] on the date of its signature by both parties."},"everyday":{"uk":"to kick in","us":"to kick in","ex":"The new salary [[kicks in]] on the first of next month."},"informal":null},"collocations":["with effect from","with immediate effect","to enter into force","as from 1 January"],"note_fr":"« To enter in vigour » est un calque. « With effect from » (UK) et « effective » + date (US : « effective March 1 ») sont les formules usuelles. « To kick in » est familier mais très courant à l'oral.","french_concept":false,"explain":null},{"id":"ct-077","level":2,"fr":"respecter (une clause, une obligation)","term":{"uk":"to comply with","us":"to comply with"},"ipa":{"uk":"/kəmˈplaɪ wɪð/","us":"/kəmˈplaɪ wɪð/"},"def":"To act in accordance with a rule, a term of a contract or a legal requirement.","registers":{"formal":{"uk":"to comply with","us":"to comply with","ex":"The Employee shall [[comply with]] all Company policies in force from time to time."},"everyday":{"uk":"to stick to","us":"to stick to","ex":"As long as both sides [[stick to]] the contract, there shouldn't be a problem."},"informal":null},"collocations":["to comply with one's obligations","to abide by the rules","to honour a commitment","in compliance with"],"note_fr":"« To respect a contract » est un calque : en anglais on « respects » une personne, on « complies with », « abides by » ou « honours » (US « honors ») une obligation. Le nom est « compliance », d'où « compliance officer ».","french_concept":false,"explain":null},{"id":"ct-078","level":2,"fr":"antidater / faire rétroagir","term":{"uk":"to backdate","us":"to backdate"},"ipa":{"uk":"/ˌbækˈdeɪt/","us":"/ˈbækdeɪt/"},"def":"To make something take effect from a date earlier than the date on which it is agreed or signed.","registers":{"formal":{"uk":"with retroactive effect from","us":"with retroactive effect from","ex":"The salary increase shall apply [[with retroactive effect from]] 1 January."},"everyday":{"uk":"to backdate","us":"to backdate","ex":"They've agreed [[to backdate]] her pay rise to January.","ex_us":"They've agreed [[to backdate]] her raise to January."},"informal":null},"collocations":["to backdate a pay rise","backdated to 1 January","back pay","retrospective effect"],"note_fr":"« To backdate a pay rise » est parfaitement légitime (effet rétroactif convenu) ; « to backdate a document » (y porter une fausse date) peut constituer une fraude : ne confondez pas. UK « retrospective » ou « retroactive », US « retroactive » ; UK « pay rise », US « raise ».","french_concept":false,"explain":null},{"id":"ct-079","level":1,"fr":"préavis","term":{"uk":"notice period","us":"notice period"},"ipa":{"uk":"/ˈnəʊtɪs ˌpɪəriəd/","us":"/ˈnoʊtɪs ˌpɪriəd/"},"def":"The length of time between telling the other party that the contract will end and the date it actually ends.","registers":{"formal":{"uk":"period of notice","us":"period of notice","ex":"Either party may terminate this contract by giving the other the [[period of notice]] specified in clause 15."},"everyday":{"uk":"notice","us":"notice","ex":"She's on three months' [[notice]], so she can't start with us before April."},"informal":null},"collocations":["to give three months' notice","to be on notice","a notice period of one month","at short notice"],"note_fr":"Notez l'apostrophe : « three months' notice », « one month's notice ». « Preavis » et « prior notice » ne désignent pas le préavis de rupture. Aux États-Unis, il n'y a en général pas de préavis légal : « two weeks' notice » est un usage de courtoisie. « At short notice » (UK) / « on short notice » (US) = au dernier moment.","french_concept":false,"explain":null},{"id":"ct-080","level":1,"fr":"démissionner","term":{"uk":"to resign","us":"to resign"},"ipa":{"uk":"/rɪˈzaɪn/","us":"/rɪˈzaɪn/"},"def":"To tell your employer formally that you are leaving your job.","registers":{"formal":{"uk":"to tender one's resignation","us":"to tender one's resignation","ex":"I hereby [[tender my resignation]] from my position as Finance Manager, with effect from 31 March.","ex_us":"I hereby [[tender my resignation]] from my position as Finance Manager, effective March 31."},"everyday":{"uk":"to hand in one's notice","us":"to give notice","ex":"He [[handed in his notice]] this morning - he's going to a competitor.","ex_us":"He [[gave notice]] this morning - he's going to a competitor."},"informal":{"uk":"to quit","us":"to quit","ex":"She [[quit]] after a row with her manager and didn't even work her notice.","ex_us":"She [[quit]] after a fight with her manager and didn't even work out her two weeks."}},"collocations":["to resign from a post","a letter of resignation","to resign with immediate effect","to walk out"],"note_fr":"Trois pièges : « to dismiss » signifie licencier, pas démissionner ; « to demission » n'existe pas ; « to resign » n'est pas « résilier » (« to terminate »). On dit « to resign from a job » ou « to resign as director ». « To walk out » = partir du jour au lendemain, sans préavis.","french_concept":false,"explain":null},{"id":"ct-081","level":2,"fr":"indemnité compensatrice de préavis","term":{"uk":"payment in lieu of notice","us":"pay in lieu of notice"},"ipa":{"uk":"/ˌpeɪmənt ɪn ˌljuː əv ˈnəʊtɪs/","us":"/ˌpeɪ ɪn ˌluː əv ˈnoʊtɪs/"},"def":"A sum paid to an employee instead of having him or her work the notice period.","registers":{"formal":{"uk":"payment in lieu of notice","us":"pay in lieu of notice","ex":"The Company may terminate the employment with immediate effect by making a [[payment in lieu of notice]].","ex_us":"The Company may terminate the employment with immediate effect by providing [[pay in lieu of notice]]."},"everyday":{"uk":"to pay someone in lieu","us":"to pay out someone's notice","ex":"We'd rather [[pay him in lieu]] than have him in the office for three months.","ex_us":"We'd rather [[pay out his notice]] than have him in the office for three months."},"informal":null},"collocations":["a PILON clause","to be paid in lieu","in lieu of notice","to waive the notice period"],"note_fr":"« In lieu of » = au lieu de, à la place de ; prononcez /ljuː/ ou /luː/, pas à la française. L'abréviation britannique est « PILON ». Aux États-Unis, la notion est moins courante puisqu'il n'y a généralement pas de préavis obligatoire.","french_concept":false,"explain":null},{"id":"ct-082","level":2,"fr":"effectuer son préavis","term":{"uk":"to work one's notice","us":"to work out one's notice"},"ipa":{"uk":"/ˌwɜːk wʌnz ˈnəʊtɪs/","us":"/ˌwɜːrk aʊt wʌnz ˈnoʊtɪs/"},"def":"To continue working normally until the end of the notice period.","registers":{"formal":{"uk":"to work the notice period","us":"to work the notice period","ex":"The Employee shall be required [[to work the notice period]] unless the Company decides otherwise."},"everyday":{"uk":"to work one's notice","us":"to work out one's notice","ex":"She's offered [[to work her notice]] in full so she can hand everything over properly.","ex_us":"She's offered [[to work out her notice]] in full so she can hand everything off properly."},"informal":{"uk":"to walk out","us":"to walk out","ex":"He just [[walked out]] on Friday - no notice, no handover, nothing."}},"collocations":["to serve one's notice","to be released from one's notice","a handover","to leave without notice"],"note_fr":"« To execute one's notice » est un calque. UK « to work one's notice », US plutôt « to work out one's notice » ou « to work one's two weeks ». Passation : « handover » (UK), « handoff » ou « transition » (US).","french_concept":false,"explain":null},{"id":"ct-083","level":1,"fr":"rompre / mettre fin au contrat","term":{"uk":"to terminate a contract","us":"to terminate a contract"},"ipa":{"uk":"/ˌtɜːmɪneɪt ə ˈkɒntrækt/","us":"/ˌtɜːrmɪneɪt ə ˈkɑːntrækt/"},"def":"To bring a contract to an end.","registers":{"formal":{"uk":"to terminate","us":"to terminate","ex":"Either party may [[terminate]] this contract by giving not less than three months' written notice."},"everyday":{"uk":"to end","us":"to end","ex":"They [[ended]] his contract during probation."},"informal":null},"collocations":["termination of employment","the termination date","to terminate with immediate effect","on termination"],"note_fr":"« To terminate » ne veut pas dire « terminer une tâche » (« to finish », « to complete »). « To resign » n'est pas « résilier ». Aux États-Unis, « he was terminated » signifie « il a été licencié » ; au Royaume-Uni, « termination » reste un terme neutre couvrant toute fin de contrat. « To break a contract » veut dire le violer, pas le rompre.","french_concept":false,"explain":null},{"id":"ct-084","level":1,"fr":"licencier","term":{"uk":"to dismiss","us":"to terminate"},"ipa":{"uk":"/dɪsˈmɪs/","us":"/ˈtɜːrmɪneɪt/"},"def":"To end someone's employment by decision of the employer.","registers":{"formal":{"uk":"to dismiss","us":"to terminate","ex":"The Company may [[dismiss]] the Employee without notice in the event of gross misconduct.","ex_us":"The Company may [[terminate]] the Employee without notice in the event of gross misconduct."},"everyday":{"uk":"to let someone go","us":"to let someone go","ex":"We had [[to let him go]] after the third warning."},"informal":{"uk":"to sack","us":"to fire","ex":"He got [[sacked]] for fiddling his expenses.","ex_us":"He got [[fired]] for padding his expenses."}},"collocations":["to be dismissed for misconduct","unfair dismissal","to get the sack","to be let go"],"note_fr":"« To dismiss » = licencier, jamais démissionner. « To license » = accorder une licence. « To let someone go » est l'euphémisme courant des deux côtés de l'Atlantique. Le licenciement économique est « redundancy » (UK) ou « layoff » (US) : « to make someone redundant » / « to lay someone off ». Aux États-Unis, le terme formel courant est « to terminate » ; « to discharge » se rencontre surtout dans les textes juridiques (« wrongful discharge »).","french_concept":false,"explain":null},{"id":"ct-085","level":2,"fr":"rupture anticipée (d'un CDD)","term":{"uk":"early termination","us":"early termination"},"ipa":{"uk":"/ˌɜːli ˌtɜːmɪˈneɪʃ(ə)n/","us":"/ˌɜːrli ˌtɜːrmɪˈneɪʃ(ə)n/"},"def":"Ending a fixed-term contract before the date on which it was due to finish.","registers":{"formal":{"uk":"early termination","us":"early termination","ex":"[[Early termination]] of a fixed-term contract is permitted only in the cases provided for by law."},"everyday":{"uk":"to end a contract early","us":"to end a contract early","ex":"We can't just [[end her contract early]] because the project's finished ahead of schedule."},"informal":null},"collocations":["to terminate early","before the end of the term","a break clause","to see out a contract"],"note_fr":"« Anticipated » est un faux ami : « anticipated termination » signifierait « rupture prévue, attendue ». En France, le CDD ne peut être rompu avant son terme que dans des cas limités (accord des parties, faute grave, force majeure, embauche en CDI...) ; les contrats britanniques contiennent souvent, eux, une clause de préavis ou « break clause ».","french_concept":false,"explain":null},{"id":"ct-086","level":2,"fr":"inexécution / violation du contrat","term":{"uk":"breach of contract","us":"breach of contract"},"ipa":{"uk":"/ˌbriːtʃ əv ˈkɒntrækt/","us":"/ˌbriːtʃ əv ˈkɑːntrækt/"},"def":"A failure by one party to do what the contract requires.","registers":{"formal":{"uk":"to be in breach of","us":"to be in breach of","ex":"An employee who discloses such information shall [[be in breach of]] this agreement."},"everyday":{"uk":"to break one's contract","us":"to break one's contract","ex":"If she starts with a competitor next week, she'll [[be breaking her contract]]."},"informal":null},"collocations":["to commit a breach","a material breach","to sue for breach of contract","a breach of trust"],"note_fr":"« Breach » /briːtʃ/ rime avec « teach ». « Violation » se dit plutôt d'une loi ou d'un règlement (surtout US). « A material breach » est un manquement grave ; au Royaume-Uni, le manquement de l'employeur justifiant le départ du salarié est un « repudiatory breach » (« constructive dismissal »).","french_concept":false,"explain":null},{"id":"ct-087","level":2,"fr":"être lié(e) par","term":{"uk":"to be bound by","us":"to be bound by"},"ipa":{"uk":"/bi ˈbaʊnd baɪ/","us":"/bi ˈbaʊnd baɪ/"},"def":"To be legally obliged to respect a contract, clause or rule.","registers":{"formal":{"uk":"to be bound by","us":"to be bound by","ex":"The Employee shall continue [[to be bound by]] clauses 12 to 14 after the termination of this agreement."},"everyday":{"uk":"to be tied to","us":"to be tied to","ex":"He's [[tied to]] a twelve-month non-compete, so he can't join them yet."},"informal":null},"collocations":["a binding agreement","legally binding","to bind the parties","non-binding"],"note_fr":"« Bound » est le participe de « to bind » (bind, bound, bound) ; ne le confondez pas avec « bound to » + verbe (« he's bound to refuse » = il va forcément refuser) ni avec « bound for » (à destination de). L'adjectif est « binding » : « a legally binding contract ».","french_concept":false,"explain":null},{"id":"ct-088","level":2,"fr":"opposable / dont on peut obtenir l'exécution en justice","term":{"uk":"enforceable","us":"enforceable"},"ipa":{"uk":"/ɪnˈfɔːsəb(ə)l/","us":"/ɪnˈfɔːrsəb(ə)l/"},"def":"Capable of being upheld and applied by a court.","registers":{"formal":{"uk":"enforceable","us":"enforceable","ex":"A non-compete covenant is [[enforceable]] only in so far as it protects a legitimate business interest."},"everyday":{"uk":"to stand up in court","us":"to stand up in court","ex":"I doubt that clause would [[stand up in court]] - it's far too wide."},"informal":null},"collocations":["to enforce a clause","legally enforceable","to be unenforceable","to hold up in court"],"note_fr":"« Opposable » n'existe pas en anglais juridique courant : dites « enforceable against someone » ou « binding on someone ». « To enforce » = faire exécuter, faire respecter ; ne traduisez pas par « to reinforce » (renforcer).","french_concept":false,"explain":null},{"id":"ct-089","level":2,"fr":"nul et non avenu","term":{"uk":"null and void","us":"null and void"},"ipa":{"uk":"/ˌnʌl ən ˈvɔɪd/","us":"/ˌnʌl ən ˈvɔɪd/"},"def":"Having no legal effect at all, as if it had never existed.","registers":{"formal":{"uk":"null and void","us":"null and void","ex":"Any clause purporting to exclude this right shall be [[null and void]]."},"everyday":{"uk":"invalid","us":"invalid","ex":"A probation clause that isn't in the signed contract is simply [[invalid]] in France."},"informal":{"uk":"not worth the paper it's written on","us":"not worth the paper it's written on","ex":"Without any compensation, that non-compete is [[not worth the paper it's written on]]."}},"collocations":["to declare a clause void","to render a contract void","void and unenforceable","to be of no effect"],"note_fr":"« Null » ne s'emploie presque jamais seul dans ce sens : dites « void », « invalid » ou « null and void ». Distinguez « void » (nul dès l'origine) et « voidable » (annulable à la demande d'une partie). « Nullity » est rare ; « null » n'a rien à voir avec « nul » au sens de « mauvais ».","french_concept":false,"explain":null},{"id":"ct-090","level":2,"fr":"renoncer à (un droit)","term":{"uk":"to waive","us":"to waive"},"ipa":{"uk":"/weɪv/","us":"/weɪv/"},"def":"To give up a right or a claim voluntarily, or to decide not to enforce it.","registers":{"formal":{"uk":"to waive","us":"to waive","ex":"The Company may [[waive]] the non-competition covenant by written notice given within fifteen days of termination."},"everyday":{"uk":"to give up","us":"to give up","ex":"She's happy [[to give up]] her notice period if it means she can start sooner."},"informal":null},"collocations":["to waive a right","to waive the notice period","a waiver","to sign a waiver"],"note_fr":"« To waive » /weɪv/ se prononce comme « to wave » (saluer) : attention à l'orthographe. « To renounce » est beaucoup plus solennel (un titre, une nationalité). Le nom est « waiver » ; « to waive a fee » = ne pas facturer des frais.","french_concept":false,"explain":null},{"id":"ct-091","level":1,"fr":"avoir droit à","term":{"uk":"to be entitled to","us":"to be entitled to"},"ipa":{"uk":"/bi ɪnˈtaɪt(ə)ld tə/","us":"/bi ɪnˈtaɪt(ə)ld tə/"},"def":"To have a legal or contractual right to receive or do something.","registers":{"formal":{"uk":"to be entitled to","us":"to be entitled to","ex":"The Employee shall [[be entitled to]] twenty-five days' paid leave per year."},"everyday":{"uk":"to get","us":"to get","ex":"You [[get]] twenty-five days' holiday a year, plus bank holidays.","ex_us":"You [[get]] twenty-five days of vacation a year, plus public holidays."},"informal":null},"collocations":["entitlement to leave","to be eligible for","to qualify for","holiday entitlement"],"note_fr":"« To have the right to » est correct mais moins idiomatique que « to be entitled to ». Ne confondez pas « entitled » (qui a droit à) et « eligible » (qui remplit les conditions pour y prétendre). Autre sens : « a report entitled... » (intitulé) ; et « he's so entitled » est péjoratif (il croit que tout lui est dû).","french_concept":false,"explain":null},{"id":"ct-092","level":2,"fr":"être soumis(e) à / sous réserve de","term":{"uk":"to be subject to","us":"to be subject to"},"ipa":{"uk":"/bi ˈsʌbdʒɪkt tə/","us":"/bi ˈsʌbdʒɪkt tə/"},"def":"To be governed by a rule, or to depend on a condition being met.","registers":{"formal":{"uk":"subject to","us":"subject to","ex":"[[Subject to]] clause 6, the Employee's salary shall be reviewed annually."},"everyday":{"uk":"to depend on","us":"to depend on","ex":"The bonus [[depends on]] you still being with us at the end of the year."},"informal":null},"collocations":["subject to approval","subject to contract","to be subject to French law","subject to change"],"note_fr":"Deux sens à distinguer : « to be subject to French law » (être soumis à) et « subject to approval » (sous réserve de). L'adjectif s'accentue sur la première syllabe /ˈsʌbdʒɪkt/, le verbe « to subject » sur la seconde /səbˈdʒekt/. « Submitted to » est un calque.","french_concept":false,"explain":null},{"id":"ct-093","level":3,"fr":"ci-après (dénommé)","term":{"uk":"hereinafter","us":"hereinafter"},"ipa":{"uk":"/ˌhɪərɪnˈɑːftə/","us":"/ˌhɪrɪnˈæftər/"},"def":"Later in this document; used to introduce the short name by which a party or thing will be called.","registers":{"formal":{"uk":"hereinafter referred to as","us":"hereinafter referred to as","ex":"Clarté Conseil SAS, [[hereinafter referred to as]] 'the Company', whose registered office is in Nantes."},"everyday":{"uk":"which we'll call","us":"which we'll call","ex":"The French entity, [[which we'll call]] the Company from now on, is the employer."},"informal":null},"collocations":["hereinafter 'the Employee'","referred to below as","as defined below","the above-mentioned"],"note_fr":"Mot de pure rédaction contractuelle. Le style moderne (« plain English ») le remplace souvent par une simple parenthèse : Clarté Conseil SAS (« the Company »). À reconnaître, pas à dire.","french_concept":false,"explain":null},{"id":"ct-094","level":3,"fr":"par la présente","term":{"uk":"hereby","us":"hereby"},"ipa":{"uk":"/ˌhɪəˈbaɪ/","us":"/ˌhɪrˈbaɪ/"},"def":"By means of this document or this statement; used to show that the words themselves perform a legal act.","registers":{"formal":{"uk":"hereby","us":"hereby","ex":"The Employee [[hereby]] acknowledges receipt of a copy of the internal rules."},"everyday":{"uk":"to confirm","us":"to confirm","ex":"I [[confirm]] that I've received a copy of the internal rules."},"informal":null},"collocations":["I hereby confirm","the parties hereby agree","to hereby acknowledge receipt","hereby certify"],"note_fr":"« Hereby » se place entre le sujet et le verbe et s'accentue sur la seconde syllabe. Réservé aux contrats et aux attestations : dans un e-mail, « I hereby inform you » est pompeux ; écrivez « I'm writing to let you know » ou « I confirm ». « By the present » est un calque.","french_concept":false,"explain":null},{"id":"ct-095","level":3,"fr":"de celui-ci / des présentes","term":{"uk":"thereof","us":"thereof"},"ipa":{"uk":"/ˌðeərˈɒv/","us":"/ˌðerˈʌv/"},"def":"Of the thing just mentioned; a drafting word used to avoid repeating a noun.","registers":{"formal":{"uk":"thereof","us":"thereof","ex":"The Employee shall return the laptop and any copies of the files stored on it, or any part [[thereof]], on the last day of employment."},"everyday":{"uk":"of it","us":"of it","ex":"You need to give back the laptop and the files, or whatever part [[of it]] you still have."},"informal":null},"collocations":["or any part thereof","the terms hereof","as provided herein","the schedule hereto"],"note_fr":"Clé de lecture : « here- » renvoie au présent document (« hereof » = des présentes, « herein » = dans le présent contrat, « hereto » = aux présentes), « there- » à la chose qui vient d'être citée (« thereof », « therein », « thereafter »). À comprendre plutôt qu'à employer.","french_concept":false,"explain":null},{"id":"ct-096","level":1,"fr":"signer","term":{"uk":"to sign","us":"to sign"},"ipa":{"uk":"/saɪn/","us":"/saɪn/"},"def":"To write your name on a document to show that you agree to it.","registers":{"formal":{"uk":"to execute","us":"to execute","ex":"This agreement has been [[executed]] by the parties on the date stated at the beginning of it."},"everyday":{"uk":"to sign","us":"to sign","ex":"Could you [[sign]] both copies and send one back to me?"},"informal":{"uk":"to sign on the dotted line","us":"to sign on the dotted line","ex":"Don't hand in your notice until you've [[signed on the dotted line]]."}},"collocations":["to sign a contract","to countersign","an electronic signature","the signatories"],"note_fr":"« To execute a contract » signifie le signer en bonne et due forme, pas l'exécuter (« to perform a contract »). Le « g » de « sign » est muet /saɪn/ mais se prononce dans « signature » /ˈsɪɡnətʃə/ et « signatory ». On signe « a contract », sans préposition.","french_concept":false,"explain":null},{"id":"ct-097","level":2,"fr":"valider / donner son feu vert","term":{"uk":"to sign off on","us":"to sign off on"},"ipa":{"uk":"/ˌsaɪn ˈɒf ɒn/","us":"/ˌsaɪn ˈɔːf ɑːn/"},"def":"To give formal approval to something so that it can go ahead.","registers":{"formal":{"uk":"to approve","us":"to approve","ex":"Any amendment to the remuneration package must be [[approved]] by the Remuneration Committee.","ex_us":"Any amendment to the compensation package must be [[approved]] by the Compensation Committee."},"everyday":{"uk":"to sign off on","us":"to sign off on","ex":"Legal still has [[to sign off on]] the non-compete before we send the contract out."},"informal":{"uk":"to OK","us":"to OK","ex":"Has the CFO [[OK'd]] the package yet?"}},"collocations":["to get sign-off","to sign something off","subject to sign-off","to give the go-ahead"],"note_fr":"« To validate » est un calque dans ce sens : dites « to approve », « to sign off on » ou « to clear ». UK : aussi « to sign something off » sans « on ». Ne confondez pas avec « to sign off » seul (terminer un message, ou UK : être mis en arrêt maladie par un médecin - « he's been signed off »).","french_concept":false,"explain":null},{"id":"ct-098","level":2,"fr":"parapher (chaque page)","term":{"uk":"to initial","us":"to initial"},"ipa":{"uk":"/ɪˈnɪʃ(ə)l/","us":"/ɪˈnɪʃ(ə)l/"},"def":"To write the first letters of your name on a page or next to a change to show that you have seen and accepted it.","registers":{"formal":{"uk":"to initial","us":"to initial","ex":"Each page of this contract shall be [[initialled]] by both parties.","ex_us":"Each page of this contract shall be [[initialed]] by both parties."},"everyday":{"uk":"to put one's initials","us":"to put one's initials","ex":"Just [[put your initials]] at the bottom of each page and sign the last one."},"informal":null},"collocations":["to initial each page","to initial a change","to sign and date","initials"],"note_fr":"Orthographe : UK « initialled », US « initialed ». « To paraph » n'existe pas. La mention manuscrite « lu et approuvé » n'a pas d'équivalent : inutile de la traduire dans un contrat de droit anglais ou américain.","french_concept":false,"explain":null},{"id":"ct-099","level":3,"fr":"exemplaire (original signé d'un contrat)","term":{"uk":"counterpart","us":"counterpart"},"ipa":{"uk":"/ˈkaʊntəpɑːt/","us":"/ˈkaʊntərpɑːrt/"},"def":"One of several identical original copies of a contract, each signed by one or more of the parties.","registers":{"formal":{"uk":"to be executed in counterparts","us":"to be executed in counterparts","ex":"This agreement may [[be executed in counterparts]], each of which shall be deemed an original."},"everyday":{"uk":"signed copy","us":"signed copy","ex":"Keep one [[signed copy]] for yourself and send the other back to HR."},"informal":null},"collocations":["in two counterparts","each party's counterpart","in duplicate","an original copy"],"note_fr":"« Exemplaire » ne se traduit pas par « exemplary » (exemplaire au sens moral) ni par « example ». « En double exemplaire » : « in duplicate » ou « in two original copies ». Autre sens courant : « my counterpart in London » = mon homologue.","french_concept":false,"explain":null},{"id":"ct-100","level":2,"fr":"date d'effet / date de prise d'effet","term":{"uk":"effective date","us":"effective date"},"ipa":{"uk":"/ɪˈfektɪv ˌdeɪt/","us":"/ɪˈfektɪv ˌdeɪt/"},"def":"The date from which a contract or a change to it starts to apply.","registers":{"formal":{"uk":"effective date","us":"effective date","ex":"This agreement shall commence on the [[Effective Date]] and continue until terminated in accordance with clause 15."},"everyday":{"uk":"as of","us":"as of","ex":"Her new title applies [[as of]] 1 March.","ex_us":"Her new title applies [[as of]] March 1."},"informal":null},"collocations":["with effect from","effective immediately","the effective date of termination","to take effect on"],"note_fr":"« Effective » ne veut pas dire « effectif » au sens de « réel » (« actual ») ni au sens de « effectifs » (« headcount », « workforce ») : il signifie « qui prend effet » ou « efficace ». Dates : UK « 1 March », US « March 1 ». « Actually » = en fait, « currently » = actuellement.","french_concept":false,"explain":null}]},"skills":{"contract":{"reading":[{"id":"rd-ct-1","title":"Probationary Period and Notice","kind":"contract clause","level":3,"paragraphs":["4. PROBATIONARY PERIOD","4.1 The Employee's employment shall be subject to a probationary period of [three] months commencing on the Start Date (the 'Probationary Period'), during which each party may assess whether the employment relationship meets its expectations.","4.2 The Probationary Period may be renewed once, for a further period not exceeding [three] months, provided that such renewal is permitted by the applicable collective bargaining agreement and that the Employee has given his or her express written consent prior to the expiry of the initial period.","4.3 During the Probationary Period, either party may terminate this Agreement without having to state its reasons and without any severance payment being due, subject to the minimum notice prescribed by law, the length of which depends on the time the Employee has actually spent with the Company.","4.4 Any period during which the Employee's work is suspended, in particular by reason of sickness or paid leave, shall extend the Probationary Period by an equivalent duration.","5. NOTICE","5.1 Upon satisfactory completion of the Probationary Period, the Employee's appointment shall be confirmed and this Agreement may be terminated by either party in accordance with the French Labour Code and the applicable collective bargaining agreement.","5.2 Save in the event of gross misconduct, the party terminating this Agreement shall give the other party [three] months' written notice.","5.3 The Company may, at its sole discretion, release the Employee from working all or part of the notice period, in which case the Employee shall receive a payment in lieu of notice equal to the remuneration he or she would have earned by working until the end of that period.","5.4 Nothing in this clause shall deprive the Employee of any more favourable entitlement arising under the applicable collective bargaining agreement."],"glossary":[{"term":"probationary period","plain":"a trial period at the start of a job, during which either side can end the contract easily","fr":"période d'essai"},{"term":"collective bargaining agreement","plain":"a written agreement on pay and conditions negotiated between employers and trade unions","fr":"convention collective"},{"term":"express written consent","plain":"agreement that is clearly stated in writing, not just assumed","fr":"accord exprès et écrit"},{"term":"severance payment","plain":"money paid to an employee because the contract is being ended","fr":"indemnité de rupture / de licenciement"},{"term":"gross misconduct","plain":"behaviour so serious that the employee can be dismissed without notice","fr":"faute grave"},{"term":"notice period","plain":"the time between announcing the end of the contract and the last day of work","fr":"préavis"},{"term":"payment in lieu of notice","plain":"money paid instead of having the employee work the notice period","fr":"indemnité compensatrice de préavis"}],"legalese":[{"phrase":"shall be subject to","plain":"will be governed by / will depend on"},{"phrase":"provided that","plain":"on condition that; only if"},{"phrase":"Save in the event of","plain":"except in the case of"},{"phrase":"at its sole discretion","plain":"if it alone decides to; it does not need anyone's agreement"},{"phrase":"Nothing in this clause shall deprive the Employee of","plain":"this clause does not take away the employee's right to"}],"questions":[{"q":"Under clause 4.2, what is needed for the probationary period to be renewed?","options":["A decision by the Company, notified in writing","The collective agreement must allow it and the Employee must agree in writing beforehand","The Employee's verbal agreement at any time","Nothing: renewal is automatic unless the Employee objects"],"answer":1,"explain_fr":"'Provided that' introduit deux conditions cumulatives : la convention collective doit le permettre et le salarié doit donner son accord exprès écrit avant l'expiration de la période initiale."},{"q":"What does clause 4.3 say about ending the contract during probation?","options":["Either party may end it without giving reasons, but must respect a minimum notice","Only the Company may end it, and it must explain why","It can be ended immediately, with no notice of any kind","A severance payment is due if the Company ends it"],"answer":0,"explain_fr":"'Either party' = l'une ou l'autre des parties. La rupture n'a pas à être motivée et n'ouvre pas droit à indemnité, mais reste 'subject to the minimum notice prescribed by law' (le délai de prévenance)."},{"q":"What happens if the Employee is off sick for two weeks during the probationary period?","options":["The probationary period ends early","Nothing changes","The Company may terminate without notice","The probationary period is extended by two weeks"],"answer":3,"explain_fr":"Clause 4.4 : toute suspension du travail prolonge la période d'essai 'by an equivalent duration', c'est-à-dire d'une durée égale à celle de l'absence."},{"q":"In clause 5.3, what does 'payment in lieu of notice' mean?","options":["A bonus for completing the notice period","Compensation for unfair dismissal","Pay received instead of working the notice period","A deduction made when the Employee leaves early"],"answer":2,"explain_fr":"'In lieu of' signifie 'à la place de'. Le salarié dispensé de préavis perçoit la rémunération qu'il aurait gagnée : c'est l'indemnité compensatrice de préavis."}]},{"id":"rd-ct-2","title":"Staff Handbook: Confidentiality and Outside Activities","kind":"policy extract","level":2,"paragraphs":["7. Confidentiality","In the course of your work you will have access to information that is not in the public domain: client lists, pricing, salary data, business plans and the personal details of colleagues and candidates. You must not disclose such information to anyone outside the Company, or use it for any purpose other than the proper performance of your duties, unless you have been authorised to do so or are required to by law.","This obligation applies throughout your employment and continues to apply after you leave, for as long as the information remains confidential. On your last working day you must return all documents, devices and files belonging to the Company, including any copies held on personal equipment.","Nothing in this policy prevents you from reporting wrongdoing through the Company's whistleblowing procedure or to the competent authorities, nor does it restrict the freedom of expression of employee representatives in the exercise of their mandate.","8. Outside activities","You owe the Company a duty of loyalty for the duration of your contract. In practice, this means that you may not work for a competitor, or set up a competing business, while you are still employed by us, whether or not your contract contains an exclusivity clause.","Other outside activities, paid or unpaid, are generally permitted, provided that they do not give rise to a conflict of interest, do not affect your performance and do not take you beyond the statutory limits on working time. If you are in any doubt, please speak to your line manager or to HR before taking on the activity; it is far easier to resolve a question in advance than after the event.","A serious or deliberate breach of this policy may result in disciplinary action, up to and including dismissal."],"glossary":[{"term":"in the public domain","plain":"known or available to everybody","fr":"public, accessible à tous"},{"term":"disclose","plain":"to reveal information to someone","fr":"divulguer"},{"term":"whistleblowing procedure","plain":"the official way for staff to report illegal or unethical behaviour","fr":"procédure d'alerte (lanceurs d'alerte)"},{"term":"duty of loyalty","plain":"the obligation not to act against your employer's interests while you work for them","fr":"obligation de loyauté"},{"term":"exclusivity clause","plain":"a term in the contract that forbids the employee from having any other job","fr":"clause d'exclusivité"},{"term":"conflict of interest","plain":"a situation where your personal interests could influence your decisions at work","fr":"conflit d'intérêts"},{"term":"line manager","plain":"the person you report to directly","fr":"supérieur hiérarchique direct (N+1)"},{"term":"disciplinary action","plain":"a formal measure taken by the employer in response to misconduct","fr":"sanction disciplinaire"}],"legalese":[{"phrase":"for any purpose other than","plain":"for any reason except"},{"phrase":"Nothing in this policy prevents you from","plain":"this policy does not stop you from"},{"phrase":"give rise to","plain":"cause; create"},{"phrase":"up to and including dismissal","plain":"any sanction, the most serious possible being dismissal"}],"questions":[{"q":"How long does the duty of confidentiality last?","options":["Until the last working day","For a fixed period after the employee leaves","Only during working hours","During employment and afterwards, as long as the information is still confidential"],"answer":3,"explain_fr":"Le texte précise : 'continues to apply after you leave, for as long as the information remains confidential'. Aucune durée fixe n'est indiquée."},{"q":"Which of the following does the policy expressly protect?","options":["Reporting wrongdoing through the whistleblowing procedure","Sharing salary data with a recruiter","Keeping copies of files on a personal laptop","Talking to the press about business plans"],"answer":0,"explain_fr":"'Nothing in this policy prevents you from reporting wrongdoing' : la confidentialité ne peut pas faire obstacle à un signalement ni à la liberté d'expression des représentants du personnel."},{"q":"An employee whose contract has no exclusivity clause wants to work for a competitor at weekends. According to the policy, this is:","options":["Allowed, because there is no exclusivity clause","Allowed if the line manager is informed afterwards","Not allowed, because of the duty of loyalty","Allowed provided it is unpaid"],"answer":2,"explain_fr":"'Whether or not your contract contains an exclusivity clause' : l'obligation de loyauté s'applique dans tous les cas pendant le contrat et interdit de travailler pour un concurrent."},{"q":"What should an employee do if unsure whether an outside activity is acceptable?","options":["Start the activity and mention it at the next appraisal","Raise it with the line manager or HR before starting","Ask the employee representatives for permission","Wait until HR raises the question"],"answer":1,"explain_fr":"'Before taking on the activity' : il faut en parler en amont. 'To take on' = accepter, entreprendre (une activité, une mission)."}]},{"id":"rd-ct-3","title":"Fixed-term contracts and non-competes in our Lyon office","kind":"long email","level":2,"paragraphs":["Dear Claire,","I hope you're well, and thank you again for your help with the handbook last month. I'm writing because two issues have come up in our Lyon office and, to be frank, I'm rather out of my depth with the French rules.","The first concerns our fixed-term staff. We currently have four people in customer support on fixed-term contracts, all of which run out at the end of the quarter. Their manager would like to keep them on, and my instinct was simply to roll the contracts over for another six months, as we might well do in the UK. However, a colleague has warned me that this could backfire in France. Is it true that a fixed-term contract can only be used for a temporary need, and that a tribunal could treat these employees as permanent if we get it wrong? If so, I'd rather convert them now and do it properly. Could you let me know what a conversion involves in practice: is a simple amendment enough, or do we need to issue new contracts?","The second point is non-compete clauses. Our standard UK contract includes a six-month restriction for sales staff, and head office is keen to roll it out across the group. I gather that in France the employer has to pay for a non-compete, which came as something of a surprise. Would you mind setting out, in broad terms, what makes such a clause valid, and whether we could waive it if an employee leaves and we decide we no longer need the protection?","I appreciate this is a lot to ask in one email. There's no great rush, but it would be helpful to have your initial thoughts before our board meeting on the 14th, if at all possible.","Many thanks in advance, and do shout if you need anything further from me.","Kind regards,","Harriet"],"glossary":[{"term":"out of my depth","plain":"in a situation that is too difficult for me because I lack the knowledge","fr":"dépassé(e), pas dans mon élément"},{"term":"run out","plain":"to come to an end; to expire","fr":"arriver à échéance, expirer"},{"term":"keep them on","plain":"to continue to employ them","fr":"les garder (dans l'entreprise)"},{"term":"roll the contracts over","plain":"to renew the contracts on the same terms","fr":"reconduire les contrats"},{"term":"backfire","plain":"to have the opposite effect to the one intended","fr":"se retourner contre nous"},{"term":"roll it out","plain":"to introduce it progressively everywhere","fr":"le déployer, le généraliser"},{"term":"I gather","plain":"I understand, from what I have heard or read","fr":"je crois comprendre que"},{"term":"waive","plain":"to choose not to use a right or enforce a rule","fr":"renoncer à (un droit, une clause)"}],"legalese":[],"questions":[{"q":"What was Harriet's first idea for the four fixed-term employees?","options":["To convert them to permanent contracts","To let the contracts end","To renew the contracts for a further six months","To move them to the UK"],"answer":2,"explain_fr":"'My instinct was simply to roll the contracts over for another six months' : 'to roll over' signifie reconduire à l'identique."},{"q":"What risk has a colleague warned her about?","options":["A tribunal could treat the employees as permanent staff","The employees might resign","Head office might refuse the budget","The contracts could not be translated"],"answer":0,"explain_fr":"Elle évoque la requalification : 'a tribunal could treat these employees as permanent if we get it wrong'. En français, on parlerait de requalification du CDD en CDI."},{"q":"What surprised Harriet about French non-compete clauses?","options":["They are forbidden for sales staff","They cannot last six months","They must be approved by head office","The employer has to pay for them"],"answer":3,"explain_fr":"'Which came as something of a surprise' est un bel exemple d'euphémisme britannique : en réalité, elle a été très surprise par l'exigence d'une contrepartie financière."},{"q":"How urgent is her request?","options":["She needs a full report by tomorrow","Not very, but she would like first thoughts before the board meeting","There is no deadline at all","She needs the answer before the end of the quarter"],"answer":1,"explain_fr":"'There's no great rush, but it would be helpful ... if at all possible' : une demande polie mais réelle. 'Initial thoughts' = un premier avis, pas une analyse complète."}]},{"id":"rd-ct-4","title":"Changing an employee's terms in France: contract or working conditions?","kind":"client memo","level":3,"paragraphs":["You asked whether the Paris office can move three account managers onto a new schedule and a revised bonus plan without their consent. The short answer is: the schedule, probably yes; the bonus plan,
