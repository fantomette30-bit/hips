# Publie la version hors ligne du jeu (dossier docs/) sur GitHub Pages.
#
# Le jeu en service passe par le sas Vercel (Tools/vercel-shell) : Pages n'est
# qu'une copie de secours. Le workflow vérifie donc d'abord que Pages est
# activé en mode « GitHub Actions » ; sinon il s'arrête proprement avec une
# note, au lieu d'échouer (et d'envoyer un courriel d'échec) à chaque envoi.
# Le jeton du workflow ne peut pas activer Pages lui-même : c'est un réglage
# du dépôt, Settings → Pages → Source : GitHub Actions.
name: Publier le jeu

on:
  push:
    branches: [claude/sudoku-premium-iphone-app-ji3x03]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    outputs:
      actif: ${{ steps.etat.outputs.actif }}
    steps:
      - name: Pages est-il activé en mode GitHub Actions ?
        id: etat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 tant que Pages n'est pas activé ; « legacy » s'il sert une branche
          if ! mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null); then
            mode=""
          fi
          if [ "$mode" = "workflow" ]; then
            echo "actif=true" >> "$GITHUB_OUTPUT"
            echo "Pages est activé : publication de docs/."
          else
            echo "actif=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages non utilisé::Rien à publier ici (Pages : ${mode:-non activé}). Le jeu en service passe par le sas Vercel. Pour publier aussi sur Pages : Settings → Pages → Source : GitHub Actions."
          fi

  publier:
    needs: verifier
    if: needs.verifier.outputs.actif == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Configurer Pages
        uses: actions/configure-pages@v6

      - name: Préparer le dossier docs/
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v5
