# Publie la version hors ligne du jeu (dossier docs/) sur GitHub Pages.
# Le premier passage active Pages tout seul : rien à régler à la main.
name: Publier le jeu

on:
  push:
    branches: [claude/sudoku-premium-iphone-app-ji3x03]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Activer et configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer le dossier docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
